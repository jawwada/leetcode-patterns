omputed once for every one of its ancestors, O(n^2) on a skewed tree.", "time": "O(n^2)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef height(node):\n    \"\"\"Number of nodes on the longest path down from node.\"\"\"\n    if node is None:\n        return 0\n    return 1 + max(height(node.left), height(node.right))\n\n\ndef brute_force(root):\n    \"\"\"At each node the longest path bending there is height(left) + height(right). O(n^2) worst.\"\"\"\n    if root is None:\n        return 0\n    through_root = height(root.left) + height(root.right)   # heights recomputed for every node\n    return max(through_root, brute_force(root.left), brute_force(root.right))\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(build_tree([1, 2, 3, 4, 5])))            # -> 3\nprint(brute_force(build_tree([1, 2])))                     # -> 1\nprint(brute_force(build_tree([])))                         # -> 0\nprint(brute_force(build_tree([1, None, 2, None, 3])))      # -> 2\n", "pseudo": "height(node): 0 if empty, else 1 + max(height(node.left), height(node.right))\nif the root is empty: return 0\nthrough root = height(root.left) + height(root.right)   (heights recomputed for every node)\nreturn max(through root, brute_force(root.left), brute_force(root.right))"}, "opt": {"text": "height() is already a post-order recursion that computes height(left) and height(right) on the way, and those two numbers are exactly what the diameter-through-node formula needs. So instead of calling height() again from outside, update a running best = max(best, left + right) inside height() while the values are at hand. Each node's height is then computed exactly once and the answer falls out of a single pass. Invariant: when height(node) returns, best accounts for every path whose highest point lies inside node's subtree.", "time": "O(n)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef height_and_best(node):\n    \"\"\"Return (height of node's subtree, longest path inside it), both measured in one pass.\"\"\"\n    if node is None:\n        return 0, 0\n    left_height, left_best = height_and_best(node.left)\n    right_height, right_best = height_and_best(node.right)\n    through_node = left_height + right_height      # the path that bends at this node\n    best = max(through_node, left_best, right_best)\n    return 1 + max(left_height, right_height), best\n\n\ndef diameter_of_binary_tree(root):\n    \"\"\"One post-order pass computes each height exactly once. O(n) time, O(h) stack.\"\"\"\n    root_height, best = height_and_best(root)\n    return best\n\n\n# --- try it: change the inputs and run ---\nprint(diameter_of_binary_tree(build_tree([1, 2, 3, 4, 5])))            # -> 3\nprint(diameter_of_binary_tree(build_tree([1, 2])))                     # -> 1\nprint(diameter_of_binary_tree(build_tree([])))                         # -> 0\nprint(diameter_of_binary_tree(build_tree([1, None, 2, None, 3])))      # -> 2\n", "pseudo": "height_and_best(node):\n    if the node is empty: return 0, 0\n    left height, left best = height_and_best(node.left)\n    right height, right best = height_and_best(node.right)\n    through node = left height + right height   (the path that bends at this node)\n    best = max(through node, left best, right best)\n    return 1 + max(left height, right height), best\nroot height, best = height_and_best(root)\nreturn best"}}, "path_sum_ii": {"slug": "path_sum_ii", "topic": "trees", "title": "Path Sum II", "leetcode": 113, "difficulty": "Medium", "pattern": "DFS backtracking with a shared path list", "statement": "Given a binary tree and target_sum, return every root-to-leaf path (as a list of node\nvalues) whose values add up to target_sum.\nExample: root = [5, 4, 8, 11, None, 13, 4, 7, 2, None, None, 5, 1], target_sum = 22\n-> [[5, 4, 11, 2], [5, 8, 4, 5]]", "why_here": "Carry the whole path down in one shared list and backtrack it on the way up.", "lc_slug": "path-sum-ii", "brute": {"text": "Build a fresh copy of the path at every node (path + [val]), collect every root-to-leaf path, then sum each and keep the matches. Every internal node copies the whole prefix and every leaf re-sums a prefix its ancestors already added, even when nothing matches.", "time": "O(n*h)", "space": "O(n*h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef collect_paths(node, path, paths):\n    \"\"\"Record every root-to-leaf path as its own list of values.\"\"\"\n    if node is None:\n        return\n    path = path + [node.val]           # a fresh copy of the prefix at every node\n    if node.left is None and node.right is None:\n        paths.append(path)\n    collect_paths(node.left, path, paths)\n    collect_paths(node.right, path, paths)\n\n\ndef brute_force(root, target_sum):\n    \"\"\"Collect every root-to-leaf path, then keep those that sum to the target. O(n*h).\"\"\"\n    paths = []\n    collect_paths(root, [], paths)\n    matching = []\n    for path in paths:\n        if sum(path) == target_sum:    # every path is summed from scratch\n            matching.append(path)\n    return matching\n\n\n# --- try it: change the inputs and run ---\nbig = [5, 4, 8, 11, None, 13, 4, 7, 2, None, None, 5, 1]\nprint(brute_force(build_tree(big), 22))                 # -> [[5, 4, 11, 2], [5, 8, 4, 5]]\nprint(brute_force(build_tree([1, 2, 3]), 5))            # -> []\nprint(brute_force(build_tree([]), 0))                   # -> []\nsmall = [1, -2, -3, 1, 3, -2, None, -1]\nprint(brute_force(build_tree(small), -1))               # -> [[1, -2, 1, -1]]\n", "pseudo": "paths = empty list\ncollect_paths(node, path, paths):\n    if the node is empty: return\n    path = path + [node.val]   (a fresh copy of the prefix at every node)\n    if the node is a leaf: add path to paths\n    collect_paths(node.left, path, paths)\n    collect_paths(node.right, path, paths)\ncollect_paths(root, empty path, paths)\nmatching = empty list\nfor each path in paths:\n    if sum of path == target sum: add path to matching\nreturn matching"}, "opt": {"text": "There are two redundancies. Re-summing: carry the remaining target down so each node does one subtraction and a leaf only checks remaining == 0. Re-copying: all paths share prefixes, so keep one mutable list, append the node on entry and pop it on exit (backtracking), and copy it only when a leaf actually matches. Copies are then paid only for output, which is unavoidable. This is the original solution's shape: preorder, shared path, pop on return.", "time": "O(n*h)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef dfs(node, remaining, path, answers):\n    \"\"\"Walk down with one shared path; remaining is what is still needed to hit the target.\"\"\"\n    if node is None:\n        return\n    path.append(node.val)\n    remaining = remaining - node.val\n    if node.left is None and node.right is None:\n        if remaining == 0:\n            answers.append(path[:])          # copy: path keeps changing after this\n    else:\n        dfs(node.left, remaining, path, answers)\n        dfs(node.right, remaining, path, answers)\n    path.pop()                               # backtrack so siblings see the right prefix\n\n\ndef path_sum(root, target_sum):\n    \"\"\"One shared path with backtracking; copy only on a match. O(n) time plus the output.\"\"\"\n    answers = []\n    dfs(root, target_sum, [], answers)\n    return answers\n\n\n# --- try it: change the inputs and run ---\nbig = [5, 4, 8, 11, None, 13, 4, 7, 2, None, None, 5, 1]\nprint(path_sum(build_tree(big), 22))                 # -> [[5, 4, 11, 2], [5, 8, 4, 5]]\nprint(path_sum(build_tree([1, 2, 3]), 5))            # -> []\nprint(path_sum(build_tree([]), 0))                   # -> []\nsmall = [1, -2, -3, 1, 3, -2, None, -1]\nprint(path_sum(build_tree(small), -1))               # -> [[1, -2, 1, -1]]\n", "pseudo": "answers = empty list\ndfs(node, remaining, path, answers):   (one shared path, extended and shrunk)\n    if the node is empty: return\n    append node.val to path, remaining = remaining - node.val\n    if the node is a leaf:\n        if remaining == 0: add a copy of path to answers\n    else:\n        dfs(node.left, remaining, path, answers)\n        dfs(node.right, remaining, path, answers)\n    remove the last value from path   (backtrack)\ndfs(root, target sum, empty path, answers)\nreturn answers"}}, "binary_tree_level_order_traversal": {"slug": "binary_tree_level_order_traversal", "topic": "trees", "title": "Binary Tree Level Order Traversal", "leetcode": 102, "difficulty": "Medium", "pattern": "BFS by level (queue snapshot)", "statement": "Return the node values level by level, left to right, as a list of lists.\nExample: [3, 9, 20, None, None, 15, 7] -> [[3], [9, 20], [15, 7]]", "why_here": "Switch from depth to breadth: a queue with a per-level snapshot.", "lc_slug": "binary-tree-level-order-traversal", "brute": {"text": "Compute the height h, then for each depth d run a fresh DFS over the whole tree collecting nodes whose depth equals d. Every pass walks all n nodes but keeps only one level, so each node is visited h times (O(n^2) on a skewed tree).", "time": "O(n*h)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef height(node):\n    \"\"\"Number of nodes on the longest path down from node.\"\"\"\n    if node is None:\n        return 0\n    return 1 + max(height(node.left), height(node.right))\n\n\ndef collect_depth(node, depth, target, out):\n    \"\"\"Append the values of every node at exactly depth target, left to right.\"\"\"\n    if node is None:\n        return\n    if depth == target:\n        out.append(node.val)\n    else:\n        collect_depth(node.left, depth + 1, target, out)\n        collect_depth(node.right, depth + 1, target, out)\n\n\ndef brute_force(root):\n    \"\"\"One full walk of the tree per level. O(n*h) time.\"\"\"\n    result = []\n    for depth in range(height(root)):\n        level = []\n        collect_depth(root, 0, depth, level)    # a full traversal per level\n        result.append(level)\n    return result\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(build_tree([3, 9, 20, None, None, 15, 7])))   # -> [[3], [9, 20], [15, 7]]\nprint(brute_force(build_tree([1])))                             # -> [[1]]\nprint(brute_force(build_tree([])))                              # -> []\nprint(brute_force(build_tree([1, 2, 3, 4, None, None, 5])))     # -> [[1], [2, 3], [4, 5]]\n", "pseudo": "height(node): 0 if empty, else 1 + max(height(node.left), height(node.right))\ncollect_depth(node, depth, target, out):\n    if the node is empty: return\n    if depth == target: append node.val to out\n    else:\n        collect_depth(node.left, depth + 1, target, out)\n        collect_depth(node.right, depth + 1, target, out)\nresult = empty list\nfor each depth from 0 to height(root) - 1:\n    level = empty list\n    collect_depth(root, 0, depth, level)   (a full traversal per level)\n    append level to result\nreturn result"}, "opt": {"text": "The brute force re-discovers the nodes of level d+1 while it is already standing on level d: they are the children of what it just collected. So keep them. A FIFO queue naturally holds the frontier in left-to-right order, and remembering how many nodes were in the queue when a level started lets you pop exactly one complete level while its children accumulate behind. Every node is enqueued and dequeued once. Invariant: at the top of the outer loop the queue holds exactly the nodes of one level, left to right.", "time": "O(n)", "space": "O(w)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef level_order(root):\n    \"\"\"A queue holds exactly one level at a time; its size says how many to pop. O(n) time.\"\"\"\n    if root is None:\n        return []\n    result = []\n    queue = deque([root])\n    while len(queue) > 0:\n        level = []\n        count = len(queue)                  # exactly the nodes of this level\n        for _ in range(count):\n            node = queue.popleft()\n            level.append(node.val)\n            if node.left is not None:       # children line up behind, forming the next level\n                queue.append(node.left)\n            if node.right is not None:\n                queue.append(node.right)\n        result.append(level)\n    return result\n\n\n# --- try it: change the inputs and run ---\nprint(level_order(build_tree([3, 9, 20, None, None, 15, 7])))   # -> [[3], [9, 20], [15, 7]]\nprint(level_order(build_tree([1])))                             # -> [[1]]\nprint(level_order(build_tree([])))                              # -> []\nprint(level_order(build_tree([1, 2, 3, 4, None, None, 5])))     # -> [[1], [2, 3], [4, 5]]\n", "pseudo": "if the root is empty: return empty list\nresult = empty list, queue = deque holding root\nwhile the queue is not empty:\n    level = empty list\n    count = size of the queue   (exactly the nodes of this level)\n    repeat count times:\n        node = pop the front\n        append node.val to level\n        if node.left exists: push node.left to the back\n        if node.right exists: push node.right to the back\n    append level to result\nreturn result"}}, "binary_tree_inorder_traversal": {"slug": "binary_tree_inorder_traversal", "topic": "trees", "title": "Binary Tree Inorder Traversal", "leetcode": 94, "difficulty": "Easy", "pattern": "Iterative traversal with an explicit stack", "statement": "Return the values of a binary tree in inorder: left subtree, then the node, then the\nright subtree. The follow-up asks for an iterative solution.\nExample: [1, None, 2, 3] -> [1, 3, 2]", "why_here": "The in-order walk made explicit with a stack, the tool every BST problem needs.", "lc_slug": "binary-tree-inorder-traversal", "brute": {"text": "The first idea is the textbook recursion inorder(left); visit(node); inorder(right), which was the original solution. Nothing is recomputed, but the stack is hidden in the interpreter: a skewed tree of 10^4+ nodes overflows Python's recursion limit, and the traversal cannot be paused, resumed or stopped early.", "time": "O(n)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef inorder(node, out):\n    \"\"\"Left subtree, then the node, then the right subtree; the call stack remembers the way.\"\"\"\n    if node is None:\n        return\n    inorder(node.left, out)\n    out.append(node.val)\n    inorder(node.right, out)\n\n\ndef brute_force(root):\n    \"\"\"Textbook recursion. O(n) time, O(h) hidden stack (overflows on very tall trees).\"\"\"\n    out = []\n    inorder(root, out)\n    return out\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(build_tree([1, None, 2, 3])))              # -> [1, 3, 2]\nprint(brute_force(build_tree([])))                           # -> []\nprint(brute_force(build_tree([4, 2, 6, 1, 3, 5, 7])))        # -> [1, 2, 3, 4, 5, 6, 7]\nprint(brute_force(build_tree([1, 2, None, 3])))              # -> [3, 2, 1]\n", "pseudo": "out = empty list\ninorder(node, out):\n    if the node is empty: return\n    inorder(node.left, out)\n    append node.val to out   (the call stack remembers the way back)\n    inorder(node.right, out)\ninorder(root, out)\nreturn out"}, "opt": {"text": "The recursion's only state is which ancestors are still waiting to be visited: each pending frame is a node whose left subtree is in progress. Observation: that is exactly a stack of nodes, and frames are always created by sliding left. So simulate it: slide left from the current node pushing every node on the way; at None, pop (that node's left side is done), visit it, and continue from its right child. Same O(n) time and O(h) space, but explicit, iterative and pausable, which is the basis of BST iterators and early-stop kth-smallest.", "time": "O(n)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef inorder_traversal(root):\n    \"\"\"Replace the call stack with an explicit stack of nodes. O(n) time, O(h) space.\"\"\"\n    out = []\n    stack = []\n    node = root\n    while node is not None or len(stack) > 0:\n        while node is not None:         # slide down the left spine, remembering each node\n            stack.append(node)\n            node = node.left\n        node = stack.pop()              # its left side is finished: visit it\n        out.append(node.val)\n        node = node.right               # then do the same inside the right subtree\n    return out\n\n\n# --- try it: change the inputs and run ---\nprint(inorder_traversal(build_tree([1, None, 2, 3])))              # -> [1, 3, 2]\nprint(inorder_traversal(build_tree([])))                           # -> []\nprint(inorder_traversal(build_tree([4, 2, 6, 1, 3, 5, 7])))        # -> [1, 2, 3, 4, 5, 6, 7]\nprint(inorder_traversal(build_tree([1, 2, None, 3])))              # -> [3, 2, 1]\n", "pseudo": "out = empty list, stack = empty, node = root\nwhile node exists or the stack is not empty:\n    while node exists:\n        push node, node = node.left   (slide down the left spine, remembering each node)\n    node = pop the top\n    append node.val to out\n    node = node.right\nreturn out"}}, "validate_binary_search_tree": {"slug": "validate_binary_search_tree", "topic": "trees", "title": "Validate Binary Search Tree", "leetcode": 98, "difficulty": "Medium", "pattern": "DFS with (low, high) bounds", "statement": "Return True if a binary tree is a valid BST: every node's value is strictly greater than\nall values in its left subtree and strictly less than all values in its right subtree.\nExample: [2, 1, 3] -> True; [5, 1, 4, None, None, 3, 6] -> False (3 is right of 5)", "why_here": "The BST rule is global, so carry (low, high) bounds down.", "lc_slug": "validate-binary-search-tree", "brute": {"text": "At each node collect every value in its left subtree and check they are all smaller, collect every value in its right subtree and check they are all larger, then recurse into both children. The repeated work is the scanning: a node deep in the tree is re-examined once by every ancestor.", "time": "O(n^2)", "space": "O(n)", "py": "import math\nfrom collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef all_values(node):\n    \"\"\"Every value in node's subtree, as a list.\"\"\"\n    if node is None:\n        return []\n    return [node.val] + all_values(node.left) + all_values(node.right)\n\n\ndef brute_force(root):\n    \"\"\"At each node rescan its whole left and right subtrees. O(n^2) worst case.\"\"\"\n    if root is None:\n        return True\n    for value in all_values(root.left):     # the same subtree is rescanned by every ancestor\n        if value >= root.val:\n            return False\n    for value in all_values(root.right):\n        if value <= root.val:\n            return False\n    return brute_force(root.left) and brute_force(root.right)\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(build_tree([2, 1, 3])))                      # -> True\nprint(brute_force(build_tree([5, 1, 4, None, None, 3, 6])))    # -> False\nprint(brute_force(build_tree([2, 2, 2])))                      # -> False\nprint(brute_force(build_tree([3, 1, 5, 0, 2, 4, 6])))          # -> True\n", "pseudo": "all_values(node): every value in the subtree, collected recursively\nif the root is empty: return true\nfor each value in all_values(root.left):   (the same subtree is rescanned by every ancestor)\n    if value >= root.val: return false\nfor each value in all_values(root.right):\n    if value <= root.val: return false\nreturn brute_force(root.left) and brute_force(root.right)"}, "opt": {"text": "An ancestor does not need to look at every descendant; it only needs to hand down a constraint. A node is valid with respect to all its ancestors iff low < node.val < high, where low is the nearest ancestor from which we turned right and high the nearest from which we turned left. The bounds update in O(1) on the way down: going left tightens high to node.val, going right tightens low to node.val. One traversal with the bound pair replaces all rescans. Invariant: every value in the subtree rooted at node must lie strictly inside (low, high).", "time": "O(n)", "space": "O(h)", "py": "import math\nfrom collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef valid(node, low, high):\n    \"\"\"True if every value in node's subtree lies strictly inside (low, high).\"\"\"\n    if node is None:\n        return True\n    if node.val <= low or node.val >= high:\n        return False\n    # going left tightens the upper bound, going right tightens the lower bound\n    return valid(node.left, low, node.val) and valid(node.right, node.val, high)\n\n\ndef is_valid_bst(root):\n    \"\"\"Hand each node an allowed open interval instead of rescanning. O(n) time, O(h) stack.\"\"\"\n    return valid(root, -math.inf, math.inf)    # math.inf: no bound yet\n\n\n# --- try it: change the inputs and run ---\nprint(is_valid_bst(build_tree([2, 1, 3])))                      # -> True\nprint(is_valid_bst(build_tree([5, 1, 4, None, None, 3, 6])))    # -> False\nprint(is_valid_bst(build_tree([2, 2, 2])))                      # -> False\nprint(is_valid_bst(build_tree([3, 1, 5, 0, 2, 4, 6])))          # -> True\n", "pseudo": "valid(node, low, high):\n    if the node is empty: return true\n    if node.val <= low or node.val >= high: return false\n    return valid(node.left, low, node.val) and valid(node.right, node.val, high)   (tighten the open interval)\nreturn valid(root, -infinity, +infinity)"}}, "kth_smallest_element_in_a_bst": {"slug": "kth_smallest_element_in_a_bst", "topic": "trees", "title": "Kth Smallest Element in a BST", "leetcode": 230, "difficulty": "Medium", "pattern": "Iterative in-order traversal with early stop", "statement": "Given the root of a BST and an integer k, return the k-th smallest value (1-indexed).\nExample: [3, 1, 4, None, 2], k = 1 -> 1; [5, 3, 6, 2, 4, None, None, 1], k = 3 -> 3", "why_here": "In-order of a BST is sorted; stop the iterative walk after k pops.", "lc_slug": "kth-smallest-element-in-a-bst", "brute": {"text": "Collect every value with any traversal into a list, sort it, and return index k-1. The sort ignores that the BST already orders the values, and all n values are gathered when only the first k are ever needed.", "time": "O(n log n)", "space": "O(n)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef collect_values(node, vals):\n    \"\"\"Append every value in the subtree, in any order.\"\"\"\n    if node is None:\n        return\n    vals.append(node.val)\n    collect_values(node.left, vals)\n    collect_values(node.right, vals)\n\n\ndef brute_force(root, k):\n    \"\"\"Dump every value, sort, index. O(n log n) time; ignores that the BST is already ordered.\"\"\"\n    vals = []\n    collect_values(root, vals)\n    vals.sort()\n    return vals[k - 1]\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(build_tree([3, 1, 4, None, 2]), 1))                  # -> 1\nprint(brute_force(build_tree([5, 3, 6, 2, 4, None, None, 1]), 3))      # -> 3\nprint(brute_force(build_tree([5, 3, 6, 2, 4, None, None, 1]), 6))      # -> 6\nprint(brute_force(build_tree([2, 1, 3]), 2))                           # -> 2\n", "pseudo": "vals = empty list\ncollect_values(node, vals):\n    if the node is empty: return\n    append node.val to vals\n    collect_values(node.left, vals)\n    collect_values(node.right, vals)\ncollect_values(root, vals)\nsort vals   (ignores that the BST is already ordered)\nreturn vals[k - 1]"}, "opt": {"text": "In-order traversal (left, node, right) of a BST visits values in sorted order for free, so sorting is unnecessary. And because we can stop as soon as the k-th node is emitted, we do not need to visit the rest of the tree. An explicit stack makes the early stop clean: push the left spine, pop (that is the next smallest), then move to the popped node's right child and push its left spine. Invariant: the stack holds the ancestors whose values are the next to be emitted, smallest on top.", "time": "O(h + k)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef kth_smallest(root, k):\n    \"\"\"Iterative in-order walk that stops at the k-th visited node. O(h + k) time, O(h) space.\"\"\"\n    stack = []\n    node = root\n    while True:\n        while node is not None:         # slide left: the smallest unvisited value ends on top\n            stack.append(node)\n            node = node.left\n        node = stack.pop()              # the next value in sorted order\n        k = k - 1\n        if k == 0:\n            return node.val\n        node = node.right\n\n\n# --- try it: change the inputs and run ---\nprint(kth_smallest(build_tree([3, 1, 4, None, 2]), 1))                  # -> 1\nprint(kth_smallest(build_tree([5, 3, 6, 2, 4, None, None, 1]), 3))      # -> 3\nprint(kth_smallest(build_tree([5, 3, 6, 2, 4, None, None, 1]), 6))      # -> 6\nprint(kth_smallest(build_tree([2, 1, 3]), 2))                           # -> 2\n", "pseudo": "stack = empty, node = root\nloop forever:\n    while node exists:\n        push node, node = node.left   (slide left: the smallest unvisited value ends on top)\n    node = pop the top\n    k = k - 1\n    if k == 0: return node.val\n    node = node.right"}}, "lowest_common_ancestor_of_a_bst": {"slug": "lowest_common_ancestor_of_a_bst", "topic": "trees", "title": "Lowest Common Ancestor of a BST", "leetcode": 235, "difficulty": "Medium", "pattern": "BST ordered descent", "statement": "Given a binary search tree and two of its nodes p and q, return their lowest common\nancestor: the deepest node that has both as descendants (a node counts as its own descendant).\nExample: root = [6, 2, 8, 0, 4, 7, 9, None, None, 3, 5], p = 2, q = 8 -> 6; p = 2, q = 4 -> 2", "why_here": "One ordered descent: the first node that splits p and q is the answer.", "lc_slug": "lowest-common-ancestor-of-a-bst", "brute": {"text": "Record the root->p path and the root->q path as lists (each by descending the BST), then walk both lists in parallel and return the last node they share. Two separate descents cover the same prefix twice, and both paths are stored only to find where they diverge.", "time": "O(h)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef find_node(root, value):\n    \"\"\"Return the node holding value in a BST (used to pick p and q for the demos).\"\"\"\n    node = root\n    while node is not None and node.val != value:\n        if value < node.val:\n            node = node.left\n        else:\n            node = node.right\n    return node\n\n\ndef path_to(root, target):\n    \"\"\"Walk down from the root to target using the BST order; return the nodes passed.\"\"\"\n    path = []\n    node = root\n    while node is not target:\n        path.append(node)\n        if target.val < node.val:\n            node = node.left\n        else:\n            node = node.right\n    path.append(target)\n    return path\n\n\ndef brute_force(root, p, q):\n    \"\"\"Record both root-to-node paths, return the last node they share. O(h) time and space.\"\"\"\n    path_p = path_to(root, p)\n    path_q = path_to(root, q)\n    lca = root\n    for i in range(min(len(path_p), len(path_q))):\n        if path_p[i] is not path_q[i]:      # the paths split here\n            break\n        lca = path_p[i]\n    return lca\n\n\n# --- try it: change the inputs and run ---\ntree = build_tree([6, 2, 8, 0, 4, 7, 9, None, None, 3, 5])\nprint(brute_force(tree, find_node(tree, 2), find_node(tree, 8)).val)   # -> 6\nprint(brute_force(tree, find_node(tree, 2), find_node(tree, 4)).val)   # -> 2\nprint(brute_force(tree, find_node(tree, 3), find_node(tree, 5)).val)   # -> 4\n", "pseudo": "path_to(root, target):   (walk down from the root using the BST order)\n    path = empty list, node = root\n    while node is not target:\n        append node to path\n        if target.val < node.val: node = node.left, else node = node.right\n    append target to path\n    return path\npath p = path_to(root, p), path q = path_to(root, q)\nlca = root\nfor each position i in both paths:\n    if path p[i] is not path q[i]: stop   (the paths split here)\n    lca = path p[i]\nreturn lca"}, "opt": {"text": "The two paths are identical until the first node where p and q fall on different sides, and that node is exactly the LCA. In a BST, which side is decided by comparing values: if both p.val and q.val are smaller than node.val both paths go left; if both are larger both go right; otherwise they split here (or node is one of them). So a single descent from the root that stops at the first split finds the LCA with O(1) extra space. Invariant: the current node is an ancestor of both p and q.", "time": "O(h)", "space": "O(1)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef find_node(root, value):\n    \"\"\"Return the node holding value in a BST (used to pick p and q for the demos).\"\"\"\n    node = root\n    while node is not None and node.val != value:\n        if value < node.val:\n            node = node.left\n        else:\n            node = node.right\n    return node\n\n\ndef lowest_common_ancestor(root, p, q):\n    \"\"\"Descend once; the first node whose value sits between the two is the split. O(h), O(1).\"\"\"\n    low = min(p.val, q.val)\n    high = max(p.val, q.val)\n    node = root\n    while node is not None:\n        if high < node.val:\n            node = node.left            # both targets are to the left\n        elif low > node.val:\n            node = node.right           # both targets are to the right\n        else:\n            return node                 # low <= node.val <= high: they split here\n    return None\n\n\n# --- try it: change the inputs and run ---\ntree = build_tree([6, 2, 8, 0, 4, 7, 9, None, None, 3, 5])\nprint(lowest_common_ancestor(tree, find_node(tree, 2), find_node(tree, 8)).val)   # -> 6\nprint(lowest_common_ancestor(tree, find_node(tree, 2), find_node(tree, 4)).val)   # -> 2\nprint(lowest_common_ancestor(tree, find_node(tree, 3), find_node(tree, 5)).val)   # -> 4\n", "pseudo": "low = min(p.val, q.val), high = max(p.val, q.val)\nnode = root\nwhile node exists:\n    if high < node.val: node = node.left   (both targets are to the left)\n    else if low > node.val: node = node.right   (both targets are to the right)\n    else: return node   (low <= node.val <= high: they split here)\nreturn empty"}}, "lowest_common_ancestor_of_a_binary_tree": {"slug": "lowest_common_ancestor_of_a_binary_tree", "topic": "trees", "title": "Lowest Common Ancestor of a Binary Tree", "leetcode": 236, "difficulty": "Medium", "pattern": "Post-order \"found below me\" recursion", "statement": "Given a binary tree (no ordering) and two nodes p and q that are both in it, return their\nlowest common ancestor; a node may be its own ancestor.\nExample: root = [3, 5, 1, 6, 2, 0, 8, None, None, 7, 4], p = 5, q = 1 -> 3; p = 5, q = 4 -> 5", "why_here": "Without the order, use a post-order found-below-me signal.", "lc_slug": "lowest-common-ancestor-of-a-binary-tree", "brute": {"text": "Run one DFS to record the root->p path as a list of nodes, another to record the root->q path, then walk both lists in parallel and return the last shared node. The tree is traversed twice, the shared prefix of both paths is stored twice, and both paths are kept only to find where they diverge.", "time": "O(n)", "space": "O(n)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef find_node(root, value):\n    \"\"\"Return the node holding value (values are unique in the demos).\"\"\"\n    if root is None or root.val == value:\n        return root\n    found = find_node(root.left, value)\n    if found is not None:\n        return found\n    return find_node(root.right, value)\n\n\ndef path_to(node, target, path):\n    \"\"\"Fill path with the nodes from node down to target; True if target was found below.\"\"\"\n    if node is None:\n        return False\n    path.append(node)\n    if node is target:\n        return True\n    if path_to(node.left, target, path):\n        return True\n    if path_to(node.right, target, path):\n        return True\n    path.pop()                  # target is not under this node: undo the step\n    return False\n\n\ndef brute_force(root, p, q):\n    \"\"\"Two full searches record root->p and root->q, then compare the paths. O(n) time and space.\"\"\"\n    path_p = []\n    path_q = []\n    path_to(root, p, path_p)\n    path_to(root, q, path_q)\n    lca = None\n    for i in range(min(len(path_p), len(path_q))):\n        if path_p[i] is not path_q[i]:      # the paths split here\n            break\n        lca = path_p[i]\n    return lca\n\n\n# --- try it: change the inputs and run ---\ntree = build_tree([3, 5, 1, 6, 2, 0, 8, None, None, 7, 4])\nprint(brute_force(tree, find_node(tree, 5), find_node(tree, 1)).val)   # -> 3\nprint(brute_force(tree, find_node(tree, 5), find_node(tree, 4)).val)   # -> 5\nprint(brute_force(tree, find_node(tree, 7), find_node(tree, 4)).val)   # -> 2\n", "pseudo": "path_to(node, target, path):   (dfs that records the root-to-target path)\n    if the node is empty: return false\n    append node to path\n    if node is target: return true\n    if path_to(node.left, target, path): return true\n    if path_to(node.right, target, path): return true\n    remove node from path, return false\npath p = path_to(root, p), path q = path_to(root, q)\nlca = empty\nfor each position i in both paths:\n    if path p[i] is not path q[i]: stop   (the paths split here)\n    lca = path p[i]\nreturn lca"}, "opt": {"text": "Instead of asking for the path to p and the path to q separately, ask every subtree one question: do you contain p or q, and if so hand me back the most relevant node? A post-order recursion returns p or q when it finds it, propagates that single hit upward, and when a node receives hits from both children it must be the split point, so it returns itself from then on. One traversal, no stored paths. Invariant: the call on a node returns None if its subtree has neither target, the found target if it has exactly one, and the LCA if it has both.", "time": "O(n)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef find_node(root, value):\n    \"\"\"Return the node holding value (values are unique in the demos).\"\"\"\n    if root is None or root.val == value:\n        return root\n    found = find_node(root.left, value)\n    if found is not None:\n        return found\n    return find_node(root.right, value)\n\n\ndef lowest_common_ancestor(root, p, q):\n    \"\"\"Each subtree reports p, q, their LCA, or None. One post-order pass: O(n) time, O(h) stack.\"\"\"\n    if root is None or root is p or root is q:\n        return root\n    left = lowest_common_ancestor(root.left, p, q)\n    right = lowest_common_ancestor(root.right, p, q)\n    if left is not None and right is not None:\n        return root             # p and q are on different sides: root is the split point\n    if left is not None:\n        return left             # both on the left: that side already knows the answer\n    return right\n\n\n# --- try it: change the inputs and run ---\ntree = build_tree([3, 5, 1, 6, 2, 0, 8, None, None, 7, 4])\nprint(lowest_common_ancestor(tree, find_node(tree, 5), find_node(tree, 1)).val)   # -> 3\nprint(lowest_common_ancestor(tree, find_node(tree, 5), find_node(tree, 4)).val)   # -> 5\nprint(lowest_common_ancestor(tree, find_node(tree, 7), find_node(tree, 4)).val)   # -> 2\n", "pseudo": "if the root is empty or root is p or root is q: return root\nleft = lowest_common_ancestor(root.left, p, q)\nright = lowest_common_ancestor(root.right, p, q)\nif both left and right are found: return root   (p and q lie on different sides)\nif left is found: return left\nreturn right"}}, "construct_binary_tree_from_preorder_and_inorder_traversal": {"slug": "construct_binary_tree_from_preorder_and_inorder_traversal", "topic": "trees", "title": "Construct Binary Tree from Preorder and Inorder Traversal", "leetcode": 105, "difficulty": "Medium", "pattern": "Recursive tree construction with index map", "statement": "Given the preorder and inorder traversals of a binary tree with unique values, rebuild\nthe tree.\nExample: preorder = [3, 9, 20, 15, 7], inorder = [9, 3, 15, 20, 7] -> [3, 9, 20, None, None, 15, 7]", "why_here": "Reverse a traversal: pre-order picks the root, in-order index splits the ranges.", "lc_slug": "construct-binary-tree-from-preorder-and-inorder-traversal", "brute": {"text": "preorder[0] is the root; find it in inorder with a linear search. Everything left of it is the left subtree's inorder, everything right is the right subtree's; the next len(left) preorder entries are the left subtree's preorder. Recurse on sliced lists. The repeated work is the linear search for the root and the copying of sub-arrays that are only ever read, O(n) per node on a skewed tree.", "time": "O(n^2)", "space": "O(n^2)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef tree_to_list(root):\n    \"\"\"Tree -> level-order list with None for missing children, trailing Nones removed.\"\"\"\n    out = []\n    queue = deque([root])\n    while len(queue) > 0:\n        node = queue.popleft()\n        if node is None:\n            out.append(None)\n        else:\n            out.append(node.val)\n            queue.append(node.left)\n            queue.append(node.right)\n    while len(out) > 0 and out[-1] is None:\n        out.pop()\n    return out\n\n\ndef brute_force(preorder, inorder):\n    \"\"\"preorder[0] is the root; find it in inorder, slice both lists, recurse. O(n^2) time.\"\"\"\n    if len(preorder) == 0:\n        return None\n    root = TreeNode(preorder[0])\n    mid = inorder.index(root.val)              # linear scan for the root\n    left_size = mid                            # everything left of the root in inorder\n    left_pre = preorder[1:1 + left_size]           # slice copies at every call\n    right_pre = preorder[1 + left_size:len(preorder)]\n    root.left = brute_force(left_pre, inorder[0:mid])\n    root.right = brute_force(right_pre, inorder[mid + 1:len(inorder)])\n    return root\n\n\n# --- try it: change the inputs and run ---\npre, ino = [3, 9, 20, 15, 7], [9, 3, 15, 20, 7]\nprint(tree_to_list(brute_force(pre, ino)))                  # -> [3, 9, 20, None, None, 15, 7]\nprint(tree_to_list(brute_force([1, 2], [1, 2])))                     # -> [1, None, 2]\nprint(tree_to_list(brute_force([1, 2, 4, 5, 3], [4, 2, 5, 1, 3])))   # -> [1, 2, 3, 4, 5]\nprint(tree_to_list(brute_force([], [])))                             # -> []\n", "pseudo": "if preorder is empty: return empty\nroot = new node with preorder[0]\nmid = position of root.val in inorder   (linear scan)\nleft size = mid\nleft pre = preorder[1 .. left size], right pre = preorder[left size + 1 ..]   (slice copies at every call)\nroot.left = brute_force(left pre, inorder[0 .. mid - 1])\nroot.right = brute_force(right pre, inorder[mid + 1 ..])\nreturn root"}, "opt": {"text": "Two independent fixes. The linear search answers \"where is value v in inorder?\", which a hash map answers in O(1) after one pass. The slices only delimit which part of inorder a subtree owns, and a pair of indices (lo, hi) carries that without copying. The preorder side needs no bounds at all: nodes are consumed strictly in preorder order, so a single running pointer suffices, because building the left subtree first consumes exactly mid - lo preorder entries before the right subtree starts. Invariant: make(lo, hi) consumes exactly hi - lo preorder entries and returns the subtree whose inorder occupies inorder[lo:hi].", "time": "O(n)", "space": "O(n)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef tree_to_list(root):\n    \"\"\"Tree -> level-order list with None for missing children, trailing Nones removed.\"\"\"\n    out = []\n    queue = deque([root])\n    while len(queue) > 0:\n        node = queue.popleft()\n        if node is None:\n            out.append(None)\n        else:\n            out.append(node.val)\n            queue.append(node.left)\n            queue.append(node.right)\n    while len(out) > 0 and out[-1] is None:\n        out.pop()\n    return out\n\n\ndef make(pre_queue, index, lo, hi):\n    \"\"\"Build the subtree whose inorder values are inorder[lo:hi], eating preorder front to back.\"\"\"\n    if lo >= hi:\n        return None\n    root = TreeNode(pre_queue.popleft())       # the next preorder value is always the next root\n    mid = index[root.val]\n    root.left = make(pre_queue, index, lo, mid)         # uses exactly mid - lo preorder values\n    root.right = make(pre_queue, index, mid + 1, hi)\n    return root\n\n\ndef construct_tree(preorder, inorder):\n    \"\"\"Hash map for the root's position, index bounds instead of slices. O(n) time and space.\"\"\"\n    index = {}\n    for i in range(len(inorder)):\n        index[inorder[i]] = i\n    pre_queue = deque(preorder)        # deque: popleft is O(1)\n    return make(pre_queue, index, 0, len(inorder))\n\n\n# --- try it: change the inputs and run ---\npre, ino = [3, 9, 20, 15, 7], [9, 3, 15, 20, 7]\nprint(tree_to_list(construct_tree(pre, ino)))                  # -> [3, 9, 20, None, None, 15, 7]\nprint(tree_to_list(construct_tree([1, 2], [1, 2])))                     # -> [1, None, 2]\nprint(tree_to_list(construct_tree([1, 2, 4, 5, 3], [4, 2, 5, 1, 3])))   # -> [1, 2, 3, 4, 5]\nprint(tree_to_list(construct_tree([], [])))                             # -> []\n", "pseudo": "index = dict value -> position in inorder\npre queue = deque of preorder   (eaten front to back: the next value is always the next root)\nmake(pre queue, index, lo, hi):\n    if lo >= hi: return empty\n    root = new node with the front of pre queue, popped\n    mid = index[root.val]\n    root.left = make(pre queue, index, lo, mid)\n    root.right = make(pre queue, index, mid + 1, hi)\n    return root\nreturn make(pre queue, index, 0, size of inorder)"}}, "implement_trie_prefix_tree": {"slug": "implement_trie_prefix_tree", "topic": "tries", "title": "Implement Trie (Prefix Tree)", "leetcode": 208, "difficulty": "Medium", "pattern": "Trie (prefix tree)", "statement": "Design a Trie with insert(word), search(word) (is this exact word stored?) and\nstartsWith(prefix) (does any stored word begin with prefix?).\nExample: insert(\"apple\"); search(\"apple\") -> True; search(\"app\") -> False;\nstartsWith(\"app\") -> True; insert(\"app\"); search(\"app\") -> True.", "why_here": "Builds the structure itself: nested dicts, end markers, and the walk that every later problem reuses.", "lc_slug": "implement-trie-prefix-tree", "brute": {"text": "Keep the inserted words in a list. search scans the list comparing whole strings; startsWith scans it calling w.startswith(prefix) on every word. Words that share a prefix (apple, apply, app) are compared character by character against the same query over and over; shared letters are re-read once per word instead of once in total.", "time": "O(N*L) per query", "space": "O(N*L)", "py": "class BruteForce:\n    \"\"\"Keep a plain list of words; every query scans the whole list. O(N * L) per query.\"\"\"\n\n    def __init__(self):\n        self.words = []\n\n    def insert(self, word):\n        self.words.append(word)\n\n    def search(self, word):\n        for stored in self.words:\n            if stored == word:\n                return True\n        return False\n\n    def startsWith(self, prefix):\n        for stored in self.words:\n            if stored.startswith(prefix):   # the same prefix is re-read once per word\n                return True\n        return False\n\n\n# --- try it: change the inputs and run ---\ntrie = BruteForce()\nprint(trie.search(\"apple\"))      # -> False\ntrie.insert(\"apple\")\nprint(trie.search(\"apple\"))      # -> True\nprint(trie.search(\"app\"))        # -> False\nprint(trie.startsWith(\"app\"))    # -> True\ntrie.insert(\"app\")\nprint(trie.search(\"app\"))        # -> True\n", "pseudo": "init:\n    words = empty list\ninsert(word):\n    append word to words\nsearch(word):\n    for each stored in words:\n        if stored == word: return true\n    return false\nstartsWith(prefix):\n    for each stored in words:\n        if stored begins with prefix: return true   (the same prefix is re-read once per word)\n    return false"}, "opt": {"text": "Shared prefixes should be stored once. A tree whose edges are labelled by characters does exactly that: the path spelling \"app\" is shared by every word starting with \"app\", and apple / apply only branch after it. A query then follows at most len(query) edges regardless of how many words are stored: startsWith asks can I walk the whole prefix, search asks can I walk the whole word and is the last node marked as a word end. The end marker is what distinguishes a stored word from a mere prefix. Invariant: the node reached by walking s exists iff some inserted word has s as a prefix.", "time": "O(L) per operation", "space": "O(total characters)", "py": "class Trie:\n    \"\"\"Nested dicts keyed by character; \"$\" marks where a word ends. O(L) per operation.\"\"\"\n\n    def __init__(self):\n        self.root = {}            # char -> child dict\n\n    def insert(self, word):\n        node = self.root\n        for ch in word:\n            if ch not in node:\n                node[ch] = {}     # create the missing link\n            node = node[ch]\n        node[\"$\"] = True          # a word ends at this node\n\n    def walk(self, text):\n        # follow text down from the root; return the node reached, or None if the path breaks\n        node = self.root\n        for ch in text:\n            if ch not in node:\n                return None\n            node = node[ch]\n        return node\n\n    def search(self, word):\n        node = self.walk(word)\n        return node is not None and \"$\" in node   # the path exists AND a word ends there\n\n    def startsWith(self, prefix):\n        return self.walk(prefix) is not None\n\n\n# --- try it: change the inputs and run ---\ntrie = Trie()\nprint(trie.search(\"apple\"))      # -> False\ntrie.insert(\"apple\")\nprint(trie.search(\"apple\"))      # -> True\nprint(trie.search(\"app\"))        # -> False\nprint(trie.startsWith(\"app\"))    # -> True\ntrie.insert(\"app\")\nprint(trie.search(\"app\"))        # -> True\n", "pseudo": "init:\n    root = empty dict char -> child\ninsert(word):\n    node = root\n    for each ch in word:\n        if ch not in node: node[ch] = empty dict   (create the missing link)\n        node = node[ch]\n    mark node with \"$\"   (a word ends at this node)\nwalk(text):\n    node = root\n    for each ch in text:\n        if ch not in node: return nothing   (the path breaks)\n        node = node[ch]\n    return node\nsearch(word):\n    node = walk(word)\n    return node exists and node is marked \"$\"\nstartsWith(prefix):\n    return walk(prefix) exists"}}, "design_add_and_search_words_data_structure": {"slug": "design_add_and_search_words_data_structure", "topic": "tries", "title": "Design Add and Search Words Data Structure", "leetcode": 211, "difficulty": "Medium", "pattern": "Trie with wildcard DFS", "statement": "Design WordDictionary with addWord(word) and search(pattern), where the pattern may\ncontain '.' matching any single letter.\nExample: add bad, dad, mad; search(\"pad\") -> False; search(\"bad\") -> True;\nsearch(\".ad\") -> True; search(\"b..\") -> True.", "why_here": "The walk becomes a DFS: a wildcard forces branching, and the trie prunes every branch that cannot match.", "lc_slug": "design-add-and-search-words-data-structure", "brute": {"text": "Store the words in a list; search compares the pattern against every stored word character by character, treating '.' as a free match. Every word is checked in full against the pattern, even though many words share long prefixes and could be rejected or accepted as a group after one comparison.", "time": "O(N*L) per search", "space": "O(N*L)", "py": "def matches(pattern, word):\n    \"\"\"True if word has the pattern's length and every character fits ('.' fits anything).\"\"\"\n    if len(word) != len(pattern):\n        return False\n    for i in range(len(pattern)):\n        if pattern[i] != \".\" and pattern[i] != word[i]:\n            return False\n    return True\n\n\nclass BruteForce:\n    \"\"\"Keep a list of words; search compares the pattern with every word. O(N * L) per search.\"\"\"\n\n    def __init__(self):\n        self.words = []\n\n    def addWord(self, word):\n        self.words.append(word)\n\n    def search(self, pattern):\n        for stored in self.words:\n            if matches(pattern, stored):\n                return True\n        return False\n\n\n# --- try it: change the inputs and run ---\nwords = BruteForce()\nprint(words.search(\".\"))      # -> False\nwords.addWord(\"bad\")\nwords.addWord(\"dad\")\nwords.addWord(\"mad\")\nprint(words.search(\"pad\"))    # -> False\nprint(words.search(\"bad\"))    # -> True\nprint(words.search(\".ad\"))    # -> True\nprint(words.search(\"b..\"))    # -> True\nprint(words.search(\"....\"))   # -> False\nprint(words.search(\"ba\"))     # -> False\n", "pseudo": "matches(pattern, word):\n    if size of word != size of pattern: return false\n    for each position i:\n        if pattern[i] is not \".\" and pattern[i] != word[i]: return false\n    return true\ninit:\n    words = empty list\naddWord(word):\n    append word to words\nsearch(pattern):\n    for each stored in words:\n        if matches(pattern, stored): return true   (every word is compared in full)\n    return false"}, "opt": {"text": "A trie stores shared prefixes once, so a literal character in the pattern is one dictionary lookup that discards every word not continuing with that letter, all at once. The wildcard is the only place where several branches stay viable, and there the search must try each child: a DFS over (trie node, pattern index) that branches only at '.'. A literal mismatch prunes the whole subtree immediately, and the end marker again distinguishes a full word from a prefix. Invariant: dfs(node, i) is True iff some word in node's subtree spells pattern[i:].", "time": "O(L) add; O(26^d * L) worst-case search with d dots", "space": "O(total characters)", "py": "def dfs(node, pattern, i):\n    \"\"\"True if some word stored below node spells pattern[i:].\"\"\"\n    if i == len(pattern):\n        return \"$\" in node                  # the whole pattern is used: is this a word end?\n    ch = pattern[i]\n    if ch != \".\":\n        if ch not in node:\n            return False                    # a literal mismatch prunes this whole subtree\n        return dfs(node[ch], pattern, i + 1)\n    for key in node:                        # wildcard: try every real child\n        if key == \"$\":\n            continue\n        if dfs(node[key], pattern, i + 1):\n            return True\n    return False\n\n\nclass WordDictionary:\n    \"\"\"Trie; search is a DFS that only branches at '.'. O(L) per search without wildcards.\"\"\"\n\n    def __init__(self):\n        self.root = {}            # char -> child dict; \"$\" marks where a word ends\n\n    def addWord(self, word):\n        node = self.root\n        for ch in word:\n            if ch not in node:\n                node[ch] = {}\n            node = node[ch]\n        node[\"$\"] = True\n\n    def search(self, pattern):\n        return dfs(self.root, pattern, 0)\n\n\n# --- try it: change the inputs and run ---\nwords = WordDictionary()\nprint(words.search(\".\"))      # -> False\nwords.addWord(\"bad\")\nwords.addWord(\"dad\")\nwords.addWord(\"mad\")\nprint(words.search(\"pad\"))    # -> False\nprint(words.search(\"bad\"))    # -> True\nprint(words.search(\".ad\"))    # -> True\nprint(words.search(\"b..\"))    # -> True\nprint(words.search(\"....\"))   # -> False\nprint(words.search(\"ba\"))     # -> False\n", "pseudo": "dfs(node, pattern, i):\n    if i == size of pattern: return node is marked \"$\"\n    ch = pattern[i]\n    if ch is not \".\":\n        if ch not in node: return false   (a literal mismatch prunes the whole subtree)\n        return dfs(node[ch], pattern, i + 1)\n    for each key in node, skipping \"$\":   (wildcard: try every real child)\n        if dfs(node[key], pattern, i + 1): return true\n    return false\ninit:\n    root = empty dict char -> child\naddWord(word):\n    node = root\n    for each ch in word:\n        if ch not in node: node[ch] = empty dict\n        node = node[ch]\n    mark node with \"$\"\nsearch(pattern):\n    return dfs(root, pattern, 0)"}}, "kth_largest_element_in_a_stream": {"slug": "kth_largest_element_in_a_stream", "topic": "heap", "title": "Kth Largest Element in a Stream", "leetcode": 703, "difficulty": "Easy", "pattern": "Size-k heap (keep the k best)", "statement": "Design a class initialised with k and a list of scores that then receives new scores one\nat a time via add(val); after every add return the k-th largest element seen so far,\nduplicates counted.\nExample: k=3, nums=[4,5,8,2]; add(3) -> 4, add(5) -> 5, add(10) -> 5, add(9) -> 8, add(4) -> 8.", "why_here": "The simplest heap use: a size-k min-heap whose root is the k-th largest.", "lc_slug": "kth-largest-element-in-a-stream", "brute": {"text": "Keep every number in a list; on each add, append, sort descending and return index k-1. The whole history is re-sorted every time even though only one element changed, and only a single position of the sorted result is ever read.", "time": "O(n log n) per add", "space": "O(n)", "py": "import heapq      # heappush / heappop keep the smallest item at index 0\n\n\nclass BruteForce:\n    \"\"\"Keep every number; each add re-sorts the whole list for one rank. O(n log n) per add.\"\"\"\n\n    def __init__(self, k, nums):\n        self.k = k\n        self.nums = list(nums)\n\n    def add(self, val):\n        self.nums.append(val)\n        self.nums.sort(reverse=True)     # re-sort everything although one value changed\n        return self.nums[self.k - 1]\n\n\n# --- try it: change the inputs and run ---\nstream = BruteForce(3, [4, 5, 8, 2])\nprint(stream.add(3))    # -> 4\nprint(stream.add(5))    # -> 5\nprint(stream.add(10))   # -> 5\nprint(stream.add(9))    # -> 8\nprint(stream.add(4))    # -> 8\nstream = BruteForce(1, [7, 7])\nprint(stream.add(7))    # -> 7\nprint(stream.add(8))    # -> 8\n", "pseudo": "init(k, nums):\n    k = k\n    nums = copy of nums\nadd(val):\n    append val to nums\n    sort nums descending   (the whole history re-sorted for one rank)\n    return nums[k - 1]"}, "opt": {"text": "The redundancy is re-sorting n items to learn one rank. The answer depends only on the k largest values seen so far; anything smaller can never become the k-th largest again, so it can be discarded the moment it arrives. We need a container of exactly k items that cheaply exposes its smallest member and evicts it when a bigger one appears. A min-heap of size k does both in O(log k), and its root IS the k-th largest.", "time": "O(log k) per add", "space": "O(k)", "py": "import heapq      # heappush / heappop keep the smallest item at index 0\n\n\nclass KthLargest:\n    \"\"\"Min-heap holding only the k largest seen; its root is the k-th largest. O(log k) per add.\"\"\"\n\n    def __init__(self, k, nums):\n        self.k = k\n        self.heap = []\n        for val in nums:\n            heapq.heappush(self.heap, val)\n            if len(self.heap) > k:\n                heapq.heappop(self.heap)\n\n    def add(self, val):\n        heapq.heappush(self.heap, val)\n        if len(self.heap) > self.k:\n            heapq.heappop(self.heap)     # the smallest can never be the k-th largest again\n        return self.heap[0]              # root of a size-k min-heap = k-th largest\n\n\n# --- try it: change the inputs and run ---\nstream = KthLargest(3, [4, 5, 8, 2])\nprint(stream.add(3))    # -> 4\nprint(stream.add(5))    # -> 5\nprint(stream.add(10))   # -> 5\nprint(stream.add(9))    # -> 8\nprint(stream.add(4))    # -> 8\nstream = KthLargest(1, [7, 7])\nprint(stream.add(7))    # -> 7\nprint(stream.add(8))    # -> 8\n", "pseudo": "init(k, nums):\n    k = k\n    heap = empty min-heap\n    for each val in nums:\n        push val\n        if size of heap > k: pop the smallest\nadd(val):\n    push val\n    if size of heap > k: pop the smallest   (it can never be the k-th largest again)\n    return the top of the heap   (root of a size-k min-heap = k-th largest)"}}, "kth_largest_element_in_an_array": {"slug": "kth_largest_element_in_an_array", "topic": "heap", "title": "Kth Largest Element in an Array", "leetcode": 215, "difficulty": "Medium", "pattern": "Quickselect (partition, recurse one side)", "statement": "Given an integer array nums and k, return the k-th largest element in sorted order\n(duplicates count), without fully sorting.\nExample: nums=[3,2,1,5,6,4], k=2 -> 5. Example: nums=[3,2,3,1,2,4,5,5,6], k=4 -> 4.", "why_here": "Same question on static data; quickselect shows when a heap is not the best tool.", "lc_slug": "kth-largest-element-in-an-array", "brute": {"text": "Sort the array descending and return nums[k-1]. A full sort establishes the order of every pair of elements, but we only need to know which single element lands at position k-1; the order inside the left part and inside the right part is thrown away.", "time": "O(n log n)", "space": "O(1)", "py": "import random     # a random pivot keeps quickselect fast on every input\n\n\ndef brute_force(nums, k):\n    \"\"\"Sort everything descending and read position k - 1. O(n log n) time.\"\"\"\n    ordered = sorted(nums, reverse=True)      # orders every pair, we need one position\n    return ordered[k - 1]\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force([3, 2, 1, 5, 6, 4], 2))             # -> 5\nprint(brute_force([3, 2, 3, 1, 2, 4, 5, 5, 6], 4))    # -> 4\nprint(brute_force([1], 1))                            # -> 1\nprint(brute_force([2, 2, 2, 2], 3))                   # -> 2\n", "pseudo": "ordered = nums sorted descending   (orders every pair to read one position)\nreturn ordered[k - 1]"}, "opt": {"text": "The redundancy is sorting both halves of every partition when only one half can contain the answer. One partition pass around a pivot puts the pivot at its final sorted index p in O(n) and tells us whether the target index n-k is left of p, right of p, or equal to p. So discard the other side and recurse on one side only; the work shrinks geometrically (n + n/2 + n/4 + ...) to O(n) on average. A random pivot keeps the expected depth logarithmic and defeats adversarial inputs. Heap alternative: a size-k min-heap gives O(n log k) deterministically and is the right call for a stream; quickselect needs the whole array in memory but is faster for a one-off query.", "time": "O(n) average, O(n^2) worst", "space": "O(1)", "py": "import random     # a random pivot keeps quickselect fast on every input\n\n\ndef find_kth_largest(nums, k):\n    \"\"\"Quickselect: partition around a pivot, keep only the side with the answer. O(n) average.\"\"\"\n    nums = list(nums)                 # work on a copy\n    target = len(nums) - k            # index of the answer in ascending order\n    low = 0\n    high = len(nums) - 1\n    while low < high:\n        pivot_index = partition(nums, low, high)\n        if pivot_index == target:\n            return nums[pivot_index]\n        if pivot_index < target:\n            low = pivot_index + 1     # the answer is among the bigger values\n        else:\n            high = pivot_index - 1    # the answer is among the smaller values\n    return nums[low]\n\n\ndef partition(nums, low, high):\n    \"\"\"Put a random pivot at its final sorted index within nums[low..high]; return that index.\"\"\"\n    pivot_index = random.randint(low, high)\n    nums[pivot_index], nums[high] = nums[high], nums[pivot_index]   # park the pivot at the end\n    pivot = nums[high]\n    store = low                       # everything before store is smaller than the pivot\n    for i in range(low, high):\n        if nums[i] < pivot:\n            nums[i], nums[store] = nums[store], nums[i]              # swap it into the small side\n            store += 1\n    nums[store], nums[high] = nums[high], nums[store]               # the pivot lands at store\n    return store\n\n\n# --- try it: change the inputs and run ---\nprint(find_kth_largest([3, 2, 1, 5, 6, 4], 2))             # -> 5\nprint(find_kth_largest([3, 2, 3, 1, 2, 4, 5, 5, 6], 4))    # -> 4\nprint(find_kth_largest([1], 1))                            # -> 1\nprint(find_kth_largest([2, 2, 2, 2], 3))                   # -> 2\n", "pseudo": "nums = copy of nums, target = n - k   (index of the answer in ascending order)\nlow = 0, high = n - 1\nwhile low < high:\n    pivot_index = partition(nums, low, high)\n    if pivot_index == target: return nums[pivot_index]\n    if pivot_index < target: low = pivot_index + 1   (the answer is among the bigger values)\n    else: high = pivot_index - 1\nreturn nums[low]\npartition(nums, low, high):\n    pick a random pivot_index, swap nums[pivot_index] with nums[high], pivot = nums[high]\n    store = low\n    for each i from low to high - 1:\n        if nums[i] < pivot: swap nums[i] with nums[store], store = store + 1\n    swap nums[store] with nums[high], return store   (the pivot lands at its final index)"}}, "k_closest_points_to_origin": {"slug": "k_closest_points_to_origin", "topic": "heap", "title": "K Closest Points to Origin", "leetcode": 973, "difficulty": "Medium", "pattern": "Size-k heap (keep the k best)", "statement": "Given points [[x, y], ...] on a plane and an integer k, return the k points closest to the\norigin by Euclidean distance, in any order.\nExample: points=[[1,3],[-2,2]], k=1 -> [[-2,2]] because 8 < 10.\nExample: [[3,3],[5,-1],[-2,4]], k=2 -> [[3,3],[-2,4]].", "why_here": "Size-k club again, but the bouncer is the farthest point, so the heap becomes a max-heap by negation.", "lc_slug": "k-closest-points-to-origin", "brute": {"text": "Compute every point's squared distance, sort all n points by it, and return the first k. Sorting fully orders all n points, but we only need to separate the k smallest from the rest; the relative order of the n-k far points is computed and thrown away.", "time": "O(n log n)", "space": "O(n)", "py": "import heapq      # heappush / heappop keep the smallest item at index 0\n\n\ndef brute_force(points, k):\n    \"\"\"Sort all n points by squared distance and take the first k. O(n log n) time.\"\"\"\n    with_distance = []\n    for x, y in points:\n        with_distance.append((x * x + y * y, x, y))\n    with_distance.sort()                      # orders every point, not just the k nearest\n    result = []\n    for i in range(k):\n        result.append([with_distance[i][1], with_distance[i][2]])\n    return result\n\n\n# --- try it: change the inputs and run ---\n# any order is accepted, so the demos print the points sorted\nprint(sorted(brute_force([[1, 3], [-2, 2]], 1)))              # -> [[-2, 2]]\nprint(sorted(brute_force([[3, 3], [5, -1], [-2, 4]], 2)))     # -> [[-2, 4], [3, 3]]\nprint(sorted(brute_force([[0, 1], [1, 0]], 2)))               # -> [[0, 1], [1, 0]]\n", "pseudo": "with_distance = empty list\nfor each (x, y) in points:\n    append (x*x + y*y, x, y) to with_distance\nsort with_distance   (orders every point, not just the k nearest)\nresult = the (x, y) of the first k entries\nreturn result"}, "opt": {"text": "The redundancy is ordering points we will discard. A point farther than k points we have already seen can never be in the answer, so it can be rejected immediately. To test that in O(log k) we need fast access to the worst point currently kept: a max-heap of size k keyed on distance, with Python's min-heap turned into a max-heap by negating the distance. Each new point is compared to the root; if closer, it replaces it. Only k items are ever stored, so n points cost O(n log k). For one-off queries quickselect on distance gives O(n) average, but the heap is the streaming-friendly answer.", "time": "O(n log k)", "space": "O(k)", "py": "import heapq      # heappush / heappop keep the smallest item at index 0\n\n\ndef k_closest(points, k):\n    \"\"\"Max-heap (negated distance) of the k nearest so far; evict the farthest. O(n log k).\"\"\"\n    heap = []                                 # (-distance, x, y): the root is the farthest kept\n    for x, y in points:\n        distance = x * x + y * y\n        heapq.heappush(heap, (-distance, x, y))\n        if len(heap) > k:\n            heapq.heappop(heap)               # k + 1 points kept: drop the farthest one\n    result = []\n    for neg_distance, x, y in heap:\n        result.append([x, y])\n    return result\n\n\n# --- try it: change the inputs and run ---\n# any order is accepted, so the demos print the points sorted\nprint(sorted(k_closest([[1, 3], [-2, 2]], 1)))                # -> [[-2, 2]]\nprint(sorted(k_closest([[3, 3], [5, -1], [-2, 4]], 2)))       # -> [[-2, 4], [3, 3]]\nprint(sorted(k_closest([[0, 1], [1, 0]], 2)))                 # -> [[0, 1], [1, 0]]\n", "pseudo": "heap = empty max-heap of (-distance, x, y)   (the root is the farthest point kept)\nfor each (x, y) in points:\n    distance = x*x + y*y\n    push (-distance, x, y)\n    if size of heap > k: pop the farthest\nresult = the (x, y) of every entry left in the heap\nreturn result"}}, "task_scheduler": {"slug": "task_scheduler", "topic": "heap", "title": "Task Scheduler", "leetcode": 621, "difficulty": "Medium", "pattern": "Max-heap + cooldown queue simulation", "statement": "Given tasks as uppercase letters and a cooldown n, each unit of time the CPU runs one task\nor idles, and two identical tasks must be at least n units apart. Return the minimum total\ntime to finish all tasks.\nExample: tasks=[A,A,A,B,B,B], n=2 -> 8 (A B idle A B idle A B).", "why_here": "The heap turns from a filter into a greedy chooser, paired with a cooldown queue.", "lc_slug": "task-scheduler", "brute": {"text": "Simulate tick by tick: at each tick scan all 26 letters, pick the one with the most remaining copies whose last run was more than n ticks ago, run it or idle. Every tick re-scans all 26 counters and re-checks each cooldown, although only one counter changed since the last tick and every expiry time (last_run + n + 1) was known the moment the task ran.", "time": "O(T * 26)  (T = answer)", "space": "O(26)", "py": "import heapq                    # heappush / heappop keep the smallest item at index 0\nfrom collections
