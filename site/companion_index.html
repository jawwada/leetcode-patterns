tical sequence\n        return True\n    return False\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(\"anagram\", \"nagaram\"))   # -> True\nprint(brute_force(\"rat\", \"car\"))           # -> False\nprint(brute_force(\"a\", \"ab\"))              # -> False\nprint(brute_force(\"aabb\", \"abab\"))         # -> True\n", "pseudo": "sorted_s = the letters of s, sorted\nsorted_t = the letters of t, sorted\nif sorted_s == sorted_t: return true   (anagrams sort to the identical sequence)\nreturn false"}, "opt": {"text": "Two strings are anagrams iff every letter appears the same number of times in both. The alphabet is fixed at 26 lowercase letters, so the frequency table is a 26-cell array rather than a hash map, and filling it is one linear pass. Walk both strings together, adding 1 for the letter from s and subtracting 1 for the letter from t; they are anagrams iff every cell ends at zero. A length check up front rejects the trivial mismatch before any counting.", "time": "O(n)", "space": "O(1)", "py": "def is_anagram(s, t):\n    \"\"\"One 26-cell histogram: s adds, t subtracts, every cell must end at 0. O(n), O(1) space.\"\"\"\n    if len(s) != len(t):\n        return False\n    count = [0] * 26\n    for i in range(len(s)):\n        letter_s = ord(s[i]) - ord(\"a\")   # 'a' -> cell 0, 'b' -> cell 1, ...\n        letter_t = ord(t[i]) - ord(\"a\")\n        count[letter_s] += 1              # s pushes its column up\n        count[letter_t] -= 1              # t pulls it back down\n    for c in count:\n        if c != 0:\n            return False                  # one string has more of this letter\n    return True\n\n\n# --- try it: change the inputs and run ---\nprint(is_anagram(\"anagram\", \"nagaram\"))    # -> True\nprint(is_anagram(\"rat\", \"car\"))            # -> False\nprint(is_anagram(\"a\", \"ab\"))               # -> False\nprint(is_anagram(\"aabb\", \"abab\"))          # -> True\n", "pseudo": "if length of s != length of t: return false\ncount = 26 zeros\nfor each index i:\n    letter_s = position of s[i] in the alphabet, letter_t = position of t[i]\n    count[letter_s] += 1   (s pushes its column up)\n    count[letter_t] -= 1   (t pulls it back down)\nfor each c in count:\n    if c != 0: return false\nreturn true"}}, "string_to_integer_atoi": {"slug": "string_to_integer_atoi", "topic": "strings", "title": "String to Integer (atoi)", "leetcode": 8, "difficulty": "Medium", "pattern": "Single-pass state machine with early clamp", "statement": "Convert a string to a 32-bit signed integer like C's atoi: skip leading spaces, read an optional\n'+' or '-', read digits until a non-digit, ignore the rest, and clamp to [-2^31, 2^31 - 1].\nExample: \"   -042\" -> -42; \"4193 with words\" -> 4193; \"words and 987\" -> 0;\n\"-91283472332\" -> -2147483648.", "why_here": "The first explicit state machine (SPACE, SIGN, DIGITS, STOP) with overflow clamped during accumulation.", "lc_slug": "string-to-integer-atoi", "brute": {"text": "Strip leading spaces, slice off the sign, slice out the maximal run of digits, call int() on that substring (or 0 if empty), apply the sign and clamp. The wasted work is materialising substrings and converting a possibly huge digit run into a big integer only to discard almost all of it in the clamp; in a fixed-width language that conversion overflows before the clamp runs.", "time": "O(n)", "space": "O(n)", "py": "def brute_force(s):\n    \"\"\"Strip spaces, slice off the sign, slice out the digits, int() them, clamp. O(n), O(n).\"\"\"\n    INT_MAX = 2**31 - 1\n    INT_MIN = -2**31\n    s = s.lstrip(\" \")\n    sign = 1\n    if len(s) > 0 and s[0] == \"-\":\n        sign = -1\n        s = s[1:]\n    elif len(s) > 0 and s[0] == \"+\":\n        s = s[1:]\n    digits = \"\"\n    for ch in s:\n        if ch < \"0\" or ch > \"9\":\n            break                         # the first non-digit ends the number\n        digits += ch\n    if digits == \"\":\n        return 0\n    value = sign * int(digits)            # may be a huge number, clamped only afterwards\n    return max(INT_MIN, min(INT_MAX, value))\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(\"   -042\"))             # -> -42\nprint(brute_force(\"4193 with words\"))     # -> 4193\nprint(brute_force(\"words and 987\"))       # -> 0\nprint(brute_force(\"-91283472332\"))        # -> -2147483648\n", "pseudo": "strip the leading spaces from s\nsign = 1\nif s starts with \"-\": sign = -1, drop that character\nelse if s starts with \"+\": drop that character\ndigits = \"\"\nfor each ch in s:\n    if ch is not a digit: break   (the first non-digit ends the number)\n    append ch to digits\nif digits is empty: return 0\nvalue = sign * integer value of digits\nreturn value clamped to [INT_MIN, INT_MAX]"}, "opt": {"text": "Every decision depends on one character at a time, so use a single index and a small state machine: SPACE -> SIGN -> DIGITS -> STOP. Accumulate num = num * 10 + digit as digits arrive and check the bound after every step; as soon as sign * num leaves the 32-bit range, return the clamp immediately. This uses O(1) extra space, never builds a substring, and never holds a number larger than about 10 * INT_MAX, which is how a real atoi avoids undefined overflow.", "time": "O(n)", "space": "O(1)", "py": "def my_atoi(s):\n    \"\"\"One index walks spaces, then sign, then digits; clamp the moment it overflows. O(n), O(1).\"\"\"\n    INT_MAX = 2**31 - 1\n    INT_MIN = -2**31\n    n = len(s)\n    i = 0\n    while i < n and s[i] == \" \":\n        i += 1                            # skip leading spaces\n    sign = 1\n    if i < n and (s[i] == \"+\" or s[i] == \"-\"):\n        if s[i] == \"-\":\n            sign = -1\n        i += 1                            # the sign is allowed only right before the digits\n    num = 0\n    while i < n and s[i] >= \"0\" and s[i] <= \"9\":\n        digit = ord(s[i]) - ord(\"0\")\n        num = num * 10 + digit\n        if sign * num >= INT_MAX:         # clamp as soon as the bound is crossed\n            return INT_MAX\n        if sign * num <= INT_MIN:\n            return INT_MIN\n        i += 1\n    return sign * num\n\n\n# --- try it: change the inputs and run ---\nprint(my_atoi(\"   -042\"))                 # -> -42\nprint(my_atoi(\"4193 with words\"))         # -> 4193\nprint(my_atoi(\"words and 987\"))           # -> 0\nprint(my_atoi(\"-91283472332\"))            # -> -2147483648\n", "pseudo": "i = 0\nwhile i < n and s[i] == \" \": i += 1   (skip leading spaces)\nsign = 1\nif i < n and s[i] is \"+\" or \"-\":\n    if s[i] == \"-\": sign = -1\n    i += 1\nnum = 0\nwhile i < n and s[i] is a digit:\n    digit = value of s[i]\n    num = num * 10 + digit\n    if sign * num >= INT_MAX: return INT_MAX   (clamp as soon as the bound is crossed)\n    if sign * num <= INT_MIN: return INT_MIN\n    i += 1\nreturn sign * num"}}, "simplify_path": {"slug": "simplify_path", "topic": "strings", "title": "Simplify Path", "leetcode": 71, "difficulty": "Medium", "pattern": "Stack simulation", "statement": "Convert an absolute Unix path to canonical form: a single leading '/', no trailing '/', no '.'\ncomponents, '..' resolved to the parent (a no-op at root) and consecutive slashes collapsed.\nExample: \"/home//foo/\" -> \"/home/foo\"; \"/a/./b/../../c/\" -> \"/c\"; \"/../\" -> \"/\".", "why_here": "The stack arrives: '..' cancels the most recent surviving directory name.", "lc_slug": "simplify-path", "brute": {"text": "Split on '/' and discard \"\" and \".\" parts, then repeatedly find the first \"..\", delete it along with the component before it, and restart the scan. Every pass re-examines the prefix before the first \"..\" although nothing in it changed.", "time": "O(n^2)", "space": "O(n)", "py": "def brute_force(path):\n    \"\"\"Drop \"\" and \".\", then repeatedly delete the first \"..\" and the name before it. O(n^2).\"\"\"\n    parts = []\n    for part in path.split(\"/\"):\n        if part != \"\" and part != \".\":\n            parts.append(part)\n    changed = True\n    while changed:                        # rescan from the start after every deletion\n        changed = False\n        for i in range(len(parts)):\n            if parts[i] == \"..\":\n                parts.pop(i)              # the \"..\" itself goes\n                if i > 0:\n                    parts.pop(i - 1)      # and it cancels the name before it (none at the root)\n                changed = True\n                break\n    return \"/\" + \"/\".join(parts)\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(\"/home//foo/\"))                  # -> /home/foo\nprint(brute_force(\"/a/./b/../../c/\"))              # -> /c\nprint(brute_force(\"/../\"))                         # -> /\nprint(brute_force(\"/.../a/../b/c/../d/./\"))        # -> /.../b/d\n", "pseudo": "parts = empty list\nfor each part in path split on \"/\":\n    if part is not \"\" and not \".\": append part to parts\nchanged = true\nwhile changed:   (rescan from the start after every deletion)\n    changed = false\n    for each index i in parts:\n        if parts[i] == \"..\":\n            remove parts[i]\n            if i > 0: remove parts[i - 1]   (\"..\" cancels the name before it; none at the root)\n            changed = true\n            break\nreturn \"/\" + parts joined by \"/\""}, "opt": {"text": "The redundancy is rescanning a prefix that is already canonical. Observation: \"..\" always cancels the most recently added surviving component, which is LIFO. Walk the components once, pushing directory names onto a stack and popping on \"..\" (if non-empty). The stack at the end is the canonical path; join it with '/'. Each component is pushed and popped at most once.", "time": "O(n)", "space": "O(n)", "py": "def simplify_path(path):\n    \"\"\"Stack of names: a name pushes, \"..\" pops, \"\" and \".\" do nothing. O(n) time, O(n) space.\"\"\"\n    stack = []\n    for part in path.split(\"/\"):\n        if part == \"..\":\n            if len(stack) > 0:\n                stack.pop()               # go up one level; no-op at the root\n        elif part != \"\" and part != \".\":\n            stack.append(part)            # \"\" (from //) and \".\" are skipped\n    return \"/\" + \"/\".join(stack)\n\n\n# --- try it: change the inputs and run ---\nprint(simplify_path(\"/home//foo/\"))                # -> /home/foo\nprint(simplify_path(\"/a/./b/../../c/\"))            # -> /c\nprint(simplify_path(\"/../\"))                       # -> /\nprint(simplify_path(\"/.../a/../b/c/../d/./\"))      # -> /.../b/d\n", "pseudo": "stack = empty stack of directory names\nfor each part in path split on \"/\":\n    if part == \"..\":\n        if the stack is not empty: pop the top   (go up one level; no-op at the root)\n    else if part is not \"\" and not \".\":\n        push part   (\"\" from // and \".\" are skipped)\nreturn \"/\" + stack joined by \"/\""}}, "minimum_remove_to_make_valid_parentheses": {"slug": "minimum_remove_to_make_valid_parentheses", "topic": "strings", "title": "Minimum Remove to Make Valid Parentheses", "leetcode": 1249, "difficulty": "Medium", "pattern": "Stack matching", "statement": "Given a string of lowercase letters and parentheses, remove the minimum number of parentheses\nso the result is valid, and return any such result.\nExample: \"lee(t(c)o)de)\" -> \"lee(t(c)o)de\"; \"a)b(c)d\" -> \"ab(c)d\"; \"))((\" -> \"\".", "why_here": "A stack of indices, so unmatched characters can be marked and dropped in one pass.", "lc_slug": "minimum-remove-to-make-valid-parentheses", "brute": {"text": "Scan left to right with a depth counter; the first ')' that drives depth negative is unmatched, so delete it and rescan from the beginning; repeat until none remain, then do the mirror image from the right for unmatched '('. After each deletion the rescan re-walks a prefix whose depth profile is already known.", "time": "O(n^2)", "space": "O(n)", "py": "def drop_unmatched(s, opener, closer):\n    \"\"\"Delete the first closer that has no opener before it, rescan from the start, repeat.\"\"\"\n    changed = True\n    while changed:\n        changed = False\n        depth = 0\n        for i in range(len(s)):\n            if s[i] == opener:\n                depth += 1\n            elif s[i] == closer:\n                depth -= 1\n            if depth < 0:                 # this closer has no partner: delete it and restart\n                s = s[:i] + s[i + 1:]\n                changed = True\n                break\n    return s\n\n\ndef brute_force(s):\n    \"\"\"Remove unmatched ')' left to right, then unmatched '(' right to left. O(n^2), O(n) space.\"\"\"\n    s = drop_unmatched(s, \"(\", \")\")\n    reversed_s = s[::-1]                  # read backwards, ')' opens and '(' closes\n    reversed_s = drop_unmatched(reversed_s, \")\", \"(\")\n    return reversed_s[::-1]\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(\"lee(t(c)o)de)\"))                # -> lee(t(c)o)de\nprint(brute_force(\"a)b(c)d\"))                      # -> ab(c)d\nprint(brute_force(\"))((\"))                         # -> (empty line)\nprint(brute_force(\"(a(b(c)d)\"))                    # -> a(b(c)d)\n", "pseudo": "drop_unmatched(s, opener, closer):\n    changed = true\n    while changed:\n        changed = false, depth = 0\n        for each index i in s:\n            if s[i] == opener: depth += 1\n            else if s[i] == closer: depth -= 1\n            if depth < 0:   (this closer has no partner: delete it and restart)\n                delete s[i], changed = true, break\n    return s\ns = drop_unmatched(s, \"(\", \")\")\nreversed_s = reverse of s   (read backwards, \")\" opens and \"(\" closes)\nreversed_s = drop_unmatched(reversed_s, \")\", \"(\")\nreturn reverse of reversed_s"}, "opt": {"text": "The redundancy is rescanning after each deletion. Observation: a ')' is unmatched exactly when no open '(' is available to pair with it, and a '(' is unmatched exactly when it is never closed; both are decidable in one left-to-right pass with a stack of indices of currently-open '('. A ')' pops when possible and is marked for deletion otherwise; whatever remains on the stack at the end is the set of never-closed '(' to delete. One pass plus one join.", "time": "O(n)", "space": "O(n)", "py": "def min_remove_to_make_valid(s):\n    \"\"\"Stack of open '(' indices; unmatched ')' and never-closed '(' are blanked. O(n), O(n).\"\"\"\n    chars = list(s)\n    stack = []                            # indices of '(' not yet closed\n    for i in range(len(s)):\n        if s[i] == \"(\":\n            stack.append(i)\n        elif s[i] == \")\":\n            if len(stack) > 0:\n                stack.pop()               # pair it with the most recent open '('\n            else:\n                chars[i] = \"\"             # unmatched ')': delete\n    for i in stack:\n        chars[i] = \"\"                     # '(' never closed: delete\n    return \"\".join(chars)\n\n\n# --- try it: change the inputs and run ---\nprint(min_remove_to_make_valid(\"lee(t(c)o)de)\"))   # -> lee(t(c)o)de\nprint(min_remove_to_make_valid(\"a)b(c)d\"))         # -> ab(c)d\nprint(min_remove_to_make_valid(\"))((\"))            # -> (empty line)\nprint(min_remove_to_make_valid(\"(a(b(c)d)\"))       # -> a(b(c)d)\n", "pseudo": "chars = list of the characters of s\nstack = empty stack of indices of \"(\" not yet closed\nfor each index i in s:\n    if s[i] == \"(\":\n        push i\n    else if s[i] == \")\":\n        if the stack is not empty: pop the top   (pair it with the most recent open \"(\")\n        else: chars[i] = \"\"   (unmatched \")\": delete)\nfor each index i still on the stack:\n    chars[i] = \"\"   (\"(\" never closed: delete)\nreturn chars joined"}}, "longest_palindromic_substring": {"slug": "longest_palindromic_substring", "topic": "strings", "title": "Longest Palindromic Substring", "leetcode": 5, "difficulty": "Medium", "pattern": "Expand around center", "statement": "Given a string s, return the longest substring that reads the same forwards and backwards;\nif several tie, any one is accepted.\nExample: \"babad\" -> \"bab\" (or \"aba\"); \"cbbd\" -> \"bb\".", "why_here": "First self-comparison: grow mirrors outward from 2n - 1 centres.", "lc_slug": "longest-palindromic-substring", "brute": {"text": "Enumerate every substring s[i:j+1] (there are O(n^2)) and test each for being a palindrome by comparing it with its reverse (O(n)). The wasted work is in the check: when s[i:j+1] is tested we have already tested s[i+1:j], whose answer decides the outer one except for a single extra comparison, yet we recompute it from scratch.", "time": "O(n^3)", "space": "O(1)", "py": "def brute_force(s):\n    \"\"\"Test every substring against its reverse, keep the longest. O(n^3) time, O(1) extra space.\"\"\"\n    best = \"\"\n    for i in range(len(s)):\n        for j in range(i, len(s)):\n            sub = s[i:j + 1]\n            if len(sub) > len(best) and sub == sub[::-1]:\n                best = sub                # longer and a palindrome: new best\n    return best\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(\"babad\"))                        # -> bab\nprint(brute_force(\"cbbd\"))                         # -> bb\nprint(brute_force(\"a\"))                            # -> a\nprint(brute_force(\"forgeeksskeegfor\"))             # -> geeksskeeg\n", "pseudo": "best = \"\"\nfor each start i:\n    for each end j >= i:\n        sub = s[i..j]\n        if length of sub > length of best and sub reads the same reversed:\n            best = sub   (longer and a palindrome: new best)\nreturn best"}, "opt": {"text": "Instead of fixing the endpoints and testing inward, fix the middle and grow outward: a palindrome is determined by its center, and extending it by one step on each side costs one comparison. There are only 2n - 1 centers: n single characters for odd lengths and n - 1 gaps for even lengths. From each center expand while s[lo] == s[hi]; at the first mismatch no wider palindrome with that center exists, so stop. Every comparison either grows a palindrome or ends a center, giving O(n^2) worst case with O(1) extra space and no table to fill.", "time": "O(n^2)", "space": "O(1)", "py": "def expand(s, lo, hi):\n    \"\"\"Grow outward from a center while both ends match; return (start, length). O(n) worst case.\"\"\"\n    while lo >= 0 and hi < len(s) and s[lo] == s[hi]:\n        lo -= 1\n        hi += 1\n    return lo + 1, hi - lo - 1            # the loop overshoots by one on each side\n\n\ndef longest_palindrome(s):\n    \"\"\"Try all 2n - 1 centers and expand around each. O(n^2) time, O(1) extra space.\"\"\"\n    best_start = 0\n    best_len = 0\n    for i in range(len(s)):\n        start, length = expand(s, i, i)           # odd length, centred on s[i]\n        if length > best_len:\n            best_start = start\n            best_len = length\n        start, length = expand(s, i, i + 1)       # even length, centred between s[i] and s[i+1]\n        if length > best_len:\n            best_start = start\n            best_len = length\n    return s[best_start:best_start + best_len]\n\n\n# --- try it: change the inputs and run ---\nprint(longest_palindrome(\"babad\"))                 # -> bab\nprint(longest_palindrome(\"cbbd\"))                  # -> bb\nprint(longest_palindrome(\"a\"))                     # -> a\nprint(longest_palindrome(\"forgeeksskeegfor\"))      # -> geeksskeeg\n", "pseudo": "expand(s, lo, hi):\n    while lo >= 0 and hi < n and s[lo] == s[hi]:\n        lo -= 1, hi += 1   (grow outward while both ends match)\n    return (lo + 1, hi - lo - 1)   (the loop overshoots by one on each side)\nbest_start = 0, best_len = 0\nfor each index i:\n    start, length = expand(s, i, i)   (odd length, centred on s[i])\n    if length > best_len: best_start = start, best_len = length\n    start, length = expand(s, i, i + 1)   (even length, centred between s[i] and s[i+1])\n    if length > best_len: best_start = start, best_len = length\nreturn s[best_start .. best_start + best_len)"}}, "moving_average_from_data_stream": {"slug": "moving_average_from_data_stream", "topic": "design", "title": "Moving Average from Data Stream", "leetcode": 346, "difficulty": "Easy", "pattern": "Sliding window queue with running sum", "statement": "Implement MovingAverage(size) with next(val) -> the average of the last size values seen so far,\nor of all values while fewer than size have arrived.\nExample: size 3; next(1) -> 1.0; next(10) -> 5.5; next(3) -> 4.667; next(5) -> 6.0.", "why_here": "Smallest tracker there is: a queue plus a running sum, and the habit of updating state by what enters and what leaves.", "lc_slug": "moving-average-from-data-stream", "brute": {"text": "Append every value to a list and, on each call, sum the last size entries and divide. The wasted work is re-adding size - 1 numbers that were already summed on the previous call, and keeping values that have left the window and can never influence an answer again.", "time": "O(size) per call", "space": "O(n) for the whole stream", "py": "from collections import deque   # popleft is O(1)\n\n\nclass BruteForce:\n    \"\"\"Keep the whole stream; re-sum the last size values on every call. O(size) per next.\"\"\"\n\n    def __init__(self, size):\n        self.size = size\n        self.seen = []\n\n    def next(self, val):\n        self.seen.append(val)\n        start = max(0, len(self.seen) - self.size)\n        tail = self.seen[start:]          # the last size values (fewer while the stream is short)\n        total = 0\n        for x in tail:\n            total += x                    # re-summed from scratch every time\n        return total / len(tail)\n\n\n# --- try it: change the inputs and run ---\nm = BruteForce(3)\nprint(m.next(1))                 # -> 1.0\nprint(m.next(10))                # -> 5.5\nprint(round(m.next(3), 3))       # -> 4.667\nprint(m.next(5))                 # -> 6.0\n", "pseudo": "init(size):\n    size = size, seen = empty list\nnext(val):\n    append val to seen\n    tail = the last size values of seen (fewer while the stream is short)\n    total = 0\n    for each x in tail: total += x   (re-summed from scratch every time)\n    return total / size of tail"}, "opt": {"text": "Consecutive windows overlap in all but two elements: the newest enters and the oldest leaves. Maintain the window's sum incrementally: total += new, and once the window exceeds size, total -= the element that falls out. A deque gives O(1) append at the back and pop at the front, and the division uses the current window length, which is smaller than size only during warm-up. Budget: O(1) per call, O(size) space. The tracker remembers at most size values plus one running total; everything that has slid out of the window is forgotten immediately.", "time": "O(1) per call", "space": "O(size)", "py": "from collections import deque   # popleft is O(1)\n\n\nclass MovingAverage:\n    \"\"\"A deque holds only the window; a running total avoids re-summing. O(1) per next.\"\"\"\n\n    def __init__(self, size):\n        self.size = size\n        self.window = deque()\n        self.total = 0\n\n    def next(self, val):\n        self.window.append(val)\n        self.total += val\n        if len(self.window) > self.size:\n            oldest = self.window.popleft()    # the value that just slid out of the window\n            self.total -= oldest\n        return self.total / len(self.window)\n\n\n# --- try it: change the inputs and run ---\nm = MovingAverage(3)\nprint(m.next(1))                 # -> 1.0\nprint(m.next(10))                # -> 5.5\nprint(round(m.next(3), 3))       # -> 4.667\nprint(m.next(5))                 # -> 6.0\n", "pseudo": "init(size):\n    size = size\n    window = empty deque, total = 0\nnext(val):\n    push val to the back of window, total += val\n    if size of window > size:\n        oldest = pop the front   (the value that just slid out of the window)\n        total -= oldest\n    return total / size of window"}}, "logger_rate_limiter": {"slug": "logger_rate_limiter", "topic": "design", "title": "Logger Rate Limiter", "leetcode": 359, "difficulty": "Easy", "pattern": "Hash map of next-allowed timestamps", "statement": "Implement Logger.should_print_message(timestamp, message) -> bool: a message may be printed only\nif the same message was not printed in the previous 10 seconds (printed at t means it is next\nallowed at t + 10). Timestamps arrive in non-decreasing order.\nExample: (1,\"foo\") True, (2,\"bar\") True, (3,\"foo\") False, (8,\"bar\") False, (11,\"foo\") True.", "why_here": "Same stream, now keyed: one hash map entry per message holding the only fact that matters, its next allowed time.", "lc_slug": "logger-rate-limiter", "brute": {"text": "Keep a list of every (timestamp, message) that was printed. On each call scan the list for the same message with a timestamp within the last 10 seconds. The wasted work is scanning entries for other messages, and entries so old they can never block anything again.", "time": "O(n) per call", "space": "O(n) unbounded", "py": "class BruteForce:\n    \"\"\"Keep every printed (timestamp, message); scan the whole log on each call. O(n) per call.\"\"\"\n\n    def __init__(self):\n        self.printed = []\n\n    def should_print_message(self, timestamp, message):\n        for old_time, old_message in self.printed:\n            if old_message == message and timestamp - old_time < 10:\n                return False              # the same message was printed less than 10 s ago\n        self.printed.append((timestamp, message))\n        return True\n\n\n# --- try it: change the inputs and run ---\nlg = BruteForce()\nprint(lg.should_print_message(1, \"foo\"))    # -> True\nprint(lg.should_print_message(2, \"bar\"))    # -> True\nprint(lg.should_print_message(3, \"foo\"))    # -> False\nprint(lg.should_print_message(8, \"bar\"))    # -> False\nprint(lg.should_print_message(10, \"foo\"))   # -> False\nprint(lg.should_print_message(11, \"foo\"))   # -> True\n", "pseudo": "init:\n    printed = empty list of (timestamp, message)\nshould_print_message(timestamp, message):\n    for each (old_time, old_message) in printed:\n        if old_message == message and timestamp - old_time < 10: return false\n    append (timestamp, message) to printed\n    return true"}, "opt": {"text": "For a given message only its most recent print matters, and 'printed in the last 10 seconds' is a single comparison against that one value. So keep dict message -> next allowed timestamp: print iff timestamp >= next_ok[message], then store timestamp + 10. Budget: one dict lookup and one store per call, O(1) time; space is one integer per distinct message. The tracker remembers only the next-allowed time per message and forgets every earlier print. If distinct messages are unbounded, pair the dict with a queue of (time, message) and evict entries older than 10 seconds on each call, capping memory at the number of messages printed in any 10-second window.", "time": "O(1) per call", "space": "O(m) for m distinct messages", "py": "class Logger:\n    \"\"\"Dict message -> the earliest timestamp it may print again. O(1) per call.\"\"\"\n\n    def __init__(self):\n        self.next_ok = {}\n\n    def should_print_message(self, timestamp, message):\n        allowed_at = self.next_ok.get(message, 0)     # never seen: allowed from time 0\n        if timestamp < allowed_at:\n            return False\n        self.next_ok[message] = timestamp + 10        # blocked for the next 10 seconds\n        return True\n\n\n# --- try it: change the inputs and run ---\nlg = Logger()\nprint(lg.should_print_message(1, \"foo\"))    # -> True\nprint(lg.should_print_message(2, \"bar\"))    # -> True\nprint(lg.should_print_message(3, \"foo\"))    # -> False\nprint(lg.should_print_message(8, \"bar\"))    # -> False\nprint(lg.should_print_message(10, \"foo\"))   # -> False\nprint(lg.should_print_message(11, \"foo\"))   # -> True\n", "pseudo": "init:\n    next_ok = empty dict message -> earliest timestamp it may print again\nshould_print_message(timestamp, message):\n    allowed_at = next_ok[message], or 0 if never seen\n    if timestamp < allowed_at: return false\n    next_ok[message] = timestamp + 10   (blocked for the next 10 seconds)\n    return true"}}, "design_hashmap": {"slug": "design_hashmap", "topic": "design", "title": "Design HashMap", "leetcode": 706, "difficulty": "Easy", "pattern": "Separate chaining with load-factor resizing", "statement": "Implement MyHashMap without built-in hash tables: put(key, value), get(key) -> value or -1,\nremove(key). Keys and values are non-negative integers up to 10^6.\nExample: put(1,1), put(2,2), get(1) -> 1, get(3) -> -1, put(2,1), get(2) -> 1, remove(2),\nget(2) -> -1.", "why_here": "Opens the box we have been using: buckets, chaining and load-factor resizing explain why a dict lookup is O(1) on average.", "lc_slug": "design-hashmap", "brute": {"text": "Keep one flat list of [key, value] pairs. put scans for the key (update or append), get scans, remove scans and drops the pair. The wasted work is comparing the target against every stored key, even though a key's own value could tell us where to look.", "time": "O(n) per operation", "space": "O(n)", "py": "class BruteForce:\n    \"\"\"One flat list of [key, value]; every operation scans all pairs. O(n) per operation.\"\"\"\n\n    def __init__(self):\n        self.pairs = []\n\n    def put(self, key, value):\n        for pair in self.pairs:\n            if pair[0] == key:\n                pair[1] = value           # key already there: overwrite in place\n                return\n        self.pairs.append([key, value])\n\n    def get(self, key):\n        for pair in self.pairs:\n            if pair[0] == key:\n                return pair[1]\n        return -1\n\n    def remove(self, key):\n        for i in range(len(self.pairs)):\n            if self.pairs[i][0] == key:\n                self.pairs.pop(i)\n                return\n\n\n# --- try it: change the inputs and run ---\nm = BruteForce()\nm.put(1, 1)\nm.put(2, 2)\nprint(m.get(1))      # -> 1\nprint(m.get(3))      # -> -1\nm.put(2, 1)\nprint(m.get(2))      # -> 1\nm.remove(2)\nprint(m.get(2))      # -> -1\n", "pseudo": "init:\n    pairs = empty list of [key, value]\nput(key, value):\n    for each pair in pairs:\n        if pair.key == key: pair.value = value, return   (overwrite in place)\n    append [key, value] to pairs\nget(key):\n    for each pair in pairs:\n        if pair.key == key: return pair.value\n    return -1\nremove(key):\n    for each index i in pairs:\n        if pairs[i].key == key: remove pairs[i], return"}, "opt": {"text": "The scan is slow because all keys share one list. Partition them by an address computed from the key, hash(key) % B, so a lookup only scans the few keys sharing that address. With B buckets and n keys the expected chain length is n / B; keep it constant by doubling B when n > 2B and rehashing every pair. Each doubling costs O(n) but happens only after Theta(n) inserts, so the amortised cost per operation is O(1). Budget: one hash, one modulo, one short chain walk per operation; space is the pairs plus B list headers. The tracker remembers only the pairs and the current bucket count; no ordering, no global index.", "time": "O(1) average per operation", "space": "O(n + B)", "py": "class MyHashMap:\n    \"\"\"Buckets of [key, value] pairs picked by key % bucket count; double when full. O(1) avg.\"\"\"\n\n    def __init__(self):\n        self.size = 0\n        self.buckets = []\n        for _ in range(8):\n            self.buckets.append([])       # 8 empty buckets to start\n\n    def bucket_for(self, key):\n        return self.buckets[key % len(self.buckets)]   # keys are ints, so the key is its own hash\n\n    def put(self, key, value):\n        bucket = self.bucket_for(key)\n        for pair in bucket:\n            if pair[0] == key:\n                pair[1] = value           # key already there: overwrite in place\n                return\n        bucket.append([key, value])\n        self.size += 1\n        if self.size > 2 * len(self.buckets):   # load factor above 2: double and rehash\n            self.resize()\n\n    def get(self, key):\n        for pair in self.bucket_for(key):\n            if pair[0] == key:\n                return pair[1]\n        return -1\n\n    def remove(self, key):\n        bucket = self.bucket_for(key)\n        for i in range(len(bucket)):\n            if bucket[i][0] == key:\n                bucket.pop(i)\n                self.size -= 1\n                return\n\n    def resize(self):\n        old_buckets = self.buckets\n        self.buckets = []\n        for _ in range(2 * len(old_buckets)):\n            self.buckets.append([])\n        for bucket in old_buckets:\n            for pair in bucket:\n                self.bucket_for(pair[0]).append(pair)   # every pair moves to its new bucket\n\n\n# --- try it: change the inputs and run ---\nm = MyHashMap()\nm.put(1, 1)\nm.put(2, 2)\nprint(m.get(1))      # -> 1\nprint(m.get(3))      # -> -1\nm.put(2, 1)\nprint(m.get(2))      # -> 1\nm.remove(2)\nprint(m.get(2))      # -> -1\n", "pseudo": "init:\n    size = 0, buckets = 8 empty lists\nbucket_for(key):\n    return buckets[key mod number of buckets]   (keys are ints, so the key is its own hash)\nput(key, value):\n    bucket = bucket_for(key)\n    for each pair in bucket:\n        if pair.key == key: pair.value = value, return\n    append [key, value] to bucket, size += 1\n    if size > 2 * number of buckets: resize   (load factor above 2: double and rehash)\nget(key):\n    for each pair in bucket_for(key): if pair.key == key, return pair.value\n    return -1\nremove(key):\n    bucket = bucket_for(key)\n    for each index i in bucket:\n        if bucket[i].key == key: remove bucket[i], size -= 1, return\nresize:\n    old_buckets = buckets, buckets = twice as many empty lists\n    for each pair in every old bucket: append pair to bucket_for(pair.key)"}}, "insert_delete_getrandom_o1": {"slug": "insert_delete_getrandom_o1", "topic": "design", "title": "Insert Delete GetRandom O(1)", "leetcode": 380, "difficulty": "Medium", "pattern": "Array + index map (swap-with-last delete)", "statement": "Implement RandomizedSet with insert(val) -> bool (False if already present), remove(val) -> bool\n(False if absent) and get_random() -> a uniformly random element, each in average O(1).\nExample: insert(1) True, remove(2) False, insert(2) True, get_random() in {1, 2}, remove(1) True,\ninsert(2) False, get_random() == 2.", "why_here": "First true combination of two parts: an array for random access plus an index map, joined by swap-with-last deletion.", "lc_slug": "insert-delete-getrandom-o-1", "brute": {"text": "Keep a plain list. insert scans for a duplicate, remove scans for the value and pops it from the middle, getRandom indexes a random position. The wasted work is the membership scans and the shifting of every element after the removed slot just to keep the list contiguous.", "time": "O(n) insert/remove, O(1) getRandom", "space": "O(n)", "py": "import random   # random.choice picks one element of a list uniformly\n\n\nclass BruteForce:\n    \"\"\"Plain list; insert and remove scan for the value. O(n) per insert and remove.\"\"\"\n\n    def __init__(self):\n        self.vals = []\n\n    def insert(self, val):\n        if val in self.vals:              # O(n) scan\n            return False\n        self.vals.append(val)\n        return True\n\n    def remove(self, val):\n        if val not in self.vals:\n            return False\n        self.vals.remove(val)             # O(n) scan, then everything after it shifts left\n        return True\n\n    def get_random(self):\n        return random.choice(self.vals)\n\n\n# --- try it: change the inputs and run ---\ns = BruteForce()\nprint(s.insert(1))                  # -> True\nprint(s.remove(2))                  # -> False\nprint(s.insert(2))                  # -> True\nprint(s.get_random() in (1, 2))     # -> True\nprint(s.remove(1))                  # -> True\nprint(s.insert(2))                  # -> False\nprint(s.get_random())               # -> 2\n", "pseudo": "init:\n    vals = empty list\ninsert(val):\n    if val is in vals (linear scan): return false\n    append val to vals\n    return true\nremove(val):\n    if val is not in vals: return false\n    remove val from vals   (scan, then everything after it shifts left)\n    return true\nget_random:\n    return a uniformly random element of vals"}, "opt": {"text": "getRandom needs a dense array so random.choice is uniform in O(1); membership needs a hash. Use both: vals (list) plus idx (dict val -> position). insert appends and records the index. Removal is the trick: the array must stay contiguous but NOT ordered, so instead of shifting, copy the last element into the hole, update that element's index in the dict, and pop the tail. Budget: every operation is one dict access plus one list append or pop, so O(1); space is one list slot and one dict entry per value. The tracker remembers each value's slot so deletion never searches, and can forget insertion order completely.", "time": "O(1) average per operation", "space": "O(n)", "py": "import random   # random.choice picks one element of a list uniformly\n\n\nclass RandomizedSet:\n    \"\"\"Dense list for random choice + dict val -> index; delete by swapping with the last. O(1).\"\"\"\n\n    def __init__(self):\n        self.vals = []\n        self.index_of = {}\n\n    def insert(self, val):\n        if val in self.index_of:\n            return False\n        self.index_of[val] = len(self.vals)   # it will sit at the end of the list\n        self.vals.append(val)\n        return True\n\n    def remove(self, val):\n        if val not in self.index_of:\n            return False\n        i = self.index_of[val]\n        last = self.vals[-1]\n        self.vals[i] = last               # move the last element into the hole\n        self.index_of[last] = i\n        self.vals.pop()                   # the hole is now at the end: cheap to drop\n        del self.index_of[val]\n        return True\n\n    def get_random(self):\n        return random.choice(self.vals)\n\n\n# --- try it: change the inputs and run ---\ns = RandomizedSet()\nprint(s.insert(1))                  # -> True\nprint(s.remove(2))                  # -> False\nprint(s.insert(2))                  # -> True\nprint(s.get_random() in (1, 2))     # -> True\nprint(s.remove(1))                  # -> True\nprint(s.insert(2))                  # -> False\nprint(s.get_random())               # -> 2\n", "pseudo": "init:\n    vals = empty list, index_of = empty dict val -> position in vals\ninsert(val):\n    if val in index_of: return false\n    index_of[val] = size of vals   (it will sit at the end of the list)\n    append val to vals\n    return true\nremove(val):\n    if val not in index_of: return false\n    i = index_of[val], last = last element of vals\n    vals[i] = last, index_of[last] = i   (move the last element into the hole)\n    pop the last element of vals\n    delete val from index_of\n    return true\nget_random:\n    return a uniformly random element of vals"}}, "time_based_key_value_store": {"slug": "time_based_key_value_store", "topic": "design", "title": "Time Based Key-Value Store", "leetcode": 981, "difficulty": "Medium", "pattern": "Sorted version list + binary search", "statement": "Implement TimeMap: set(key, value, timestamp) stores a value for key at that time, and\nget(key, timestamp) returns the value whose timestamp is the largest one <= timestamp, or \"\" if\nnone. All timestamps passed to set are strictly increasing.\nExample: set(\"foo\",\"bar\",1); get(\"foo\",1) -> \"bar\"; get(\"foo\",3) -> \"bar\"; set(\"foo\",\"bar2\",4);\nget(\"foo\",4) -> \"bar2\"; get(\"foo\",5) -> \"bar2\"; get(\"foo\",0) -> \"\".", "why_here": "Keep every version instead of the latest one; a sorted list per key plus bisect answers 'value as of time t'.", "lc_slug": "time-based-key-value-store", "brute": {"text": "Keep dict key -> list of (timestamp, value). set appends; get scans the entire list for the largest timestamp <= the query. The wasted work is the scan: every version is examined, including those far in the future and far in the past, to find one boundary.", "time": "O(1) set, O(n) get", "space": "O(n)", "py": "class BruteForce:\n    \"\"\"key -> list of (timestamp, value); get scans every version of the key. O(n) per get.\"\"\"\n\n    def __init__(self):\n        self.store = {}\n\n    def set(self, key, value, timestamp):\n        if key not in self.store:\n            self.store[key] = []\n        self.store[key].append((timestamp, value))\n\n    def get(self, key, timestamp):\n        best_time = -1\n        best_value = \"\"\n        for time, value in self.store.get(key, []):\n            if time <= timestamp and time > best_time:   # newest version not after timestamp\n                best_time = time\n                best_value = value\n        return best_value\n\n\n# --- try it: change the inputs and run ---\ntm = BruteForce()\ntm.set(\"foo\", \"bar\", 1)\nprint(tm.get(\"foo\", 1))      # -> bar\nprint(tm.get(\"foo\", 3))      # -> bar\ntm.set(\"foo\", \"bar2\", 4)\nprint(tm.get(\"foo\", 4))      # -> bar2\nprint(tm.get(\"foo\", 5))      # -> bar2\nprint(tm.get(\"foo\", 0))      # -> (empty line)\n", "pseudo": "init:\n    store = empty dict key -> list of (timestamp, value)\nset(key, value, timestamp):\n    if key not in store: store[key] = empty list\n    append (timestamp, value) to store[key]\nget(key, timestamp):\n    best_time = -1, best_value = \"\"\n    for each (time, value) in store[key]:\n        if time <= timestamp and time > best_time:   (newest version not after timestamp)\n            best_time = time, best_value = value\n    return best_value"}, "opt": {"text": "Timestamps for set arrive strictly increasing, so each key's list is already sorted for free: no sort step and no balanced tree. 'Largest timestamp <= t' on a sorted list is bisect_right(t) - 1, an O(log n) binary search. Keep two parallel lists per key (timestamps and values) so bisect runs on plain ints. Budget: O(1) append for set, O(log n) for get, space equal to the number of versions (the problem asks for full history). The tracker must remember every version but never needs to reorder anything; the invariant 'append keeps it sorted' is what the sortedness guarantee buys us.", "time": "O(1) set, O(log n) get", "space": "O(total versions)", "py": "class TimeMap:\n    \"\"\"Timestamps per key arrive sorted; binary search the newest one <= timestamp. O(log n) get.\"\"\"\n\n    def __init__(self):\n        self.times = {}      # key -> ascending list of timestamps\n        self.values = {}     # key -> values; values[key][i] was set at times[key][i]\n\n    def set(self, key, value, timestamp):\n        if key not in self.times:\n            self.times[key] = []\n            self.values[key] = []\n        self.times[key].append(timestamp)     # strictly increasing, so the list stays sorted\n        self.values[key].append(value)\n\n    def get(self, key, timestamp):\n        if key not in self.times:\n            return \"\"\n        times = self.times[key]\n        lo = 0\n        hi = len(times)\n        while lo < hi:                        # find the first index whose time is > timestamp\n            mid = (lo + hi) // 2\n            if times[mid] <= timestamp:\n                lo = mid + 1\n            else:\n                hi = mid\n        if lo == 0:\n            return \"\"                         # every version is newer than timestamp\n        return self.values[key][lo - 1]       # the one just before it is the newest <= timestamp\n\n\n# --- try it: change the inputs and run ---\ntm = TimeMap()\ntm.set(\"foo\", \"bar\", 1)\nprint(tm.get(\"foo\", 1))      # -> bar\nprint(tm.get(\"foo\", 3))      # -> bar\ntm.set(\"foo\", \"bar2\", 4)\nprint(tm.get(\"foo\", 4))      # -> bar2\nprint(tm.get(\"foo\", 5))      # -> bar2\nprint(tm.get(\"foo\", 0))      # -> (empty line)\n", "pseudo": "init:\n    times = empty dict key -> ascending list of timestamps\n    values = empty dict key -> values aligned with times\nset(key, value, timestamp):\n    if key not in times: times[key] = empty list, values[key] = empty list\n    append timestamp to times[key]   (strictly increasing, so the list stays sorted)\n    append value to values[key]\nget(key, timestamp):\n    if key not in times: return \"\"\n    lo = 0, hi = size of times[key]\n    while lo < hi:   (binary search for the first index whose time is > timestamp)\n        mid = (lo + hi) // 2\n        if times[key][mid] <= timestamp: lo = mid + 1\n        else: hi = mid\n    if lo == 0: return \"\"   (every version is newer than timestamp)\n    return values[key][lo - 1]"}}, "lru_cache": {"slug": "lru_cache", "topic": "design", "title": "LRU Cache", "leetcode": 146, "difficulty": "Medium", "pattern": "Hash map + doubly linked list", "statement": "Design a fixed-capacity cache with get(key) -> value (or -1) and put(key, value), both in O(1)\naverage time. When a put exceeds capacity, evict the least recently used key, i.e. the one whose\nlast get or put is oldest.\nExample: capacity 2; put(1,1), put(2,2), get(1) -> 1, put(3,3) evicts key 2, get(2) -> -1,\nget(3) -> 3.", "why_here": "The classic combination: hash map for lookup plus doubly linked list for recency order, every operation O(1).", "lc_slug": "lru-cache", "brute": {"text": "Keep a plain list of (key, value) ordered most-recent first. get scans the list for the key, then pops it and re-inserts it at index 0; put does the same scan and pops the last element on overflow. The wasted work is twofold: a full linear scan to find a key we could jump to directly, and shifting every other element just to move one item to the front.", "time": "O(n) per operation", "space": "O(capacity)", "py": "class Node:\n    def __init__(self, key, val):\n        self.key = key\n        self.val = val\n        self.prev = None\n        self.next = None\n\n\nclass BruteForce:\n    \"\"\"List of [key, value], most recently used first; every op scans and shifts. O(n) per op.\"\"\"\n\n    def __init__(self, capacity):\n        self.capacity = capacity\n        self.items = []\n\n    def get(self, key):\n        for i in range(len(self.items)):\n            if self.items[i][0] == key:\n                item = self.items.pop(i)\n                self.items.insert(0, item)    # move to the front: it is now the most recent\n                return item[1]\n        return -1\n\n    def put(self, key, value):\n        for i in range(len(self.items)):\n            if self.items[i][0] == key:\n                self.items.pop(i)         # drop the old entry; it is re-added at the front\n                break\n        self.items.insert(0, [key, value])\n        if len(self.items) > self.capacity:\n            self.items.pop()              # the last item is the least recently used\n\n\n# --- try it: change the inputs and run ---\nc = BruteForce(2)\nc.put(1, 1)\nc.put(2, 2)\nprint(c.get(1))      # -> 1\nc.put(3, 3)          # evicts key 2\nprint(c.get(2))      # -> -1\nc.put(4, 4)          # evicts key 1\nprint(c.get(1))      # -> -1\nprint(c.get(3))      # -> 3\nprint(c.get(4))      # -> 4\n", "pseudo": "init(capacity):\n    capacity = capacity\n    items = empty list of [key, value], most recently used first\nget(key):\n    for each index i in items:\n        if items[i].key == key:\n            move items[i] to the front   (it is now the most recent)\n            return its value\n    return -1\nput(key, value):\n    for each index i in items:\n        if items[i].key == key: remove items[i], stop scanning\n    insert [key, value] at the front\n    if size of items > capacity: remove the last item   (the least recently used)"}, "opt": {"text": "There are two separate costs: locating the key and promoting it to most-recent. A hash map removes the first (key -> node in O(1)). The second is O(n) only because an array shifts on removal; a doubly linked list unlinks a node in O(1) given a pointer to it, and the hash map hands us exactly that pointer. Per-operation budget: one dict lookup plus a constant number of pointer rewrites, so O(1) time; space is one node per live key. The tracker must remember key, value and both neighbour pointers per entry; it can forget timestamps and access counters entirely because the list ORDER is the recency information.", "time": "O(1) per operation", "space": "O(capacity)", "py": "class Node:\n    def __init__(self, key, val):\n        self.key = key\n        self.val = val\n        self.prev = None\n        self.next = None\n\n\nclass LRUCache:\n    \"\"\"Dict key -> node plus a doubly linked list ordered by recency. O(1) per get and put.\"\"\"\n\n    def __init__(self, capacity):\n        self.capacity = capacity\n        self.nodes = {}                   # key -> Node\n        self.head = Node(0, 0)            # sentinel: head.next is the most recently used\n        self.tail = Node(0, 0)            # sentinel: tail.prev is the least recently used\n        self.head.next = self.tail\n        self.tail.prev = self.head\n\n    def unlink(self, node):\n        node.prev.next = node.next        # the two neighbours skip over node\n        node.next.prev = node.prev\n\n    def push_front(self, node):\n        node.prev = self.head             # squeeze node in between head and head.next\n        node.next = self.head.next\n        self.head.next.prev = node\n        self.head.next = node\n\n    def get(self, key):\n        if key not in self.nodes:\n            return -1\n        node = self.nodes[key]\n        self.unlink(node)                 # touching a key makes it the most recent\n        self.push_front(node)\n        return node.val\n\n    def put(self, key, value):\n        if key in self.nodes:\n            node = self.nodes[key]\n            node.val = value\n            self.unlink(node)\n        else:\n            node = Node(key, value)\n            self.nodes[key] = node\n            if len(self.nodes) > self.capacity:\n                victim = self.tail.prev   # least recently used\n                self.unlink(victim)\n                del self.nodes[victim.key]\n        self.push_front(node)\n\n\n# --- try it: change the inputs and run ---\nc = LRUCache(2)\nc.put(1, 1)\nc.put(2, 2)\nprint(c.get(1))      # -> 1\nc.put(3, 3)          # evicts key 2\nprint(c.get(2))      # -> -1\nc.put(4, 4)          # evicts key 1\nprint(c.get(1))      # -> -1\nprint(c.get(3))      # -> 3\nprint(c.get(4))      # -> 4\n", "pseudo": "init(capacity):\n    capacity = capacity, nodes = empty dict key -> node\n    head, tail = sentinel nodes linked head <-> tail   (head.next = most recent, tail.prev = least)\nunlink(node): node.prev.next = node.next, node.next.prev = node.prev\npush_front(node): link node in between head and head.next\nget(key):\n    if key not in nodes: return -1\n    node = nodes[key]\n    unlink(node), push_front(node)   (touching a key makes it the most recent)\n    return node.val\nput(key, value):\n    if key in nodes:\n        node = nodes[key], node.val = value\n        unlink(node)\n    else:\n        node = new node(key, value), nodes[key] = node\n        if size of nodes > capacity:\n            victim = tail.prev   (least recently used)\n            unlink(victim), delete victim.key from nodes\n    push_front(node)"}}}, "fundamentals": [{"id": "fund-arrays_hashing", "topic": "arrays_hashing", "title": "Arrays and Hashing", "intro": "Arrays are contiguous memory with O(1) indexing but O(n) search by value; hash maps and sets add O(1) average lookup\nby value. This chapter teaches you to answer questions about the past of a scan in constant time: which values you\nhave seen, where, how often, and what they add up to. It ends with the tools for counting by value order, merge-sort\ncounting and Fenwick trees.", "background": [{"title": "What it is", "md": "### The array\n\nAn array is one contiguous block of memory, cut into equal-sized slots. If the block starts at address `base` and each slot\nis `w` bytes, slot `i` lives at `base + i * w`. That is one multiplication and one addition, whatever `i` is. This is why\nreading `a[i]` costs O(1): the machine does not walk to slot `i`, it computes where slot `i` is.\n\n```text\naddress:  1000  1008  1016  1024  1032     (w = 8 bytes)\n        +-----+-----+-----+-----+-----+\n  a     |  3  |  8  |  5  |  2  |  9  |\n        +-----+-----+-----+-----+-----+\nindex:     0     1     2     3     4\n\na[3] -> base + 3*8 = 1000 + 24 = 1024 -> 2\n```\n\n(A Python list stores pointers to objects in those slots rather than the numbers themselves, but the arithmetic is the\nsame, and indexing is still O(1).)\n\nThe catch is the other direction. Indexing goes from position to value for free. Going from value to position, \"where is\nthe 5?\", has no formula. You must look at slots one by one: O(n). And \"have I seen X?\" is exactly a value-to-position\nquestion. That asymmetry is the whole reason this chapter exists.\n\n### Making value-to-position cheap: hashing\n\nThe trick is to invent a formula from value to position. A **hash function** turns any key into an integer; we then reduce\nthat integer to a slot number with `hash(key) % m`, where `m` is the number of slots (called **buckets**). To store a key,\ncompute its bucket and put it there. To look it up, compute the same bucket and look only there.\n\n```text\nm = 8 buckets, hash(int) = the int itself (true in Python)\n\ninsert 3   -> 3  % 8 = 3\ninsert 8   -> 8  % 8 = 0\ninsert 5   -> 5  % 8 = 5\ninsert 11  -> 11 % 8 = 3   collision with 3!\n\nbucket: 0     1    2    3          4    5    6    7\n      +----+----+----+----------+----+----+----+----+\n      | 8  |    |    | 3 -> 11  |    | 5  |    |    |\n      +----+----+----+----------+----+----+----+----+\n```\n\nTwo different keys landing in the same bucket is a **collision**, and it is unavoidable: there are more possible keys\nthan buckets. The simplest fix, **chaining**, lets each bucket hold a short list. A lookup computes the bucket, then walks\nthat list comparing keys with `==`. CPython's dict and set actually use **open addressing** (on a collision, probe\nanother slot by a fixed rule), but the cost story is identical, so picture chains.\n\n### Why lookups are O(1) on average\n\nThe cost of a lookup is the length of the chain you walk. Define the **load factor** as `n / m`, keys per bucket. If\nthe hash spreads keys evenly, the average chain has length `n / m`. Keep that ratio below a constant and the average\nchain is short no matter how big `n` gets.\n\nThe table keeps it below a constant by **resizing**: when `n / m` crosses a threshold (CPython uses about 2/3), it\nallocates a table roughly twice as large and re-inserts every key, since `% m` has changed.\n\n```text\nbefore (m = 4, n = 3, load 0.75 -> too full)\n  0:[8]  1:[]  2:[]  3:[3, 11]\n\nafter resize (m = 8): every key re-hashed\n  0:[8]  1:[]  2:[]  3:[3, 11]  4:[]  5:[]  6:[]  7:[]\n                     (3 and 11 still collide mod 8)\n```\n\nTwo honest caveats. \"Average\" assumes keys spread out; a nasty input can push many keys into one bucket and a lookup\ndegrades to O(n). For interview inputs this does not happen, and we write O(1). Second, a key must be **hashable**: its\nhash must never change while it sits in the table, otherwise it would be looked for in the wrong bucket. That is why\nPython refuses lists as keys and accepts tuples.\n\n### What \"amortised\" means\n\nA resize costs O(n), which looks like it ruins O(1) inserts. It does not, because resizes are rare. Doubling from 1 to 2\nto 4 ... to `n` copies `1 + 2 + 4 + ... + n < 2n` keys in total across all resizes. Spread those `2n` copies over `n`\ninserts and each insert pays about 2 extra copies. \"Amortised O(1)\" means exactly this: any single operation may be\nexpensive, but a sequence of `n` operations costs O(n) in total.\n\n```text\ninsert #:   1  2  3  4  5  6  7  8  9 ...\ncopy cost:  0  1  2  0  4  0  0  0  8 ...\n            ^  ^  ^     ^           ^ resizes (double)\nrunning total of copies always < 2 * inserts\n```\n\nThe same word appears in this chapter for algorithms, not just tables. In longest consecutive sequence an inner `while`\nloop looks quadratic, yet across the whole run it touches each element once. Charging work to the element that causes it,\nnot to the loop iteration, is amortised thinking."}, {"title": "Operations and what they cost", "md": "| Operation | Cost | Why |\n|---|---|---|\n| `a[i]` read or write | O(1) | address = base + i * w |\n| `x in list` | O(n) | no formula from value to slot; scan |\n| `list.append(x)` | O(1) amortised | occasional doubling, paid off over many appends |\n| `list.insert(0, x)` | O(n) | every element shifts right by one |\n| `d[key]`, `key in d`, `s.add(x)` | O(1) average | hash to one bucket, compare a few keys |\n| `del d[key]` | O(1) average | same bucket lookup |\n| Iterate a dict or set | O(n) | visit every stored key |\n| Build `Counter(a)` or `set(a)` | O(n) | n inserts |\n| `sorted(a)` | O(n log n) | comparison sort |\n| Prefix sums of length n | O(n) build, O(1) query | each total extends the previous one |\n\nLookup in a hash table, drawn:\n\n```text\n\"is 11 in the table?\"\n  hash(11) % 8 = 3\n  bucket 3: [3 -> 11]\n             ^    ^\n           3==11? no   11==11? yes -> found\n  buckets 0,1,2,4..7 never looked at\n```\n\nA prefix sum, drawn. `P[i]` is the sum of the first `i` elements, so `P` has one extra slot at the front:\n\n```text\nindex:      0   1   2   3   4\na:        [ 3,  8,  5,  2 ]\nP:        [ 0,  3, 11, 16, 18 ]\n                 ^           ^\nsum of a[1..3] = 8+5+2 = P[4] - P[1] = 18 - 3 = 15\n```\n\nAny range sum becomes one subtraction. The same idea with multiplication gives prefix products (product of array except\nself), and the same idea combined with a hash map of earlier `P` values counts subarrays with a given sum.\n\nA canonical key, drawn. Anagrams differ in order, so remove order:\n\n```text\n\"eat\" --sort--> \"aet\"     \"eat\" --count--> (1,0,0,0,1,..,1,..)\n\"tea\" --sort--> \"aet\"     \"tea\" --count--> (1,0,0,0,1,..,1,..)\n\"tan\" --sort--> \"ant\"                       a       e     t\nequal key  <=>  same group\n```\n\nThe index-as-hash trick, drawn. If the values you care about are `1..n` and the array has `n` slots, slot `v - 1` is a\nperfect, collision-free bucket for `v`:\n\n```text\nvalues:   [ 3, 4, -1, 1 ]    n = 4, care about 1..4\npark v at index v-1:\nindex:      0   1   2   3\n          [ 1, -1,  3,  4 ]\n                ^ slot 1 does not hold 2 -> 2 is missing\n```\n\nBucket sort, drawn. When sort keys are small integers in `0..K`, make `K + 1` shelves and drop each item on its shelf;\nreading shelves left to right is sorted order, with no comparisons:\n\n```text\nitem:count   a:3  b:1  c:3  d:2\nshelf:   0    1    2    3\n       [   ][ b ][ d ][ a c ]   read right to left: a c d b\n```"}, {"title": "The invariant", "md": "Nearly every one-pass solution here protects one sentence:\n\n> When you stand at index `i`, the structure summarises exactly `a[0..i-1]`: everything to the left, nothing to the right,\n> and not the current element.\n\nCheck-then-insert is how you keep it. You query the structure about `a[i]` first (it knows only the past), then fold `a[i]`\nin so the next step sees it.\n\n```text\nLEGAL at i = 2  (two sum, target 10)\n  a:     3   8  [5]  2\n  seen: {3:0, 8:1}          left part only; 5 not yet inserted\n  ask \"is 10-5 = 5 in seen?\" -> no (correct: only one 5)\n\nILLEGAL at i = 2  (inserted before checking)\n  a:     3   8  [5]  2\n  seen: {3:0, 8:1, 5:2}     current element leaked in\n  ask \"is 5 in seen?\" -> yes -> pairs index 2 with itself\n```\n\nThe hash table itself has an internal invariant you rely on without seeing: every key sits in (or on the probe path\nfrom) the bucket its hash names. Mutate a key after inserting it and that invariant breaks silently; that is the\nhashability rule from above."}, {"title": "Python toolbox", "md": "```python\nfrom collections import Counter, defaultdict\nseen = {}                         # value -> index\nif target - v in seen: ...        # O(1) average membership\ngroups = defaultdict(list)        # missing key -> new []\ngroups[tuple(sorted(w))].append(w)  # tuple: hashable key\nfreq = Counter(nums)              # value -> count\nfreq.most_common(k)               # k largest counts, O(n log k)\nlast = d.get(v, -1)               # default without KeyError\nfrom itertools import accumulate\nP = [0, *accumulate(nums)]        # prefix sums, P[0] = 0\n```\n\nQuirks worth knowing. `hash(-1) == hash(-2)` in CPython; harmless, it is only a collision. Dicts remember insertion order\n(Python 3.7+), but sets do not promise any order, so never depend on set iteration order. `Counter` returns 0 for a\nmissing key without inserting it; `defaultdict` inserts the default on every read of a missing key, so `if d[k]:` on a\ndefaultdict quietly grows it. Lists, sets and dicts are unhashable; `tuple` and `frozenset` are hashable."}, {"title": "Mistakes people make", "md": "1. Inserting the current element before checking it, so it pairs with itself. Fix: check, then insert.\n2. Using a list as a dict key. Fix: `tuple(lst)` or a joined string.\n3. `x in some_list` inside a loop, silently O(n) each time. Fix: build `set(some_list)` once.\n4. Storing the first index of a value when the nearest one matters. Fix: overwrite on every sighting.\n5. Iterating the original list (with duplicates) instead of the set, repeating work. Fix: loop over the set.\n6. Forgetting the empty prefix `P[0] = 0` (or `{0: 1}` in a count map), missing subarrays that start at index 0. Fix:\n   seed it before the loop.\n7. Bucket array of size `n` when a count can equal `n`. Fix: size `n + 1`.\n8. Assuming a dict is O(1) worst case and arguing complexity from it on adversarial input. Fix: say \"average\".\n9. Reading a defaultdict to test membership, which inserts. Fix: use `k in d`.\n10. Sorting to \"simplify\" when the problem demands O(n). Fix: buckets or a set."}], "items": [{"id": "fund-sorting-01_insertion_sort", "name": "01_insertion_sort", "area": "sorting", "title": "Insertion Sort", "key_ops": "take the next element, shift larger prefix elements one slot right, fill the gap", "statement": "Grow a sorted prefix one element at a time: take the next element, shift every element of the\nsorted prefix that is bigger than it one slot to the right, and place it in the gap that opens.\nO(n^2) in general, O(n) when nearly sorted; in place and stable (equal keys never shift past).\nExample: [5, 2, 4, 6, 1, 3] -> [1, 2, 3, 4, 5, 6]", "text": "Insertion sort grows a sorted prefix one element at a time: take the next value, shift every larger element of the prefix one slot to the right, and drop the value into the gap. It is the sort you reach for on tiny or nearly sorted input, and it is stable because equal values never shift past each other. The common slip is stopping the scan before index 0, so the first element can never move. Quadratic time in general, linear when the input is almost sorted, no extra space.", "py": "def insertion_sort(nums):\n    \"\"\"Sorted prefix grows by one each round; the new element walks left to its slot. O(n^2).\"\"\"\n    a = list(nums)\n    for i in range(1, len(a)):\n        key = a[i]\n        j = i - 1\n        while j >= 0 and a[j] > key:   # j may reach 0: the first element must be able to shift too\n            a[j + 1] = a[j]\n            j -= 1\n        a[j + 1] = key                 # the gap is just right of the element that stopped the scan\n    return a\n\n\n# --- try it: change the inputs and run ---\nprint(insertion_sort([5, 2, 4, 6, 1, 3]))   # -> [1, 2, 3, 4, 5, 6]\nprint(insertion_sort([2, 1]))               # -> [1, 2]\nprint(insertion_sort([3, 3, 1]))            # -> [1, 3, 3]\nprint(insertion_sort([]))                   # -> []\n", "pseudo": "a = copy of nums\nfor i from 1 to len(a) - 1:\n    key = a[i]\n    j = i - 1\n    while j >= 0 and a[j] > key:   (j may reach 0: the first element can shift too)\n        a[j + 1] = a[j]\n        j = j - 1\n    a[j + 1] = key\nreturn a"}, {"id": "fund-sorting-02_merge_sort", "name": "02_merge_sort", "area": "sorting", "title": "Merge Sort", "key_ops": "split in half, sort each half recursively, merge two sorted runs, left wins ties", "statement": "Split the array in half, sort each half, and merge the two sorted runs: repeatedly take the smaller\nhead, the left one on ties (that is what keeps the sort stable), then append whatever run is left.\nO(n log n) in every case, O(n) extra space for the merged runs.\nExample: [5, 2, 4, 6, 1, 3] -> [1, 2, 3, 4, 5, 6]", "text": "Merge sort splits the array in half, sorts each half recursively, and merges the two sorted runs by repeatedly taking the smaller head. It is the comparison sort to name when you need a guaranteed bound or stability, and the merge step on its own is a tool for combining sorted lists. Taking the left run on ties is what keeps it stable, and forgetting to append the leftover run after one side empties loses elements. Always O(n log n) time, O(n) extra space for the merged runs.", "py": "def merge(left, right):\n    \"\"\"Two pointers over two sorted runs; take the smaller head, left wins ties. O(n + m).\"\"\"\n    out = []\n    i = 0\n    j = 0\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:        # <= : on a tie take the left run first (keeps it stable)\n            out.append(left[i])\n            i += 1\n        else:\n            out.append(right[j])\n            j += 1\n    out.extend(left[i:])               # exactly one run still has elements; append both to be safe\n    out.extend(right[j:])\n    return out\n\n\ndef merge_sort(nums):\n    \"\"\"Split, sort both halves, merge. O(n log n): log n levels of O(n) merging.\"\"\"\n    if len(nums) <= 1:                 # a run of one element is already sorted: stop the recursion\n        return list(nums)\n    mid = len(nums) // 2\n    left = merge_sort(nums[:mid])\n    right = merge_sort(nums[mid:])\n    return merge(left, right)\n\n\n# --- try it: change the inputs and run ---\nprint(merge_sort([5, 2, 4, 6, 1, 3]))   # -> [1, 2, 3, 4, 5, 6]\nprint(merge([1, 4], [2, 3, 5]))         # -> [1, 2, 3, 4, 5]\nprint(merge_sort([2, 1]))               # -> [1, 2]\nprint(merge_sort([]))                   # -> []\n", "pseudo": "merge(left, right):\n    out = [], i = 0, j = 0\n    while both runs have elements left:\n        if left[i] <= right[j]: append left[i], i = i + 1   (<= so the left wins ties: stable)\n        else: append right[j], j = j + 1\n    append the rest of left, then the rest of right\n    return out\nmerge_sort(nums):\n    if len(nums) <= 1: return a copy\n    mid = len(nums) // 2\n    left = merge_sort(nums[:mid]), right = merge_sort(nums[mid:])\n    return merge(left, right)"}, {"id": "fund-sorting-03_quick_sort", "name": "03_quick_sort", "area": "sorting", "title": "Quick Sort", "key_ops": "Lomuto partition around the last element, swap the pivot to its final slot, recurse", "statement": "Pick the last element as the pivot. Walk j across the range keeping a[lo..i] as the elements <=\npivot: every time a[j] <= pivot grow that region by swapping a[j] in. Finally swap the pivot to\ni + 1, its final position, and recurse on the two sides. O(n log n) on average, O(n^2) on sorted\ninput with this pivot, in place, not stable.\nExample: [5, 2, 4, 6, 1, 3] -> [1, 2, 3, 4, 5, 6]", "text": "Quick sort picks a pivot, partitions the range so everything at most the pivot sits to its left, swaps the pivot into that final slot, and recurses on both sides. Lomuto partition keeps a small region at the front and grows it by one swap whenever the scan meets a value at most the pivot. The pivot must stay out of the scan and out of both recursive calls; that is where off-by-one bugs live. O(n log n) on average, quadratic on sorted input, in place, not stable.", "py": "def partition(a, lo, hi):\n    \"\"\"Lomuto: pivot a[hi]; a[lo..i] holds the values <= pivot; return the pivot's final index.\"\"\"\n    pivot = a[hi]\n    i = lo - 1                         # end of the \"small\" region, empty at first\n    for j in range(lo, hi):            # stop before hi: the pivot itself must not be swapped\n        if a[j] <= pivot:\n            i += 1\n            a[i], a[j] = a[j], a[i]\n    a[i + 1], a[hi] = a[hi], a[i + 1]  # the pivot goes to i + 1, right after the small region\n    return i + 1\n\n\ndef sort_range(a, lo, hi):\n    \"\"\"Partition, then sort the two sides; a range of 0 or 1 elements is already sorted.\"\"\"\n    if lo < hi:\n        p = partition(a, lo, hi)\n        sort_range(a, lo, p - 1)       # the pivot at p is final: leave it out of both sides\n        sort_range(a, p + 1, hi)\n\n\ndef quick_sort(nums):\n    \"\"\"Copy, then sort the whole range in place. O(n log n) average.\"\"\"\n    a = list(nums)\n    sort_range(a, 0, len(a) - 1)\n    return a\n\n\n# --- try it: change the inputs and run ---\nprint(quick_sort([5, 2, 4, 6, 1, 3]))   # -> [1, 2, 3, 4, 5, 6]\nprint(quick_sort([3, 1, 2]))            # -> [1, 2, 3]\nprint(quick_sort([2, 2, 1]))            # -> [1, 2, 2]\nprint(quick_sort([]))                   # -> []\n", "pseudo": "partition(a, lo, hi):\n    pivot = a[hi], i = lo - 1\n    for j from lo to hi - 1:   (stop before hi: the pivot itself must not be swapped)\n        if a[j] <= pivot: i = i + 1, swap a[i] and a[j]\n    swap a[i + 1] and a[hi]\n    return i + 1\nsort_range(a, lo, hi):\n    if lo < hi:\n        p = partition(a, lo, hi)\n        sort_range(a, lo, p - 1), sort_range(a, p + 1, hi)\nquick_sort(nums):\n    a = copy of nums, sort_range(a, 0, len(a) - 1), return a"}, {"id": "fund-sorting-04_heap_sort", "name": "04_heap_sort", "area": "sorting", "title": "Heap Sort", "key_ops": "heapify into a max-heap, swap the root with the last heap slot, sift the root down", "statement": "Build a max-heap in place (sift down from the last parent to the root), then repeat: swap the root,\nthe maximum, with the last slot of the heap region, shrink the region by one, and sift the new root\ndown. The sorted suffix grows from the right. O(n log n) always, O(1) extra space, not stable.\nExample: [5, 2, 4, 6, 1, 3] -> [1, 2, 3, 4, 5, 6]", "text": "Heap sort first turns the array into a max-heap in place by sifting down from the last parent to the root, then repeatedly swaps the root, the maximum, with the last slot of the heap region and shrinks that region by one. The sorted suffix grows from the right while the heap shrinks from the left. The usual mistake is sifting over the whole array instead of only the shrunk heap, which drags sorted values back in. Always O(n log n) time with O(1) extra space, not stable.", "py": "def sift_down(a, i, size):\n    \"\"\"Max-heap sift: swap a[i] with its larger child while that child is bigger. O(log n).\"\"\"\n    while True:\n        child = 2 * i + 1\n        if child + 1 < size and a[child + 1] > a[child]:\n            child += 1                 # pick the larger of the two children\n        if child >= size or a[child] <= a[i]:\n            return                     # no child, or the heap property already holds here\n        a[i], a[child] = a[child], a[i]\n        i = child\n\n\ndef heap_sort(nums):\n    \"\"\"Heapify, then move the max to the end n - 1 times. O(n log n), in place.\"\"\"\n    a = list(nums)\n    n = len(a)\n    for i in range(n // 2 - 1, -1, -1):    # last parent down to the root\n        sift_down(a, i, n)\n    for end in range(n - 1, 0, -1):        # end goes down to 1 so the last two values get ordered\n        a[0], a[end] = a[end], a[0]        # the max leaves the heap and joins the sorted suffix\n        sift_down(a, 0, end)               # sift inside the shrunk heap a[:end], not all of a\n    return a\n\n\n# --- try it: change the inputs and run ---\nprint(heap_sort([5, 2, 4, 6, 1, 3]))   # -> [1, 2, 3, 4, 5, 6]\nprint(heap_sort([2, 1]))               # -> [1, 2]\nprint(heap_sort([1, 1, 1]))            # -> [1, 1, 1]\nprint(heap_sort([]))                   # -> []\n", "pseudo": "sift_down(a, i, size):\n    loop:\n        child = 2 * i + 1\n        if child + 1 < size and a[child + 1] > a[child]: child = child + 1\n        if child >= size or a[child] <= a[i]: return\n        swap a[i] and a[child], i = child\nheap_sort(nums):\n    a = copy of nums, n = len(a)\n    for i from n // 2 - 1 down to 0: sift_down(a, i, n)\n    for end from n - 1 down to 1:\n        swap a[0] and a[end]\n        sift_down(a, 0, end)   (sift inside the shrunk heap a[:end], not the whole array)\n    return a"}, {"id": "fund-sorting-05_counting_and_bucket_sort", "name": "05_counting_and_bucket_sort", "area": "sorting", "title": "Counting Sort and Bucket Sort", "key_ops": "count by value, emit each value count times, bucket by int(x * n), sort buckets", "statement": "Two non-comparison sorts. Counting sort for small non-negative ints: counts[v] is how often v\noccurs, then walk the counts in order; O(n + k) with k the max value. Bucket sort for floats in\n[0, 1): bucket index int(x * n) grows with x, so sorting each bucket and concatenating sorts all.\nExample: [2, 5, 3, 0, 2, 3, 0, 3] -> [0, 0, 2, 2, 3, 3, 3, 5]\n         [0.78, 0.17, 0.39, 0.26, 0.72] -> [0.17, 0.26, 0.39, 0.72, 0.78]", "text": "Counting sort and bucket sort skip comparisons entirely. Counting sort indexes an array of counts by value and walks the counts in order, which suits small non-negative integers. Bucket sort drops floats in [0, 1) into n buckets by int(x * n), so bucket order is value order, then sorts each bucket and concatenates. People size the counts array as max instead of max plus one, or assume a bucket is already sorted. Counting is O(n + k) for max value k; bucket is O(n) on average.", "py": "def counting_sort(nums):\n    \"\"\"Index by value: counts[v] copies of v, emitted in index order. O(n + max).\"\"\"\n    if not nums:\n        return []\n    counts = [0] * (max(nums) + 1)     # values run 0..max inclusive, so max + 1 slots\n    for x in nums:\n        counts[x] += 1\n    out = []\n    for value in range(len(counts)):\n        for _ in range(counts[value]):\n            out.append(value)\n    return out\n\n\ndef bucket_sort(xs):\n    \"\"\"n buckets over [0, 1); int(x * n) grows with x, so bucket order is value order. O(n) avg.\"\"\"\n    n = len(xs)\n    buckets = []\n    for _ in range(n):\n        buckets.append([])\n    for x in xs:\n        buckets[int(x * n)].append(x)\n    out = []\n    for bucket in buckets:\n        out.extend(sorted(bucket))     # a bucket only groups nearby values; it still needs sorting\n    return out\n\n\n# --- try it: change the inputs and run ---\nprint(counting_sort([2, 5, 3, 0, 2, 3, 0, 3]))            # -> [0, 0, 2, 2, 3, 3, 3, 5]\nprint(counting_sort([1, 0]))                              # -> [0, 1]\nprint(bucket_sort([0.78, 0.17, 0.39, 0.26, 0.72]))        # -> [0.17, 0.26, 0.39, 0.72, 0.78]\nprint(bucket_sort([0.94, 0.21, 0.12, 0.23, 0.68, 0.11]))  # -> [0.11, 0.12, 0.21, 0.23, 0.68, 0.94]\n", "pseudo": "counting_sort(nums):\n    if nums is empty: return []\n    counts = [0] * (max(nums) + 1)   (values run 0..max inclusive)\n    for x in nums: counts[x] = counts[x] + 1\n    out = []\n    for value from 0 to len(counts) - 1: append value counts[value] times\n    return out\nbucket_sort(xs):\n    n = len(xs), buckets = n empty lists\n    for x in xs: append x to buckets[int(x * n)]\n    out = []\n    for bucket in buckets: append sorted(bucket)   (a bucket groups nearby values; still sort it)\n    return out"}, {"id": "fund-sorting-06_python_sort_keys_and_stability", "name": "06_python_sort_keys_and_stability", "area": "sorting", "title": "Python Sort Keys and Stability", "key_ops": "tuple key, negate a field to flip it, two stable passes with the minor key first", "statement": "Sort records (name, dept, salary) by dept ascending then salary descending. One pass with the tuple\nkey (dept, -salary) does it. Two passes do it too, minor key FIRST: sort by salary descending, then\nby dept; the second sort is stable, so within a dept the salary order survives. Ties keep order.\nExample: [(\"ann\", \"eng\", 100), (\"bob\", \"ops\", 90), (\"cy\", \"eng\", 120), (\"di\", \"ops\", 90)]\n      -> [(\"cy\", \"eng\", 120), (\"ann\", \"eng\", 100), (\"bob\", \"ops\", 90), (\"di\", \"ops\", 90)]", "text": "Python's sorted takes a key function and is stable, which covers most multi-field sorts. To sort by department ascending then salary descending, use the tuple key (dept, -salary); negating a numeric field flips just that field. The two-pass alternative sorts by the minor key first, then by the major key, and stability keeps the minor order inside each group. The error is doing the passes in the wrong order or sorting the original list instead of the first output. O(n log n) time, O(n) space.", "py": "def dept_then_salary_desc(record):\n    \"\"\"Key for one pass: dept ascending, salary descending (negating flips just that field).\"\"\"\n    name, dept, salary = record\n    return (dept, -salary)\n\n\ndef salary_of(record):\n    return record[2]\n\n\ndef dept_of(record):\n    return record[1]\n\n\ndef sort_one_pass(records):\n    \"\"\"One sort with a tuple key. O(n log n).\"\"\"\n    return sorted(records, key=dept_then_salary_desc)\n\n\ndef sort_two_passes(records):\n    \"\"\"Minor key first (salary desc), then major key (dept): the stable second pass keeps it.\"\"\"\n    by_salary = sorted(records, key=salary_of, reverse=True)\n    return sorted(by_salary, key=dept_of)   # sort the OUTPUT of the first pass, not the original\n\n\n# --- try it: change the inputs and run ---\npeople = [(\"ann\", \"eng\", 100), (\"bob\", \"ops\", 90), (\"cy\", \"eng\", 120), (\"di\", \"ops\", 90),\n          (\"ed\", \"ops\", 130)]\nprint(sort_one_pass(people))\n# -> [('cy', 'eng', 120), ('ann', 'eng', 100), ('ed', 'ops', 130), ('bob', 'ops', 90),\n#     ('di', 'ops', 90)]\nprint(sort_two_passes(people))\n# -> the same list: the two ways agree\nprint(sort_two_passes([(\"a\", \"x\", 1), (\"b\", \"x\", 1)]))   # -> [('a', 'x', 1), ('b', 'x', 1)]  (tie)\nprint(sort_one_pass([(\"a\", \"x\", 1), (\"b\", \"x\", 2)]))     # -> [('b', 'x', 2), ('a', 'x', 1)]\n", "pseudo": "dept_then_salary_desc(record): return (dept, -salary)   (negating flips just that field)\nsalary_of(record): return salary\ndept_of(record): return dept\nsort_one_pass(records):\n    return sorted(records, key = dept_then_salary_desc)\nsort_two_passes(records):\n    by_salary = sorted(records, key = salary_of, descending)\n    return sorted(by_salary, key = dept_of)   (sort the output of the first pass; stable keeps it)"}]}, {"id": "fund-two_pointers", "topic": "two_pointers", "title": "Two Pointers", "intro": "Two indices that move through an array or string in a disciplined way, inward from both ends, or as a reader and a\nwriter, or one per input. This chapter teaches the arguments that let a pointer move without ever needing to look\nback: sorted order, in-place partition invariants, and the shorter-side-loses rule for geometric problems.", "background": [{"title": "What it is", "md": "Start with memory. An array is a row of consecutive cells, each with an index. A pointer here is not a memory address; it is just an integer index into that row. The technique keeps two (occasionally three) such integers and a tiny amount of extra state, and moves the integers according to a rule.\n\n```text\nindex:    0    1    2    3    4    5    6\n        +----+----+----+----+----+----+----+\nnums:   |  1
