<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brute to Optimal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the book's companion. Same paper, same faces: a chapter list on the left, one reading column, and
   per problem exactly two sections (brute force, optimal), each with a runnable Python / pseudocode panel. */
:root{
  --paper:#fbfbf8; --panel:#ffffff; --ink:#1d2024; --ink-soft:#5a6068; --rule:#dcdcd4;
  --accent:#0e6b65; --accent-soft:#e1f0ee;
  --mark:#b5731a; --mark-soft:#f8ecd6;
  --easy:#1d7a4a; --medium:#b07a12; --hard:#b8282f; --ok:#1d7a4a; --err:#b8282f;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Literata",Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --measure:72ch; --fs:17px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#15171a; --panel:#1c1f23; --ink:#e8e6df; --ink-soft:#a0a6ad; --rule:#2e3237;
  --accent:#6fc8c0; --accent-soft:#163331; --mark:#e0a94f; --mark-soft:#3a2d16;
  --easy:#6fd39a; --medium:#e2b655; --hard:#ff7b82; --ok:#6fd39a; --err:#ff7b82; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#15171a; --panel:#1c1f23; --ink:#e8e6df; --ink-soft:#a0a6ad; --rule:#2e3237;
  --accent:#6fc8c0; --accent-soft:#163331; --mark:#e0a94f; --mark-soft:#3a2d16;
  --easy:#6fd39a; --medium:#e2b655; --hard:#ff7b82; --ok:#6fd39a; --err:#ff7b82; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:var(--fs)/1.65 var(--body)}
a{color:var(--accent)}
button{font:14px var(--display);color:inherit;background:none;border:1px solid var(--rule);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent-soft);border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,[tabindex]:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
code,pre,textarea{font-family:var(--mono)}
.eyebrow{font:600 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
.toc{border-right:1px solid var(--rule);background:var(--panel);overflow:auto;display:flex;flex-direction:column}
.toc-head{padding:20px 18px 14px;border-bottom:1px solid var(--rule)}
.toc-head h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.toc-head h1 a{color:inherit;text-decoration:none}
.toc-head .sub{font-size:13px;color:var(--ink-soft);margin-top:4px;font-family:var(--display)}
.toc-head input{width:100%;margin-top:12px;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);font:14px var(--display)}
.pystatus{margin-top:10px;font:12px var(--display);color:var(--ink-soft);display:flex;gap:6px;align-items:center}
.pystatus .d{width:8px;height:8px;border-radius:50%;background:var(--rule);flex:none}
.pystatus.ready .d{background:var(--ok)}.pystatus.fail .d{background:var(--err)}.pystatus.loading .d{background:var(--mark)}
.toc nav{padding:8px 8px 20px;font-family:var(--display)}
.toc .ch{margin:4px 0}
.toc .ch>button{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;padding:8px 10px;border-radius:6px;text-align:left;font-weight:700;font-size:14px}
.toc .ch>button:hover{background:var(--accent-soft)}
.toc .ch.open>button,.toc .ch.cur>button{color:var(--accent)}
.toc .ch .n{font:600 12px var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.toc .secs{display:none;flex-direction:column;padding:2px 0 6px 10px;border-left:2px solid var(--rule);margin-left:14px}
.toc .ch.open .secs{display:flex}
.toc .secs a{display:flex;gap:8px;align-items:baseline;text-decoration:none;color:var(--ink);font-size:13.5px;padding:5px 8px;border-radius:5px}
.toc .secs a:hover{background:var(--accent-soft)}
.toc .secs a.on{color:var(--accent);font-weight:700}
.toc .secs a .d{width:7px;height:7px;border-radius:50%;flex:none;background:var(--rule)}
.toc .secs a .d.Easy{background:var(--easy)}.toc .secs a .d.Medium{background:var(--medium)}.toc .secs a .d.Hard{background:var(--hard)}
.toc .secs a.done .d{box-shadow:0 0 0 2px var(--accent)}
.toc .secs a.done{text-decoration:line-through;text-decoration-color:var(--rule)}
.toc .secs a.bg{font-style:italic}
.toctoggle{display:none;margin-top:10px}

.main{min-width:0;overflow:auto;padding-block:28px 72px;padding-inline:clamp(16px,5vw,64px)}
.page{max-width:none;margin:0}
.pagehead{margin-bottom:22px}
.pagehead .crumbs{font-family:var(--display);font-size:13px;color:var(--ink-soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pagehead .crumbs a{text-decoration:none}
.pagehead h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.015em;margin:8px 0 10px}
.pagehead .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-family:var(--display);font-size:14px;color:var(--ink-soft)}
.pill{display:inline-block;font:600 11px/1 var(--display);letter-spacing:.04em;padding:4px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.Easy{color:var(--easy)}.pill.Medium{color:var(--medium)}.pill.Hard{color:var(--hard)}
.donebox{display:flex;gap:8px;align-items:center;font:14px var(--display);cursor:pointer;margin-left:auto}
.donebox input{width:16px;height:16px;accent-color:var(--accent)}

.prose>*{max-width:none}
.prose h2{font-size:24px;margin:40px 0 12px;padding-top:14px;border-top:1px solid var(--rule)}
.prose h2:first-of-type{border-top:0;padding-top:0;margin-top:26px}
.prose h3{font-size:19px;margin:26px 0 8px}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{padding-left:24px;margin:0 0 14px}.prose li{margin:4px 0}
.prose table{border-collapse:collapse;font-family:var(--display);font-size:14.5px;margin:0 0 16px;display:block;overflow-x:auto;max-width:100%}
.prose th,.prose td{border:1px solid var(--rule);padding:6px 10px;text-align:left;vertical-align:top}
.prose th{background:var(--accent-soft)}
.prose pre{margin:0 0 16px;padding:14px 16px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;overflow-x:auto;font-size:13.5px;line-height:1.45}
.prose pre.drawing{background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:16px 16px;background-position:-1px -1px}
.prose code:not(pre code){background:var(--accent-soft);padding:1px 5px;border-radius:4px;font-size:.9em}
.prose blockquote{margin:0 0 14px;padding:10px 16px;border-left:4px solid var(--mark);background:var(--mark-soft);border-radius:0 8px 8px 0}
.prose blockquote p:last-child{margin:0}

.statement{margin:6px 0 8px;padding:16px 18px;background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:0 8px 8px 0;font-size:.97em}
.statement .eyebrow{margin-bottom:8px;color:var(--accent)}
.statement p{margin:0 0 8px}.statement p:last-child{margin:0}
.statement pre{margin:8px 0 0;padding:10px 12px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;overflow-x:auto;font-size:13px;line-height:1.45;white-space:pre-wrap}
.cost{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-family:var(--display);font-size:13.5px;color:var(--ink-soft);margin:0 0 14px}
.cost code{background:var(--accent-soft);padding:2px 7px;border-radius:4px;font-size:13px;color:var(--ink)}
.idea{margin:0 0 14px;padding:10px 16px;border-left:4px solid var(--mark);background:var(--mark-soft);border-radius:0 8px 8px 0}
.idea .eyebrow{color:var(--mark);margin-bottom:4px}

/* code panel: pseudocode and Python side by side, output under the Python column */
.panel{margin:4px 0 8px;border:1px solid var(--rule);border-radius:8px;background:var(--panel);overflow:hidden}
.panel .bar{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.panel .acts{margin-left:auto;display:flex;gap:6px;align-items:center}
.panel .acts .run{background:var(--accent);color:var(--paper);border-color:var(--accent);font-weight:700}
.panel .acts .run:hover{filter:brightness(1.1)}
.panel .hint{font:12px var(--display);color:var(--ink-soft)}
.panel .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.panel.one .cols{grid-template-columns:minmax(0,1fr)}
.panel .col{min-width:0;display:flex;flex-direction:column}
.panel .col + .col{border-left:1px solid var(--rule)}
.panel .colhead{font:600 11px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:10px 16px 0}
.editor{display:grid;overflow-x:auto;min-height:60px}
.editor pre,.editor textarea{grid-area:1/1;margin:0;padding:14px 16px;font-size:13.5px;line-height:1.5;tab-size:4;white-space:pre;overflow:hidden;border:0;border-radius:0;min-width:max-content}
.editor pre{background:var(--panel);pointer-events:none}
.editor pre code{background:none;padding:0;font-size:inherit;white-space:pre}
.editor textarea{width:100%;height:100%;background:transparent;color:transparent;caret-color:var(--ink);resize:none;outline:none;display:block}
.editor textarea::selection{background:var(--accent-soft)}
.editor.plain textarea{color:var(--ink)}
.panel .pseudo{margin:0;padding:14px 16px;font-size:13.5px;line-height:1.6;white-space:pre;overflow-x:auto;background:var(--panel);flex:1}
.panel .out{margin:0;padding:12px 16px;border-top:1px solid var(--rule);background:var(--paper);font-size:13px;line-height:1.5;white-space:pre-wrap;max-height:260px;overflow:auto}
.panel .out.err{color:var(--err)}
.panel .out:empty{display:none}
.hljs-keyword,.hljs-built_in{color:var(--accent);font-weight:600}
.hljs-string{color:var(--mark)}.hljs-number{color:var(--hard)}
.hljs-comment{color:var(--ink-soft);font-style:italic}
.hljs-title{font-weight:600}

.pager{display:flex;justify-content:space-between;gap:16px;margin:48px 0 0;padding-top:18px;border-top:1px solid var(--rule);font-family:var(--display);flex-wrap:wrap}
.pager a{text-decoration:none;max-width:48%;display:flex;flex-direction:column;gap:2px}
.pager a span:first-child{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.pager a.next{text-align:right;margin-left:auto}

/* chapter page */
.overview{display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:8px;background:var(--panel);overflow:hidden;font-family:var(--display)}
.overview a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--rule);text-decoration:none;color:inherit}
.overview a:last-child{border-bottom:0}
.overview a:hover{background:var(--accent-soft)}
.overview .k{font:600 13px var(--mono);color:var(--ink-soft);font-variant-numeric:tabular-nums;padding-top:3px}
.overview .t{font-weight:700}
.overview .w{font-size:13.5px;color:var(--ink-soft);margin-top:2px;font-family:var(--body)}
.basics details{border:1px solid var(--rule);border-radius:8px;background:var(--panel);margin:0 0 10px}
.basics summary{cursor:pointer;padding:10px 14px;font-family:var(--display);font-weight:700;list-style:none;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.basics summary::-webkit-details-marker{display:none}
.basics summary .ops{font-weight:400;font-size:13px;color:var(--ink-soft)}
.basics .body{padding:0 14px 14px}
.basics .body p{font-size:15px;margin:0 0 10px}
.basics .panel{margin:0}
.bgsec summary{cursor:pointer;font:700 19px var(--display);padding:8px 0;list-style:none}
.bgsec summary::-webkit-details-marker{display:none}
.bgsec summary::before{content:"▸ ";color:var(--ink-soft);font-size:.8em}
.bgsec[open] summary::before{content:"▾ "}
.bgsec{border-top:1px solid var(--rule)}

/* home */
.home h1{font-size:clamp(34px,5vw,54px);letter-spacing:-.02em;margin:0 0 12px}
.lede{font-size:19px;margin:0 0 26px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.chapters a{text-decoration:none;color:inherit;border:1px solid var(--rule);border-radius:8px;background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.chapters a:hover{border-color:var(--accent)}
.chapters h3{font-size:17px}
.chapters .s{font-size:14px;color:var(--ink-soft);font-family:var(--display)}
.chapters .bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden}.chapters .bar>div{height:100%;background:var(--accent)}

@media (max-width:1000px){ .panel .cols{grid-template-columns:minmax(0,1fr)} .panel .col + .col{border-left:0;border-top:1px solid var(--rule)} }
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .toc{border-right:0;border-bottom:1px solid var(--rule);max-height:55vh}
  .toc nav{display:none}.toc.open nav{display:block}
  .toctoggle{display:inline-block}
  .main{padding-inline:16px}
  .pager a{max-width:100%}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<div class="app">

    <div class="toc-head">
      <h1><a href="#home">Brute to Optimal</a></h1>
      <div class="sub" id="subtitle"></div>
      <input id="search" type="search" placeholder="Find a problem" aria-label="Find a problem" autocomplete="off">
      <div class="pystatus" id="pystatus"><span class="d"></span><span id="pytext">Python runtime loads when you open a problem</span></div>
      <button class="toctoggle" id="toctoggle" type="button">Contents</button>
    </div>
    <nav id="nav"></nav>
  </aside>
  <main class="main" id="main"><div class="page" id="page"></div></main>
</div>

<script id="data" type="application/json">{"chapters": [{"topic": "arrays_hashing", "title": "Arrays and Hashing", "intro": "Arrays are contiguous memory with O(1) indexing but O(n) search by value; hash maps and sets add O(1) average lookup\nby value. This chapter teaches you to answer questions about the past of a scan in constant time: which values you\nhave seen, where, how often, and what they add up to. It ends with the tools for counting by value order, merge-sort\ncounting and Fenwick trees.", "problems": ["two_sum", "majority_element", "valid_sudoku", "group_anagrams", "top_k_frequent_elements", "product_of_array_except_self", "longest_consecutive_sequence", "subarray_sum_equals_k"]}, {"topic": "two_pointers", "title": "Two Pointers", "intro": "Two indices that move through an array or string in a disciplined way, inward from both ends, or as a reader and a\nwriter, or one per input. This chapter teaches the arguments that let a pointer move without ever needing to look\nback: sorted order, in-place partition invariants, and the shorter-side-loses rule for geometric problems.", "problems": ["valid_palindrome", "move_zeroes", "sort_colors", "two_sum_ii_input_array_is_sorted", "three_sum", "container_with_most_water"]}, {"topic": "sliding_window", "title": "Sliding Window", "intro": "A window is a contiguous slice of a sequence described by two indices that only move forward. This chapter teaches how\nto grow and shrink that slice while maintaining a summary of its contents, so that questions about the longest,\nshortest, or every qualifying stretch run in linear time, and when the summary needs a monotonic deque or two heaps\ninstead of a counter.", "problems": ["best_time_to_buy_and_sell_stock", "minimum_size_subarray_sum", "longest_substring_without_repeating_characters", "max_consecutive_ones_iii", "longest_repeating_character_replacement"]}, {"topic": "stack", "title": "Stacks", "intro": "A stack is a pile that gives back the most recently added item first. This chapter teaches the three jobs it does in\ninterviews: matching openers with closers, evaluating expressions whose right-hand side has not arrived yet, and the\nmonotonic stack, where each element waits for the first later element that beats it.", "problems": ["valid_parentheses", "min_stack", "evaluate_reverse_polish_notation", "decode_string", "basic_calculator_ii", "daily_temperatures", "car_fleet"]}, {"topic": "queues", "title": "Queues and Deques", "intro": "A queue serves the item that has waited longest; a deque lets you add and remove at both ends. This chapter teaches\nwhat first-in-first-out really promises, how to build one discipline from the other with an amortised argument, how to\nkeep a queue in a fixed ring of slots, and how a queue models time windows and turn order.", "problems": ["implement_queue_using_stacks", "design_circular_queue", "dota2_senate"]}, {"topic": "binary_search", "title": "Binary Search", "intro": "Binary search finds the position where a yes/no answer flips, in logarithmic time, whenever every yes comes before\nevery no. This chapter teaches the one loop that never goes off by one, then applies it to exact lookups, boundaries,\nrotated and mountain arrays, and finally to searching the answer space itself when the input is not sorted at all.", "problems": ["binary_search", "search_insert_position", "find_first_and_last_position", "search_2d_matrix", "find_min_rotated_sorted_array", "search_rotated_sorted_array", "koko_eating_bananas"]}, {"topic": "linked_list", "title": "Linked Lists", "intro": "A linked list is a chain of nodes where each node knows only the next one. This chapter teaches how to rewire, measure\nand reshape that chain in one pass with constant extra memory: dummy heads, the three-pointer reversal, two runners at\na fixed gap, and the fast and slow runners that detect and locate a cycle.", "problems": ["reverse_linked_list", "merge_two_sorted_lists", "add_two_numbers", "remove_nth_from_end", "linked_list_cycle_ii", "intersection_of_two_linked_lists", "palindrome_linked_list", "copy_list_with_random_pointer"]}, {"topic": "trees", "title": "Trees", "intro": "A tree is a node with children, and the moment a node has two, loops give way to recursion. This chapter teaches how\nto write a function for a node by trusting it on the children: returning one value up, carrying state down, walking\ntwo trees in lockstep, sweeping by level with a queue, and exploiting the sorted order of a binary search tree.", "problems": ["maximum_depth_of_binary_tree", "invert_binary_tree", "symmetric_tree", "balanced_binary_tree", "diameter_of_binary_tree", "path_sum_ii", "binary_tree_level_order_traversal", "binary_tree_inorder_traversal", "validate_binary_search_tree", "kth_smallest_element_in_a_bst", "lowest_common_ancestor_of_a_bst", "lowest_common_ancestor_of_a_binary_tree", "construct_binary_tree_from_preorder_and_inorder_traversal"]}, {"topic": "tries", "title": "Tries", "intro": "A trie stores a set of strings as a tree of characters, so every shared prefix is one shared path. This chapter\nteaches prefix lookups, wildcard matching down a forking walk, using a trie to prune a backtracking search, rewriting\nsuffix questions as prefix questions, and storing payloads in nodes so that reaching a node is the answer.", "problems": ["implement_trie_prefix_tree", "design_add_and_search_words_data_structure"]}, {"topic": "heap", "title": "Heaps and Priority Queues", "intro": "A heap keeps a collection where the smallest (or largest) item is always available in O(log n) per change. This\nchapter teaches the patterns that need exactly that: keeping the k best, scheduling by count, merging k sorted\nstreams, two heaps that hold a running median, unlock-then-pick sweeps, and shortest paths with Dijkstra's algorithm.", "problems": ["kth_largest_element_in_a_stream", "kth_largest_element_in_an_array", "k_closest_points_to_origin", "task_scheduler", "reorganize_string"]}, {"topic": "backtracking", "title": "Backtracking", "intro": "Backtracking enumerates configurations by making a choice, recursing, and undoing the choice. This chapter teaches the\none skeleton behind subsets, permutations, combinations, constrained strings, grid paths, piece placement and puzzle\nsolving: name the choice, the constraint that prunes, and the undo.", "problems": ["subsets", "permutations", "combination_sum", "combination_sum_ii", "generate_parentheses", "word_search"]}, {"topic": "graphs", "title": "Graphs", "intro": "A graph is a set of nodes and the edges that connect them, explicit as an adjacency list or implicit in a grid, a word\nlist or a board state. This chapter teaches depth-first and breadth-first traversal, multi-source and state-augmented\nBFS, topological order, union-find, shortest paths with Dijkstra and its 0-1 and bidirectional variants, minimum\nspanning trees, and bridges.", "problems": ["flood_fill", "number_of_islands", "rotting_oranges", "pacific_atlantic_water_flow", "clone_graph", "course_schedule", "number_of_connected_components", "redundant_connection", "network_delay_time", "min_cost_to_connect_all_points"]}, {"topic": "intervals", "title": "Intervals and Sweep Lines", "intro": "An interval is a start and an end on a line. This chapter teaches how sorting by start or by end makes merging,\nchoosing and counting overlapping intervals a single sweep, and how a sweep line that walks several sorted streams at\nonce answers questions about free time, query coverage and the area of a union of rectangles.", "problems": ["merge_intervals", "insert_interval", "non_overlapping_intervals", "meeting_rooms_ii"]}, {"topic": "greedy", "title": "Greedy", "intro": "A greedy algorithm commits to the locally best choice at each step and never revisits it. This chapter teaches which\ngreedy rules survive and how to argue why: running-state carries, reach and frontier arguments, intervals swept in\norder, constraints satisfied from both sides, and exchange arguments where any other plan can be rewritten into the\ngreedy one without getting worse.", "problems": ["maximum_subarray", "jump_game", "jump_game_ii", "gas_station", "partition_labels"]}, {"topic": "bit_manipulation", "title": "Bit Manipulation", "intro": "An integer is a row of 32 switches, and the and, or, xor and shift operators act on all of them at once. This chapter\nteaches counting and moving bits without strings, cancellation with xor, reading low bits to make greedy decisions,\nbitmasks as small sets, and a binary trie that walks a number bit by bit to maximise an xor.", "problems": ["number_of_1_bits", "counting_bits", "reverse_bits", "single_number", "missing_number"]}, {"topic": "math_geometry", "title": "Math and Geometry", "intro": "These problems are solved by noticing a structure that is already in the data: a grid as a coordinate system, numbers\nas blocks counted by digit position, experiments as digits of a mixed-radix number, and points on an integer grid.\nThis chapter teaches the formulas and the one rule of exact geometry: never let a float near a decision.", "problems": ["rotate_image", "spiral_matrix", "set_matrix_zeroes"]}, {"topic": "strings", "title": "Strings: Scanning, Parsing, Canonical Forms", "intro": "String problems are about walking a sequence once while remembering the right small thing. This chapter teaches\ncutting and reassembling pieces, canonical forms that make equal things compare equal, parsing with a phase or a few\nflags, matching with a stack, and the self-similarity tools: expanding palindromes, the KMP failure function, and\nrolling hashes.", "problems": ["valid_anagram", "string_to_integer_atoi", "simplify_path", "minimum_remove_to_make_valid_parentheses", "longest_palindromic_substring"]}, {"topic": "design", "title": "Design: Implement a Tracker", "intro": "Design problems hand you an API and ask every call to be fast in any order. This chapter teaches the habit of starting\nfrom the operations, asking what each one must know, and choosing the cheapest structure that knows it: windows over a\nstream, keyed state, two structures kept in sync, versioned state, lazy work, ordered sets of ranges, and building a\ntree or skip list from nodes.", "problems": ["moving_average_from_data_stream", "logger_rate_limiter", "design_hashmap", "insert_delete_getrandom_o1", "time_based_key_value_store", "lru_cache"]}], "problems": {"two_sum": {"slug": "two_sum", "topic": "arrays_hashing", "title": "Two Sum", "leetcode": 1, "difficulty": "Easy", "pattern": "Hash map complement lookup", "statement": "Given an integer array nums and an integer target, return the indices of the two\nnumbers that add up to target. Exactly one answer exists and you may not use the\nsame element twice.\nExample: nums = [2, 7, 11, 15], target = 9 -> [0, 1] because 2 + 7 = 9.", "why_here": "The template for the chapter: a dict of what you have seen, queried with a complement, check before insert.", "lc_slug": "two-sum", "brute": {"text": "For every index i, scan every j > i and test nums[i] + nums[j] == target. The inner scan is the waste: for a fixed nums[i] we already know the single value we want (target - nums[i]), yet we re-read the whole suffix to look for it.", "time": "O(n^2)", "space": "O(1)", "py": "def brute_force(nums, target):\n    \"\"\"Try every pair i < j. O(n^2) time, O(1) space.\"\"\"\n    n = len(nums)\n    for i in range(n):\n        for j in range(i + 1, n):\n            if nums[i] + nums[j] == target:\n                return [i, j]\n    return []\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force([2, 7, 11, 15], 9))        # -> [0, 1]\nprint(brute_force([3, 2, 4], 6))             # -> [1, 2]\nprint(brute_force([3, 3], 6))                # -> [0, 1]\nprint(brute_force([-1, -2, -3, -4, -5], -8))  # -> [2, 4]\n", "pseudo": "for each index i:\n    for each index j after i:\n        if nums[i] + nums[j] == target:\n            return [i, j]\nreturn []"}, "opt": {"text": "The inner loop is really a membership question: is target - nums[i] somewhere in the array, and at which index? Membership plus lookup-by-value is exactly what a hash map does in O(1), so replace the scan with a dict from value to index. Build the dict lazily, checking for the complement before inserting the current element, which both respects the no-reuse rule and avoids a second pass. Any valid pair (i, j) with i < j is caught when we reach j, because nums[i] was inserted earlier.", "time": "O(n)", "space": "O(n)", "py": "def two_sum(nums, target):\n    \"\"\"Remember each value's index; look up the complement. O(n) time, O(n) space.\"\"\"\n    seen = {}  # value -> index where we saw it\n    for i in range(len(nums)):\n        need = target - nums[i]\n        if need in seen:\n            return [seen[need], i]\n        seen[nums[i]] = i  # insert after the lookup so an element never pairs with itself\n    return []\n\n\n# --- try it: change the inputs and run ---\nprint(two_sum([2, 7, 11, 15], 9))        # -> [0, 1]\nprint(two_sum([3, 2, 4], 6))             # -> [1, 2]\nprint(two_sum([3, 3], 6))                # -> [0, 1]\nprint(two_sum([-1, -2, -3, -4, -5], -8))  # -> [2, 4]\n", "pseudo": "seen = empty dict value -> index\nfor each index i:\n    need = target - nums[i]\n    if need is in seen:\n        return [seen[need], i]\n    seen[nums[i]] = i   (insert after the lookup so an element never pairs with itself)\nreturn []"}}, "majority_element": {"slug": "majority_element", "topic": "arrays_hashing", "title": "Majority Element", "leetcode": 169, "difficulty": "Easy", "pattern": "Boyer-Moore voting", "statement": "Given an array of size n, return the element that appears more than n / 2 times.\nA majority element always exists. Follow-up: O(n) time and O(1) space.\nExample: nums = [2, 2, 1, 1, 1, 2, 2] -> 2.", "why_here": "Shows the memory can shrink to a candidate and a counter when the question only needs a summary.", "lc_slug": "majority-element", "brute": {"text": "For each element, count its occurrences with a full scan and return it when the count exceeds n / 2. The re-counting is the waste: the same value is counted from scratch every time it reappears, and candidates that could never win are counted too. A Counter dict reduces time to O(n) but uses O(n) space.", "time": "O(n^2)", "space": "O(1)", "py": "def brute_force(nums):\n    \"\"\"Count every value from scratch with a full scan. O(n^2) time, O(1) space.\"\"\"\n    n = len(nums)\n    for value in nums:\n        occurrences = 0\n        for other in nums:\n            if other == value:\n                occurrences += 1\n        if occurrences > n // 2:\n            return value\n    return -1\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force([3, 2, 3]))                 # -> 3\nprint(brute_force([2, 2, 1, 1, 1, 2, 2]))     # -> 2\nprint(brute_force([1]))                       # -> 1\nprint(brute_force([5, 1, 5, 1, 5]))           # -> 5\n", "pseudo": "for each value in nums:\n    occurrences = 0\n    for each other in nums:\n        if other == value: occurrences += 1\n    if occurrences > n / 2:\n        return value\nreturn -1"}, "opt": {"text": "We do not need the exact count of every value, only the identity of the one value in strict majority. If you pair each majority element with a distinct non-majority element and cancel both, the majority still has leftovers because it holds more than half. Boyer-Moore implements this cancellation in one pass with two variables, a candidate and a count: matching elements increment the count, non-matching ones decrement it (cancelling against the candidate), and when the count reaches zero the next element becomes the new candidate. The majority survives every cancellation, so whatever is the candidate at the end is the answer.", "time": "O(n)", "space": "O(1)", "py": "def majority_element(nums):\n    \"\"\"Boyer-Moore voting: cancel pairs of different values. O(n) time, O(1) space.\"\"\"\n    candidate = nums[0]\n    count = 0\n    for value in nums:\n        if count == 0:\n            candidate = value  # the previous candidate was fully cancelled out\n        if value == candidate:\n            count += 1\n        else:\n            count -= 1\n    return candidate\n\n\n# --- try it: change the inputs and run ---\nprint(majority_element([3, 2, 3]))             # -> 3\nprint(majority_element([2, 2, 1, 1, 1, 2, 2]))  # -> 2\nprint(majority_element([1]))                   # -> 1\nprint(majority_element([5, 1, 5, 1, 5]))       # -> 5\n", "pseudo": "candidate = nums[0], count = 0\nfor each value in nums:\n    if count == 0:\n        candidate = value   (the previous candidate was fully cancelled out)\n    if value == candidate: count += 1\n    else: count -= 1\nreturn candidate"}}, "valid_sudoku": {"slug": "valid_sudoku", "topic": "arrays_hashing", "title": "Valid Sudoku", "leetcode": 36, "difficulty": "Medium", "pattern": "Hash set per row/column/box", "statement": "Given a 9x9 board with digits '1'-'9' and '.' for empty cells, decide whether the\nfilled cells are valid: no digit repeats in any row, any column, or any of the nine\n3x3 boxes. Solvability is not required.\nExample: a board whose first column holds two '8's -> False.", "why_here": "Back to sets, now 27 of them at once, with arithmetic that routes each cell to its sets.", "lc_slug": "valid-sudoku", "brute": {"text": "For each of the 81 cells, scan its entire row, its entire column and its 3x3 box looking for the same digit elsewhere. Each row is re-scanned by all nine of its cells (likewise columns and boxes), so every pair of cells in a unit is compared twice and every unit is read nine times instead of once.", "time": "O(81 * 27) = O(1)", "space": "O(1)", "py": "def build_board(rows):\n    \"\"\"Turn 9 strings like '53..7....' into a 9x9 list of single characters.\"\"\"\n    board = []\n    for row in rows:\n        board.append(list(row))\n    return board\n\n\ndef brute_force(board):\n    \"\"\"For each filled cell, scan its row, column and box. O(81 * 27) steps, O(1) space.\"\"\"\n    for row in range(9):\n        for col in range(9):\n            digit = board[row][col]\n            if digit == \".\":\n                continue\n            for k in range(9):\n                if k != col and board[row][k] == digit:  # same digit elsewhere in the row\n                    return False\n                if k != row and board[k][col] == digit:  # same digit elsewhere in the column\n                    return False\n            box_row = 3 * (row // 3)  # top-left corner of this cell's 3x3 box\n            box_col = 3 * (col // 3)\n            for i in range(box_row, box_row + 3):\n                for j in range(box_col, box_col + 3):\n                    if (i != row or j != col) and board[i][j] == digit:\n                        return False\n    return True\n\n\n# --- try it: change the inputs and run ---\nvalid = build_board([\"53..7....\", \"6..195...\", \".98....6.\", \"8...6...3\", \"4..8.3..1\",\n                     \"7...2...6\", \".6....28.\", \"...419..5\", \"....8..79\"])\nbad_column = build_board([\"83..7....\", \"6..195...\", \".98....6.\", \"8...6...3\", \"4..8.3..1\",\n                          \"7...2...6\", \".6....28.\", \"...419..5\", \"....8..79\"])\nbad_box = build_board([\"53..7....\", \"6..195...\", \".95....6.\", \"8...6...3\", \"4..8.3..1\",\n                       \"7...2...6\", \".6....28.\", \"...419..5\", \"....8..79\"])\nprint(brute_force(valid))       # -> True\nprint(brute_force(bad_column))  # -> False  (two 8s in column 0)\nprint(brute_force(bad_box))     # -> False  (two 5s in the top-left box)\n", "pseudo": "for each cell (row, col) on the board:\n    digit = board[row][col]\n    if digit is '.': skip\n    for each k from 0 to 8:\n        if k != col and board[row][k] == digit: return False   (same row)\n        if k != row and board[k][col] == digit: return False   (same column)\n    (box_row, box_col) = top-left corner of the 3x3 box holding (row, col)\n    for each cell (i, j) in that box:\n        if (i, j) != (row, col) and board[i][j] == digit: return False\nreturn True"}, "opt": {"text": "The brute force asks 'does this digit appear elsewhere in my row?' by scanning; that is a membership question, which a set answers in O(1). Give each row, each column and each box its own set so one pass over the board performs all 27 checks at once: for each filled cell, test-and-insert its digit into the three sets it belongs to, and a repeat is detected the moment the second copy arrives. The only non-obvious piece is addressing the box: (r // 3) * 3 + c // 3 identifies which of the 9 boxes a cell is in.", "time": "O(1)", "space": "O(1)", "py": "def build_board(rows):\n    \"\"\"Turn 9 strings like '53..7....' into a 9x9 list of single characters.\"\"\"\n    board = []\n    for row in rows:\n        board.append(list(row))\n    return board\n\n\ndef valid_sudoku(board):\n    \"\"\"One set per row, column and box; one sweep. O(81) steps, O(81) space.\"\"\"\n    rows = []\n    cols = []\n    boxes = []\n    for _ in range(9):\n        rows.append(set())\n        cols.append(set())\n        boxes.append(set())\n    for row in range(9):\n        for col in range(9):\n            digit = board[row][col]\n            if digit == \".\":\n                continue\n            box = (row // 3) * 3 + col // 3  # which of the nine 3x3 boxes, numbered 0..8\n            if digit in rows[row] or digit in cols[col] or digit in boxes[box]:\n                return False\n            rows[row].add(digit)\n            cols[col].add(digit)\n            boxes[box].add(digit)\n    return True\n\n\n# --- try it: change the inputs and run ---\nvalid = build_board([\"53..7....\", \"6..195...\", \".98....6.\", \"8...6...3\", \"4..8.3..1\",\n                     \"7...2...6\", \".6....28.\", \"...419..5\", \"....8..79\"])\nbad_column = build_board([\"83..7....\", \"6..195...\", \".98....6.\", \"8...6...3\", \"4..8.3..1\",\n                          \"7...2...6\", \".6....28.\", \"...419..5\", \"....8..79\"])\nbad_box = build_board([\"53..7....\", \"6..195...\", \".95....6.\", \"8...6...3\", \"4..8.3..1\",\n                       \"7...2...6\", \".6....28.\", \"...419..5\", \"....8..79\"])\nprint(valid_sudoku(valid))       # -> True\nprint(valid_sudoku(bad_column))  # -> False  (two 8s in column 0)\nprint(valid_sudoku(bad_box))     # -> False  (two 5s in the top-left box)\n", "pseudo": "rows, cols, boxes = 9 empty sets each\nfor each cell (row, col) on the board:\n    digit = board[row][col]\n    if digit is '.': skip\n    box = (row // 3) * 3 + col // 3   (which of the nine 3x3 boxes, numbered 0..8)\n    if digit is in rows[row] or in cols[col] or in boxes[box]:\n        return False\n    add digit to rows[row], cols[col] and boxes[box]\nreturn True"}}, "group_anagrams": {"slug": "group_anagrams", "topic": "arrays_hashing", "title": "Group Anagrams", "leetcode": 49, "difficulty": "Medium", "pattern": "Canonical key bucketing", "statement": "Given a list of lowercase strings, group the anagrams together in any order. Two\nstrings are anagrams if they contain the same letters with the same counts.\nExample: [\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"]\n      -> [[\"eat\", \"tea\", \"ate\"], [\"tan\", \"nat\"], [\"bat\"]].", "why_here": "The dict key stops being the item itself: design a canonical key so equal keys mean the same group.", "lc_slug": "group-anagrams", "brute": {"text": "Keep a list of groups. For each word, compare it against the representative of every existing group with an anagram test (sort both strings). The pairwise test is the waste: a word is compared against every group even though the answer depends only on the word's own letter multiset, which never changes.", "time": "O(n^2 * k log k)", "space": "O(n * k)", "py": "def tidy(groups):\n    \"\"\"Sort inside each group and then sort the groups, so any valid answer prints the same.\"\"\"\n    tidied = []\n    for group in groups:\n        tidied.append(sorted(group))\n    return sorted(tidied)\n\n\ndef brute_force(strs):\n    \"\"\"Compare each word with one member of every group. O(n^2 * k log k) time.\"\"\"\n    groups = []\n    for word in strs:\n        placed = False\n        for group in groups:\n            if sorted(group[0]) == sorted(word):  # anagram test: same letters once sorted\n                group.append(word)\n                placed = True\n                break\n        if not placed:\n            groups.append([word])\n    return groups\n\n\n# --- try it: change the inputs and run ---\nprint(tidy(brute_force([\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"])))\n# -> [['ate', 'eat', 'tea'], ['bat'], ['nat', 'tan']]\nprint(tidy(brute_force([\"\"])))                  # -> [['']]\nprint(tidy(brute_force([\"a\"])))                 # -> [['a']]\nprint(tidy(brute_force([\"ab\", \"ba\", \"abc\"])))   # -> [['ab', 'ba'], ['abc']]\n", "pseudo": "groups = empty list\nfor each word in strs:\n    placed = False\n    for each group in groups:\n        if sorted letters of group's first word == sorted letters of word:\n            add word to group, placed = True, break\n    if not placed:\n        start a new group [word]\nreturn groups"}, "opt": {"text": "Pairwise comparison is redundant because 'is an anagram of' is an equivalence relation: compute a canonical form of each word once and let equal canonical forms meet in the same bucket. A hash map keyed by the canonical form turns n^2 comparisons into n insertions. The sorted string works as a key in O(k log k); for lowercase letters a tuple of 26 counts is an O(k) key and is the true optimum.", "time": "O(n * k)", "space": "O(n * k)", "py": "def tidy(groups):\n    \"\"\"Sort inside each group and then sort the groups, so any valid answer prints the same.\"\"\"\n    tidied = []\n    for group in groups:\n        tidied.append(sorted(group))\n    return sorted(tidied)\n\n\ndef group_anagrams(strs):\n    \"\"\"Bucket words by their letter-count signature. O(n * k) time, O(n * k) space.\"\"\"\n    buckets = {}  # 26-count signature -> list of words with that signature\n    for word in strs:\n        counts = [0] * 26\n        for ch in word:\n            counts[ord(ch) - ord(\"a\")] += 1\n        key = tuple(counts)  # a tuple can be a dict key, a list cannot\n        if key not in buckets:\n            buckets[key] = []\n        buckets[key].append(word)\n    return list(buckets.values())\n\n\n# --- try it: change the inputs and run ---\nprint(tidy(group_anagrams([\"eat\", \"tea\", \"tan\", \"ate\", \"nat\", \"bat\"])))\n# -> [['ate', 'eat', 'tea'], ['bat'], ['nat', 'tan']]\nprint(tidy(group_anagrams([\"\"])))                  # -> [['']]\nprint(tidy(group_anagrams([\"a\"])))                 # -> [['a']]\nprint(tidy(group_anagrams([\"ab\", \"ba\", \"abc\"])))   # -> [['ab', 'ba'], ['abc']]\n", "pseudo": "buckets = empty dict letter-count signature -> list of words\nfor each word in strs:\n    counts = 26 zeros\n    for each letter ch in word:\n        counts[position of ch in the alphabet] += 1\n    key = counts as a tuple   (anagrams share the exact same histogram)\n    if key not in buckets: buckets[key] = empty list\n    append word to buckets[key]\nreturn the lists in buckets"}}, "top_k_frequent_elements": {"slug": "top_k_frequent_elements", "topic": "arrays_hashing", "title": "Top K Frequent Elements", "leetcode": 347, "difficulty": "Medium", "pattern": "Frequency count + bucket sort", "statement": "Given an integer array nums and an integer k, return the k most frequent elements in\nany order; the answer is guaranteed to be unique.\nExample: nums = [1, 1, 1, 2, 2, 3], k = 2 -> [1, 2].", "why_here": "Count with a dict, then use the counts themselves as array indices: bucket sort instead of comparison sort.", "lc_slug": "top-k-frequent-elements", "brute": {"text": "Count frequencies with a dict, sort the distinct values by frequency descending, and take the first k. The full sort is the waste: we only need the top k, yet sorting totally orders every distinct value including the ones we discard.", "time": "O(n log n)", "space": "O(n)", "py": "def count_values(nums):\n    \"\"\"Return a dict value -> how many times it appears.\"\"\"\n    freq = {}\n    for value in nums:\n        freq[value] = freq.get(value, 0) + 1\n    return freq\n\n\ndef brute_force(nums, k):\n    \"\"\"Count, then sort every distinct value by frequency. O(n log n) time, O(n) space.\"\"\"\n    freq = count_values(nums)\n    pairs = []\n    for value in freq:\n        pairs.append((freq[value], value))\n    pairs.sort(reverse=True)  # highest frequency first\n    result = []\n    for i in range(k):\n        result.append(pairs[i][1])\n    return result\n\n\n# --- try it: change the inputs and run ---\nprint(sorted(brute_force([1, 1, 1, 2, 2, 3], 2)))            # -> [1, 2]\nprint(sorted(brute_force([1], 1)))                           # -> [1]\nprint(sorted(brute_force([4, 4, 4, 5, 5, 6, 6, 6, 6], 2)))   # -> [4, 6]\nprint(sorted(brute_force([7, 7, 7, 7], 1)))                  # -> [7]\n", "pseudo": "freq = count of each value in nums\npairs = empty list\nfor each value in freq:\n    append (freq[value], value) to pairs\nsort pairs from highest frequency to lowest\nresult = empty list\nfor i from 0 to k - 1:\n    append the value of pairs[i] to result\nreturn result"}, "opt": {"text": "Sorting is overkill because the sort keys (frequencies) live in a tiny known range: every frequency is an integer between 1 and n. Whenever keys are small bounded integers, bucket instead of compare-sort. Make n + 1 buckets where buckets[f] holds every value occurring exactly f times, then walk the buckets from the highest frequency downward collecting values until you have k. That is O(n) with no comparisons; a size-k min-heap is the O(n log k) middle ground worth mentioning.", "time": "O(n)", "space": "O(n)", "py": "def count_values(nums):\n    \"\"\"Return a dict value -> how many times it appears.\"\"\"\n    freq = {}\n    for value in nums:\n        freq[value] = freq.get(value, 0) + 1\n    return freq\n\n\ndef top_k_frequent(nums, k):\n    \"\"\"Bucket values by frequency, read buckets from the top. O(n) time, O(n) space.\"\"\"\n    freq = count_values(nums)\n    buckets = []  # buckets[c] holds the values that appear exactly c times\n    for _ in range(len(nums) + 1):\n        buckets.append([])\n    for value in freq:\n        buckets[freq[value]].append(value)\n    result = []\n    for count in range(len(nums), 0, -1):  # walk from the highest frequency down\n        for value in buckets[count]:\n            result.append(value)\n            if len(result) == k:\n                return result\n    return result\n\n\n# --- try it: change the inputs and run ---\nprint(sorted(top_k_frequent([1, 1, 1, 2, 2, 3], 2)))            # -> [1, 2]\nprint(sorted(top_k_frequent([1], 1)))                           # -> [1]\nprint(sorted(top_k_frequent([4, 4, 4, 5, 5, 6, 6, 6, 6], 2)))   # -> [4, 6]\nprint(sorted(top_k_frequent([7, 7, 7, 7], 1)))                  # -> [7]\n", "pseudo": "freq = count of each value in nums\nbuckets = n + 1 empty lists   (buckets[c] holds the values that appear exactly c times)\nfor each value in freq:\n    append value to buckets[freq[value]]\nresult = empty list\nfor count from n down to 1:\n    for each value in buckets[count]:\n        append value to result\n        if size of result == k:\n            return result\nreturn result"}}, "product_of_array_except_self": {"slug": "product_of_array_except_self", "topic": "arrays_hashing", "title": "Product of Array Except Self", "leetcode": 238, "difficulty": "Medium", "pattern": "Prefix and suffix accumulation", "statement": "Given an integer array nums, return answer where answer[i] is the product of all\nelements except nums[i], without using division and in O(n) time.\nExample: nums = [1, 2, 3, 4] -> [24, 12, 8, 6].", "why_here": "Introduces prefix and suffix accumulation: 'all but one' becomes 'left part times right part'.", "lc_slug": "product-of-array-except-self", "brute": {"text": "For each index i, multiply every other element in a nested loop. Compare two neighbouring answers: answer[i] and answer[i+1] share n - 2 identical factors, yet the brute force recomputes that shared product from scratch for every i.", "time": "O(n^2)", "space": "O(1)", "py": "def brute_force(nums):\n    \"\"\"For each i multiply every other element. O(n^2) time, O(1) extra space.\"\"\"\n    n = len(nums)\n    answer = []\n    for i in range(n):\n        product = 1\n        for j in range(n):\n            if j != i:\n                product = product * nums[j]\n        answer.append(product)\n    return answer\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force([1, 2, 3, 4]))          # -> [24, 12, 8, 6]\nprint(brute_force([-1, 1, 0, -3, 3]))     # -> [0, 0, 9, 0, 0]\nprint(brute_force([0, 0, 2]))             # -> [0, 0, 0]\nprint(brute_force([5, 2]))                # -> [2, 5]\n", "pseudo": "answer = empty list\nfor each index i:\n    product = 1\n    for each index j:\n        if j != i:\n            product = product * nums[j]\n    append product to answer\nreturn answer"}, "opt": {"text": "The product of everything except i equals (product of everything left of i) times (product of everything right of i). Both are running products that build incrementally: prefix[i] = prefix[i-1] * nums[i-1] in a left-to-right pass, and the suffix likewise right-to-left, so two passes replace n^2 multiplications. To reach O(1) extra space, write the prefix products straight into the output array, then sweep right-to-left carrying the suffix product in one variable and multiplying it in.", "time": "O(n)", "space": "O(1)", "py": "def product_except_self(nums):\n    \"\"\"Left products pass, then right products pass. O(n) time, O(1) extra space.\"\"\"\n    n = len(nums)\n    answer = [1] * n\n    prefix = 1\n    for i in range(n):\n        answer[i] = prefix  # product of everything left of i (stamp first, then include i)\n        prefix = prefix * nums[i]\n    suffix = 1\n    for i in range(n - 1, -1, -1):\n        answer[i] = answer[i] * suffix  # times the product of everything right of i\n        suffix = suffix * nums[i]\n    return answer\n\n\n# --- try it: change the inputs and run ---\nprint(product_except_self([1, 2, 3, 4]))          # -> [24, 12, 8, 6]\nprint(product_except_self([-1, 1, 0, -3, 3]))     # -> [0, 0, 9, 0, 0]\nprint(product_except_self([0, 0, 2]))             # -> [0, 0, 0]\nprint(product_except_self([5, 2]))                # -> [2, 5]\n", "pseudo": "answer = n ones\nprefix = 1\nfor i from 0 to n - 1:\n    answer[i] = prefix   (product of everything left of i: stamp first, then include i)\n    prefix = prefix * nums[i]\nsuffix = 1\nfor i from n - 1 down to 0:\n    answer[i] = answer[i] * suffix   (times the product of everything right of i)\n    suffix = suffix * nums[i]\nreturn answer"}}, "longest_consecutive_sequence": {"slug": "longest_consecutive_sequence", "topic": "arrays_hashing", "title": "Longest Consecutive Sequence", "leetcode": 128, "difficulty": "Medium", "pattern": "Hash set with sequence-start detection", "statement": "Given an unsorted integer array, return the length of the longest run of\nconsecutive integer values (values, not positions), in O(n) time.\nExample: nums = [100, 4, 200, 1, 3, 2] -> 4, from the run 1, 2, 3, 4.", "why_here": "A set plus a start-of-run test, and the chapter's first real amortised argument for a nested loop.", "lc_slug": "longest-consecutive-sequence", "brute": {"text": "For every element x, count upward checking whether x+1, x+2, ... are in the array, each check a linear scan of the list. Two kinds of repeated work: the membership scans, and re-walking the same run from every one of its members (1-2-3-4 is counted starting from 1, from 2, from 3 and from 4).", "time": "O(n^3)", "space": "O(1)", "py": "def brute_force(nums):\n    \"\"\"From every element count upward, each check a list scan. O(n^3) worst, O(1) space.\"\"\"\n    best = 0\n    for start in nums:\n        length = 1\n        while start + length in nums:  # 'in' on a list scans the whole list every time\n            length += 1\n        best = max(best, length)\n    return best\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force([100, 4, 200, 1, 3, 2]))             # -> 4\nprint(brute_force([0, 3, 7, 2, 5, 8, 4, 6, 0, 1]))     # -> 9\nprint(brute_force([]))                                 # -> 0\nprint(brute_force([1, 1, 1]))                          # -> 1\n", "pseudo": "best = 0\nfor each start in nums:\n    length = 1\n    while start + length is in nums:   (each membership test scans the whole list)\n        length += 1\n    best = max(best, length)\nreturn best"}, "opt": {"text": "First redundancy: linear membership scans. Put everything in a hash set so 'is x+1 present?' costs O(1). Second redundancy: re-walking a run from each of its members. A run has exactly one natural starting point, the element x such that x-1 is not in the set, so only start counting from those. Every element then belongs to exactly one walk (the one started at its run's minimum), so the total number of probes across all walks is at most n; that amortisation is the whole trick. Sorting first would give O(n log n), which violates the required bound.", "time": "O(n)", "space": "O(n)", "py": "def longest_consecutive(nums):\n    \"\"\"Set lookups; only walk a run from its smallest value. O(n) time, O(n) space.\"\"\"\n    values = set(nums)\n    best = 0\n    for start in values:\n        if start - 1 in values:\n            continue  # not the start of a run; the run is counted from its true start\n        length = 1\n        while start + length in values:\n            length += 1\n        best = max(best, length)\n    return best\n\n\n# --- try it: change the inputs and run ---\nprint(longest_consecutive([100, 4, 200, 1, 3, 2]))             # -> 4\nprint(longest_consecutive([0, 3, 7, 2, 5, 8, 4, 6, 0, 1]))     # -> 9\nprint(longest_consecutive([]))                                 # -> 0\nprint(longest_consecutive([1, 1, 1]))                          # -> 1\n", "pseudo": "values = set of nums\nbest = 0\nfor each start in values:\n    if start - 1 is in values:\n        skip start   (not the start of a run; the run is counted from its true start)\n    length = 1\n    while start + length is in values:\n        length += 1\n    best = max(best, length)\nreturn best"}}, "subarray_sum_equals_k": {"slug": "subarray_sum_equals_k", "topic": "arrays_hashing", "title": "Subarray Sum Equals K", "leetcode": 560, "difficulty": "Medium", "pattern": "Prefix sum + hash map of counts", "statement": "Given an integer array nums (which may contain negatives and zeros) and an integer\nk, return the number of contiguous subarrays whose elements sum to k.\nExample: nums = [1, 1, 1], k = 2 -> 2 (the subarrays at indices 0..1 and 1..2).", "why_here": "Prefix sums meet the two sum dict: count earlier prefixes equal to the current prefix minus k.", "lc_slug": "subarray-sum-equals-k", "brute": {"text": "For every start i, extend an end j to the right while accumulating the running sum and count each time it equals k. The accumulation is the repeated work: the sum of nums[i..j] equals prefix[j+1] - prefix[i], two numbers that could be computed once, yet the brute force rebuilds it for every i.", "time": "O(n^2)", "space": "O(1)", "py": "def brute_force(nums, k):\n    \"\"\"For every start, extend the end and keep a running sum. O(n^2) time, O(1) space.\"\"\"\n    n = len(nums)\n    answer = 0\n    for start in range(n):\n        running = 0\n        for end in range(start, n):\n            running += nums[end]\n            if running == k:\n                answer += 1\n    return answer\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force([1, 1, 1], 2))       # -> 2\nprint(brute_force([1, 2, 3], 3))       # -> 2\nprint(brute_force([1, -1, 0], 0))      # -> 3\nprint(brute_force([0, 0, 0, 0], 0))    # -> 10\n", "pseudo": "answer = 0\nfor each start index:\n    running = 0\n    for each end from start to n - 1:\n        running += nums[end]\n        if running == k:\n            answer += 1\nreturn answer"}, "opt": {"text": "Rewrite the condition sum(i..j) == k as prefix[j+1] - prefix[i] == k, i.e. prefix[i] == prefix[j+1] - k. For a fixed right end j the question becomes 'how many earlier prefix sums equal exactly this value?', which is a count lookup that a hash map answers in O(1). Sweep j left to right, maintaining the running prefix sum and a dict of counts of prefix sums seen so far, seeded with {0: 1} for the empty prefix. Each step adds counts[prefix - k] to the answer and then records the current prefix. A sliding window fails here because negatives break monotonicity; the hash map does not need monotonicity.", "time": "O(n)", "space": "O(n)", "py": "def subarray_sum(nums, k):\n    \"\"\"Count earlier prefix sums equal to prefix - k. O(n) time, O(n) space.\"\"\"\n    counts = {0: 1}  # prefix sum -> times seen; the empty prefix counts once\n    prefix = 0\n    answer = 0\n    for value in nums:\n        prefix += value\n        answer += counts.get(prefix - k, 0)  # each earlier prefix at prefix - k ends a k-sum here\n        counts[prefix] = counts.get(prefix, 0) + 1\n    return answer\n\n\n# --- try it: change the inputs and run ---\nprint(subarray_sum([1, 1, 1], 2))       # -> 2\nprint(subarray_sum([1, 2, 3], 3))       # -> 2\nprint(subarray_sum([1, -1, 0], 0))      # -> 3\nprint(subarray_sum([0, 0, 0, 0], 0))    # -> 10\n", "pseudo": "counts = dict prefix sum -> times seen, starting as {0: 1}   (the empty prefix)\nprefix = 0, answer = 0\nfor each value in nums:\n    prefix += value\n    answer += counts[prefix - k], or 0 if absent   (each earlier prefix at prefix - k ends a k-sum here)\n    counts[prefix] += 1\nreturn answer"}}, "valid_palindrome": {"slug": "valid_palindrome", "topic": "two_pointers", "title": "Valid Palindrome", "leetcode": 125, "difficulty": "Easy", "pattern": "Converging two pointers", "statement": "A phrase is a palindrome if, after lowercasing and removing every non-alphanumeric\ncharacter, it reads the same forwards and backwards. Return True if s is a palindrome.\nExample: \"A man, a plan, a canal: Panama\" -> True (\"amanaplanacanalpanama\");\n         \"race a car\" -> False.", "why_here": "The simplest converging walk: compare mirror cells from both ends, skipping junk.", "lc_slug": "valid-palindrome", "brute": {"text": "Build a cleaned string of lowercase alphanumerics and compare it with its reverse (cleaned == cleaned[::-1]). It is already linear time, but it materialises two full copies of the string when all we need is to compare mirrored characters pairwise, and it cannot exit early on the first mismatch.", "time": "O(n)", "space": "O(n)", "py": "def brute_force(s):\n    \"\"\"Build the cleaned string and compare it with its reverse. O(n) time, O(n) space.\"\"\"\n    cleaned = \"\"\n    for ch in s:\n        if ch.isalnum():  # keep only letters and digits\n            cleaned += ch.lower()\n    return cleaned == cleaned[::-1]\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(\"A man, a plan, a canal: Panama\"))   # -> True\nprint(brute_force(\"race a car\"))                       # -> False\nprint(brute_force(\".,\"))                               # -> True\nprint(brute_force(\"0P\"))                               # -> False\n", "pseudo": "cleaned = empty string\nfor each character ch in s:\n    if ch is a letter or digit: append lowercase ch to cleaned\nreturn cleaned == reverse of cleaned"}, "opt": {"text": "The comparison cleaned == reversed checks position i against position len-1-i for every i. We can do that directly on the original string with two indices walking inward from both ends. The only wrinkle is the filter: when a pointer rests on a non-alphanumeric character, advance it past, applying the filter lazily on the fly. Compare lowercase forms and return False at the first mismatch. No copies, O(1) space, and early exit.", "time": "O(n)", "space": "O(1)", "py": "def is_palindrome(s):\n    \"\"\"Two pointers walk inward, skipping junk as they go. O(n) time, O(1) space.\"\"\"\n    left = 0\n    right = len(s) - 1\n    while left < right:\n        while left < right and not s[left].isalnum():\n            left += 1  # filter lazily: step over punctuation and spaces on the fly\n        while left < right and not s[right].isalnum():\n            right -= 1\n        if s[left].lower() != s[right].lower():\n            return False\n        left += 1\n        right -= 1\n    return True\n\n\n# --- try it: change the inputs and run ---\nprint(is_palindrome(\"A man, a plan, a canal: Panama\"))   # -> True\nprint(is_palindrome(\"race a car\"))                       # -> False\nprint(is_palindrome(\".,\"))                               # -> True\nprint(is_palindrome(\"0P\"))                               # -> False\n", "pseudo": "left = 0, right = n - 1\nwhile left < right:\n    while left < right and s[left] is not a letter or digit: left += 1   (filter lazily, on the fly)\n    while left < right and s[right] is not a letter or digit: right -= 1\n    if lowercase s[left] != lowercase s[right]: return False\n    left += 1, right -= 1\nreturn True"}}, "move_zeroes": {"slug": "move_zeroes", "topic": "two_pointers", "title": "Move Zeroes", "leetcode": 283, "difficulty": "Easy", "pattern": "Read/write pointers (stable compaction)", "statement": "Move all 0s in nums to the end in place, keeping the relative order of the non-zero\nelements; return nothing.\nExample: nums = [0, 1, 0, 3, 12] -> [1, 3, 12, 0, 0].", "why_here": "Introduces the reader/writer geometry: a writer trails the reader and swaps kept values forward.", "lc_slug": "move-zeroes", "brute": {"text": "Bubble zeros rightward: whenever nums[i] == 0 and nums[i+1] != 0 swap them, and repeat passes until nothing moves. A non-zero value hops left one slot per pass, so it is moved once per zero in front of it instead of jumping straight to its final slot.", "time": "O(n^2)", "space": "O(1)", "py": "def brute_force(nums):\n    \"\"\"Bubble zeros rightward one slot per pass until nothing moves. O(n^2) time.\"\"\"\n    moved = True\n    while moved:\n        moved = False\n        for i in range(len(nums) - 1):\n            if nums[i] == 0 and nums[i + 1] != 0:  # a zero sits in front of a non-zero\n                nums[i], nums[i + 1] = nums[i + 1], nums[i]\n                moved = True\n\n\n# --- try it: change the inputs and run ---\na = [0, 1, 0, 3, 12]\nbrute_force(a)\nprint(a)      # -> [1, 3, 12, 0, 0]\nb = [0, 0, 1]\nbrute_force(b)\nprint(b)      # -> [1, 0, 0]\nc = [4, 0, 5, 0, 0, 6]\nbrute_force(c)\nprint(c)      # -> [4, 5, 6, 0, 0, 0]\n", "pseudo": "moved = True\nwhile moved:   (one bubble pass per round, until a pass moves nothing)\n    moved = False\n    for each i from 0 to n - 2:\n        if nums[i] == 0 and nums[i + 1] != 0:\n            swap nums[i] and nums[i + 1]\n            moved = True"}, "opt": {"text": "The redundancy is moving each non-zero one step at a time. Observation: the final slot of the k-th non-zero is simply index k, because order is preserved and zeros fill the tail. So keep a write pointer w (non-zeros placed so far) while a read pointer r scans; on each non-zero, swap it into slot w and advance w. Invariant: nums[0:w] are the non-zeros seen so far in order and nums[w:r] are all zeros, so a swap carries a zero forward to r.", "time": "O(n)", "space": "O(1)", "py": "def move_zeroes(nums):\n    \"\"\"Write pointer for non-zeros, read pointer scans. O(n) time, O(1) space.\"\"\"\n    write = 0  # next slot for a non-zero; everything before it is done\n    for read in range(len(nums)):\n        if nums[read] != 0:\n            nums[write], nums[read] = nums[read], nums[write]  # the zero at write moves to read\n            write += 1\n\n\n# --- try it: change the inputs and run ---\na = [0, 1, 0, 3, 12]\nmove_zeroes(a)\nprint(a)      # -> [1, 3, 12, 0, 0]\nb = [0, 0, 1]\nmove_zeroes(b)\nprint(b)      # -> [1, 0, 0]\nc = [4, 0, 5, 0, 0, 6]\nmove_zeroes(c)\nprint(c)      # -> [4, 5, 6, 0, 0, 0]\n", "pseudo": "write = 0   (next slot for a non-zero)\nfor each read from 0 to n - 1:\n    if nums[read] != 0:\n        swap nums[write] and nums[read]   (the zero at write moves forward to read)\n        write += 1"}}, "sort_colors": {"slug": "sort_colors", "topic": "two_pointers", "title": "Sort Colors", "leetcode": 75, "difficulty": "Medium", "pattern": "Dutch national flag (three-way partition)", "statement": "Given an array containing only 0s, 1s and 2s, sort it in place so all 0s come first,\nthen 1s, then 2s, without the library sort. Aim for one pass with O(1) space.\nExample: nums = [2, 0, 2, 1, 1, 0] -> [0, 0, 1, 1, 2, 2].", "why_here": "Three pointers: one reader and two writers growing from opposite ends keep four regions.", "lc_slug": "sort-colors", "brute": {"text": "Count how many 0s, 1s and 2s there are in one pass, then overwrite the array with that many of each in a second pass (counting sort). It is linear and correct, but the second pass rewrites every cell including those already in place, and it does not generalise to records that carry data along with their key.", "time": "O(n)", "space": "O(1)", "py": "def brute_force(nums):\n    \"\"\"Count the 0s, 1s and 2s, then rewrite the array. O(n) time, two passes.\"\"\"\n    counts = [0, 0, 0]\n    for value in nums:\n        counts[value] += 1\n    i = 0\n    for colour in range(3):\n        for _ in range(counts[colour]):  # write that many copies of this colour\n            nums[i] = colour\n            i += 1\n\n\n# --- try it: change the inputs and run ---\na = [2, 0, 2, 1, 1, 0]\nbrute_force(a)\nprint(a)      # -> [0, 0, 1, 1, 2, 2]\nb = [2, 0, 1]\nbrute_force(b)\nprint(b)      # -> [0, 1, 2]\nc = [2, 2, 2, 1, 1, 0, 0]\nbrute_force(c)\nprint(c)      # -> [0, 0, 1, 1, 2, 2, 2]\n", "pseudo": "counts = [0, 0, 0]\nfor each value in nums: counts[value] += 1\ni = 0\nfor each colour 0, 1, 2:\n    repeat counts[colour] times:\n        nums[i] = colour\n        i += 1"}, "opt": {"text": "Instead of counting then rewriting, partition in a single pass by maintaining three regions with invariants: nums[:low] are all 0, nums[low:mid] are all 1, nums[high+1:] are all 2, and nums[mid:high+1] is unexplored. Examine nums[mid]: a 0 is swapped to the low boundary (both low and mid advance), a 1 is already in place (mid advances), a 2 is swapped to the high boundary (high retreats, mid stays because the swapped-in value is unexplored). Each step shrinks the unexplored region by one, so one pass and each element moves at most twice.", "time": "O(n)", "space": "O(1)", "py": "def sort_colors(nums):\n    \"\"\"Three regions grow in one pass (Dutch national flag). O(n) time, O(1) space.\"\"\"\n    low = 0           # nums[:low] are all 0\n    mid = 0           # nums[low:mid] are all 1; nums[mid:high + 1] not looked at yet\n    high = len(nums) - 1  # nums[high + 1:] are all 2\n    while mid <= high:\n        if nums[mid] == 0:\n            nums[low], nums[mid] = nums[mid], nums[low]\n            low += 1\n            mid += 1\n        elif nums[mid] == 1:\n            mid += 1\n        else:\n            nums[mid], nums[high] = nums[high], nums[mid]\n            high -= 1  # mid stays: the value swapped in has not been examined yet\n\n\n# --- try it: change the inputs and run ---\na = [2, 0, 2, 1, 1, 0]\nsort_colors(a)\nprint(a)      # -> [0, 0, 1, 1, 2, 2]\nb = [2, 0, 1]\nsort_colors(b)\nprint(b)      # -> [0, 1, 2]\nc = [2, 2, 2, 1, 1, 0, 0]\nsort_colors(c)\nprint(c)      # -> [0, 0, 1, 1, 2, 2, 2]\n", "pseudo": "low = 0, mid = 0, high = n - 1   (0s before low, 1s from low to mid, 2s after high)\nwhile mid <= high:\n    if nums[mid] == 0:\n        swap nums[low] and nums[mid]\n        low += 1, mid += 1\n    else if nums[mid] == 1:\n        mid += 1\n    else:\n        swap nums[mid] and nums[high]\n        high -= 1   (mid stays: the value swapped in has not been examined yet)"}}, "two_sum_ii_input_array_is_sorted": {"slug": "two_sum_ii_input_array_is_sorted", "topic": "two_pointers", "title": "Two Sum II - Input Array Is Sorted", "leetcode": 167, "difficulty": "Medium", "pattern": "Converging two pointers on sorted input", "statement": "Given a 1-indexed array sorted in non-decreasing order and a target, return the\n1-based indices [i, j] with i < j of the two numbers that sum to target. Exactly one\nsolution exists and you must use O(1) extra space.\nExample: numbers = [2, 7, 11, 15], target = 9 -> [1, 2].", "why_here": "Makes the pruning argument explicit: each comparison deletes a whole row or column of pairs.", "lc_slug": "two-sum-ii-input-array-is-sorted", "brute": {"text": "Check every pair (i, j) with i < j for numbers[i] + numbers[j] == target. The waste is ignoring the sort order: once numbers[i] + numbers[j] exceeds target, every j' > j is also too big, yet the brute force keeps testing them. A hash map gives O(n) time but O(n) space, which the problem forbids.", "time": "O(n^2)", "space": "O(1)", "py": "def brute_force(numbers, target):\n    \"\"\"Try every pair i < j, ignoring the sort order. O(n^2) time, O(1) space.\"\"\"\n    n = len(numbers)\n    for i in range(n):\n        for j in range(i + 1, n):\n            if numbers[i] + numbers[j] == target:\n                return [i + 1, j + 1]  # the problem wants 1-based indices\n    return []\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force([2, 7, 11, 15], 9))                 # -> [1, 2]\nprint(brute_force([2, 3, 4], 6))                      # -> [1, 3]\nprint(brute_force([-1, 0], -1))                       # -> [1, 2]\nprint(brute_force([1, 2, 3, 4, 4, 9, 56, 90], 8))     # -> [4, 5]\n", "pseudo": "for each index i:\n    for each index j after i:\n        if numbers[i] + numbers[j] == target:\n            return [i + 1, j + 1]   (1-based indices)\nreturn []"}, "opt": {"text": "Because the array is sorted, the sum of the current pair tells us which way to move. Start with the smallest and largest elements. If the sum is too small, the only way to increase it is to move the left pointer right; if too big, move the right pointer left. Each move permanently discards one element as a possible partner: a too-small left element cannot pair with anything smaller than the current right (those sums are even smaller), and symmetrically for the right. At most n - 1 moves, so O(n) time and O(1) space.", "time": "O(n)", "space": "O(1)", "py": "def two_sum_sorted(numbers, target):\n    \"\"\"Pointers at both ends; the sum says which one to move. O(n) time, O(1) space.\"\"\"\n    left = 0\n    right = len(numbers) - 1\n    while left < right:\n        total = numbers[left] + numbers[right]\n        if total == target:\n            return [left + 1, right + 1]  # 1-based indices\n        if total < target:\n            left += 1  # too small: only a bigger left value can raise the sum\n        else:\n            right -= 1  # too big: only a smaller right value can lower it\n    return []\n\n\n# --- try it: change the inputs and run ---\nprint(two_sum_sorted([2, 7, 11, 15], 9))                 # -> [1, 2]\nprint(two_sum_sorted([2, 3, 4], 6))                      # -> [1, 3]\nprint(two_sum_sorted([-1, 0], -1))                       # -> [1, 2]\nprint(two_sum_sorted([1, 2, 3, 4, 4, 9, 56, 90], 8))     # -> [4, 5]\n", "pseudo": "left = 0, right = n - 1\nwhile left < right:\n    total = numbers[left] + numbers[right]\n    if total == target: return [left + 1, right + 1]   (1-based indices)\n    if total < target: left += 1   (too small: only a bigger left value can raise the sum)\n    else: right -= 1   (too big: only a smaller right value can lower it)\nreturn []"}}, "three_sum": {"slug": "three_sum", "topic": "two_pointers", "title": "3Sum", "leetcode": 15, "difficulty": "Medium", "pattern": "Sort + fixed element + converging two pointers", "statement": "Given an integer array nums, return all unique triplets [a, b, c] with a + b + c == 0;\nthe result must not contain duplicate triplets (any order).\nExample: nums = [-1, 0, 1, 2, -1, -4] -> [[-1, -1, 2], [-1, 0, 1]].", "why_here": "Sort, fix an anchor, run Two Sum II on the suffix; sorted order also makes dedup local.", "lc_slug": "3sum", "brute": {"text": "Three nested loops over i < j < k test every triplet's sum and insert the sorted triplet into a set to kill duplicates. For every fixed pair (i, j) the required third value is already known, -(nums[i] + nums[j]), yet a whole loop searches for it, and duplicate triplets are generated many times only to be thrown away by the set.", "time": "O(n^3)", "space": "O(#answers)", "py": "def tidy(triplets):\n    \"\"\"Sort inside each triplet and then sort the triplets, so any valid answer prints the same.\"\"\"\n    tidied = []\n    for triplet in triplets:\n        tidied.append(sorted(triplet))\n    return sorted(tidied)\n\n\ndef brute_force(nums):\n    \"\"\"Try every triple i < j < k; a set removes duplicates. O(n^3) time.\"\"\"\n    n = len(nums)\n    found = set()\n    for i in range(n):\n        for j in range(i + 1, n):\n            for k in range(j + 1, n):\n                if nums[i] + nums[j] + nums[k] == 0:\n                    found.add(tuple(sorted([nums[i], nums[j], nums[k]])))  # sorted so clones match\n    result = []\n    for triplet in found:\n        result.append(list(triplet))\n    return result\n\n\n# --- try it: change the inputs and run ---\nprint(tidy(brute_force([-1, 0, 1, 2, -1, -4])))        # -> [[-1, -1, 2], [-1, 0, 1]]\nprint(tidy(brute_force([0, 1, 1])))                    # -> []\nprint(tidy(brute_force([0, 0, 0])))                    # -> [[0, 0, 0]]\nprint(tidy(brute_force([-2, 0, 0, 2, 2])))             # -> [[-2, 0, 2]]\n", "pseudo": "found = empty set\nfor each triple of indices i < j < k:\n    if nums[i] + nums[j] + nums[k] == 0:\n        add the sorted triple (nums[i], nums[j], nums[k]) to found   (sorted so clones match)\nreturn found as a list of lists"}, "opt": {"text": "Fix the first element nums[i]; the remainder is Two Sum with target -nums[i]. A hash set makes that O(n) per i but deduplication stays messy. Sorting first solves both problems at once: on a sorted suffix the two-sum is a converging two-pointer walk (O(n) per i, O(1) extra space), and duplicates become adjacent, so they are skipped by advancing past equal neighbours, both for the anchor i and for left/right after a hit. Sorting costs O(n log n), dominated by the O(n^2) scan.", "time": "O(n^2)", "space": "O(1)", "py": "def tidy(triplets):\n    \"\"\"Sort inside each triplet and then sort the triplets, so any valid answer prints the same.\"\"\"\n    tidied = []\n    for triplet in triplets:\n        tidied.append(sorted(triplet))\n    return sorted(tidied)\n\n\ndef three_sum(nums):\n    \"\"\"Sort; fix one value, two-pointer the rest, skip repeats. O(n^2) time.\"\"\"\n    nums.sort()\n    n = len(nums)\n    result = []\n    for i in range(n - 2):\n        if nums[i] > 0:\n            break  # everything after is positive too, no zero sum possible\n        if i > 0 and nums[i] == nums[i - 1]:\n            continue  # same anchor as last time gives the same triplets\n        left = i + 1\n        right = n - 1\n        while left < right:\n            total = nums[i] + nums[left] + nums[right]\n            if total < 0:\n                left += 1\n            elif total > 0:\n                right -= 1\n            else:\n                result.append([nums[i], nums[left], nums[right]])\n                left += 1\n                right -= 1\n                while left < right and nums[left] == nums[left - 1]:\n                    left += 1  # step over clones of the value just used\n                while left < right and nums[right] == nums[right + 1]:\n                    right -= 1\n    return result\n\n\n# --- try it: change the inputs and run ---\nprint(tidy(three_sum([-1, 0, 1, 2, -1, -4])))        # -> [[-1, -1, 2], [-1, 0, 1]]\nprint(tidy(three_sum([0, 1, 1])))                    # -> []\nprint(tidy(three_sum([0, 0, 0])))                    # -> [[0, 0, 0]]\nprint(tidy(three_sum([-2, 0, 0, 2, 2])))             # -> [[-2, 0, 2]]\n", "pseudo": "sort nums, result = empty list\nfor each i from 0 to n - 3:\n    if nums[i] > 0: stop   (everything after is positive too)\n    if i > 0 and nums[i] == nums[i - 1]: skip this i   (same anchor gives the same triplets)\n    left = i + 1, right = n - 1\n    while left < right:\n        total = nums[i] + nums[left] + nums[right]\n        if total < 0: left += 1\n        else if total > 0: right -= 1\n        else:\n            append [nums[i], nums[left], nums[right]] to result\n            left += 1, right -= 1\n            step left over repeats of nums[left - 1], step right over repeats of nums[right + 1]\nreturn result"}}, "container_with_most_water": {"slug": "container_with_most_water", "topic": "two_pointers", "title": "Container With Most Water", "leetcode": 11, "difficulty": "Medium", "pattern": "Converging two pointers, move the limiting side", "statement": "Given heights of n vertical lines at x = 0..n-1, choose two lines that together with\nthe x-axis form the container holding the most water; the area is\nmin(h[i], h[j]) * (j - i). Return the maximum area.\nExample: height = [1, 8, 6, 2, 5, 4, 8, 3, 7] -> 49 (indices 1 and 8).", "why_here": "No sorting: the monotone fact is geometric, the shorter wall can never be in a better pair.", "lc_slug": "container-with-most-water", "brute": {"text": "Evaluate min(h[i], h[j]) * (j - i) for every pair i < j and keep the maximum. Once we know the shorter of two walls, every pair that keeps that shorter wall and brings the other wall closer is provably worse (narrower, and no taller than the short wall), yet the brute force still evaluates all of them.", "time": "O(n^2)", "space": "O(1)", "py": "def brute_force(height):\n    \"\"\"Measure every pair of walls. O(n^2) time, O(1) space.\"\"\"\n    n = len(height)\n    best = 0\n    for i in range(n):\n        for j in range(i + 1, n):\n            area = min(height[i], height[j]) * (j - i)  # water level is the shorter wall\n            best = max(best, area)\n    return best\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force([1, 8, 6, 2, 5, 4, 8, 3, 7]))    # -> 49\nprint(brute_force([1, 1]))                         # -> 1\nprint(brute_force([4, 3, 2, 1, 4]))                # -> 16\nprint(brute_force([2, 3, 10, 5, 7, 8, 9]))         # -> 36\n", "pseudo": "best = 0\nfor each pair of walls i < j:\n    area = min(height[i], height[j]) * (j - i)   (the water level is the shorter wall)\n    best = max(best, area)\nreturn best"}, "opt": {"text": "Start with the widest container (left = 0, right = n - 1); its height is capped by the shorter wall. Any other container that still uses that shorter wall is narrower and no taller, so it is strictly worse, meaning the shorter wall can be discarded from all future consideration. Move the pointer on the shorter side inward. Each step eliminates one wall, so n - 1 steps examine everything that could beat the best so far. Ties can move either side.", "time": "O(n)", "space": "O(1)", "py": "def max_area(height):\n    \"\"\"Start widest; always move the shorter wall inward. O(n) time, O(1) space.\"\"\"\n    left = 0\n    right = len(height) - 1\n    best = 0\n    while left < right:\n        area = min(height[left], height[right]) * (right - left)\n        best = max(best, area)\n        if height[left] < height[right]:\n            left += 1  # the shorter wall can never be part of a better pair\n        else:\n            right -= 1\n    return best\n\n\n# --- try it: change the inputs and run ---\nprint(max_area([1, 8, 6, 2, 5, 4, 8, 3, 7]))    # -> 49\nprint(max_area([1, 1]))                         # -> 1\nprint
