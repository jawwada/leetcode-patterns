e picture you draw:\n\n head\n  |\n  v\n +---+---+    +---+---+    +---+---+\n | 1 | o-+--> | 2 | o-+--> | 3 | / |\n +---+---+    +---+---+    +---+---+\n  val next     val next     val next (None)\n\nwhat memory actually looks like:\n\n address  0x40        0x98        0x1c\n         +---+----+  +---+----+  +---+----+\n         | 1 |0x1c|  | 3 |None|  | 2 |0x98|\n         +---+----+  +---+----+  +---+----+\n          ^ head\n 1 says \"next is at 0x1c\", 2 says \"next is at 0x98\";\n the order in memory is arbitrary\n```\n\nThe nodes are not next to each other. The address in `next` is the only thing that says which node comes second. That\nis why there is no index: an array can compute \"element 5 lives at base + 5 * size\", but a list has no base and no fixed\nsize per step. To reach the fifth node you must follow four arrows, one at a time. Position in a linked list is not a\nnumber you can jump to; it is a walk you have to take.\n\nA Python variable like `cur` or `prev` is not a node. It is a name tag tied to a node. Moving `cur = cur.next` slides the\ntag along; it changes nothing in the list. Writing `cur.next = something` is different: it changes the arrow stored inside\nthe node, and that change is permanent and visible to everyone who reaches that node.\n\n```text\ncur = cur.next   (move a tag, list unchanged)\n\n before:   [1] -> [2] -> [3]        after:  [1] -> [2] -> [3]\n            ^                                       ^\n           cur                                     cur\n\ncur.next = None  (edit an arrow, list changed)\n\n before:   [1] -> [2] -> [3]        after:  [1]    [2] -> [3]\n            ^                                ^      (unreachable\n           cur                              cur      from head)\n```\n\nKeep those two kinds of statement apart in your head and half of this chapter's bugs disappear."}, {"title": "Operations and what they cost", "md": "| Operation | Time | Why |\n|---|---|---|\n| Read head | O(1) | you hold a reference to it |\n| Reach the k-th node | O(k) | must follow k arrows; no index arithmetic |\n| Find length | O(n) | walk to `None` and count |\n| Insert after a known node | O(1) | two arrow writes |\n| Delete the node after a known node | O(1) | one arrow write |\n| Delete a node given only itself | O(1) trick or O(n) | you need its predecessor's arrow |\n| Reverse the whole list | O(n) | one arrow flip per node |\n| Find the middle | O(n) | fast runner reaches the end in n/2 steps |\n\nInsert `X` after node `A`. The order of the two writes matters: hook `X` onto `A`'s successor first, then hook `A` onto\n`X`. Do it the other way round and `A.next` already points at `X`, so you have lost the address of `B`.\n\n```text\ninsert X after A:\n\n start:     A -> B -> C          X -> None\n step 1:    X.next = A.next      X -> B   (A still -> B)\n step 2:    A.next = X           A -> X -> B -> C\n```\n\nDelete the node after `A`. One write skips over it; the skipped node still exists in memory (it may even still point at\n`C`) but nothing reachable from `head` leads to it, so it is gone from the list.\n\n```text\ndelete after A:\n\n start:     A -> B -> C\n A.next = A.next.next\n result:    A ------> C          B -> C  (orphaned)\n```\n\nReverse in place. Three tags walk the list: `prev` (head of the part already reversed), `cur` (the node being flipped),\n`nxt` (the rest, saved before the flip).\n\n```text\nmiddle of a reversal:\n\n None <- [1] <- [2]    [3] -> [4] -> None\n                 ^      ^      ^\n                prev   cur    nxt  (saved first)\n\n cur.next = prev ; prev = cur ; cur = nxt\n\n None <- [1] <- [2] <- [3]    [4] -> None\n                        ^      ^\n                       prev   cur\n```\n\nFind the middle. A slow tag moves one arrow per tick, a fast tag moves two. When fast cannot move any more, slow has\ncovered half the distance.\n\n```text\n [1] -> [2] -> [3] -> [4] -> [5] -> None\n s,f                                    tick 0\n         s      f                       tick 1\n                s             f         tick 2: f.next is None\n                ^ middle\n```"}, {"title": "The invariant", "md": "The one property every linked list algorithm protects:\n\n**Every node you still need must be reachable from some reference you are holding.**\n\nA node is reachable if you can get to it from `head`, from `dummy`, or from one of your tags (`prev`, `cur`, `nxt`,\n`slow`, `tail`...) by following arrows. The moment the last arrow into a part of the list is overwritten and no tag sits\non it, that part is lost for good. Python will garbage-collect it; you cannot get it back.\n\nThis gives the working rule: **save `next` before you rewire.** Before any statement of the form `x.next = ...`, ask:\n\"is `x.next` the only way I know to reach the rest?\" If yes, put a tag on it first.\n\n```text\nlegal state (mid-reversal, rest saved):\n\n None <- [1] <- [2]   [3] -> [4] -> None\n                 ^     ^      ^\n                prev  cur    nxt\n every node reachable from prev or nxt\n\nillegal state (flipped cur.next before saving it):\n\n None <- [1] <- [2] <- [3]    [4] -> None\n                        ^      ^\n                    prev,cur   ??? no tag here\n [4] is unreachable: the tail of the list is lost\n```\n\nThe dummy head is the other half of this invariant. Many algorithms might delete or replace the first node, which would\nforce a special case (\"if we are at the head, update `head` instead of `prev.next`\"). A dummy node placed in front of the\nreal head removes the special case: every real node, including the first, now has a predecessor, and `dummy.next` is\nalways the current head no matter what happened to the original first node.\n\n```text\nwithout dummy: deleting [1] means \"head = head.next\" (special)\n\nwith dummy:\n [D] -> [1] -> [2] -> [3]       prev = D\n prev.next = prev.next.next     same code as any other delete\n [D] ---------> [2] -> [3]      answer is D.next\n```"}, {"title": "Python toolbox", "md": "Python has no built-in singly linked list type; LeetCode gives you a class like this one.\n\n```python\nclass ListNode:\n    def __init__(self, val=0, next=None):\n        self.val, self.next = val, next\n```\n\nTwo helpers make testing painless: build from a Python list, and read back into one.\n\n```python\ndef build(vals):\n    dummy = tail = ListNode()\n    for v in vals:\n        tail.next = tail = ListNode(v)   # careful: see below\n    return dummy.next\n```\n\nThat chained assignment works because Python assigns targets left to right: `tail.next` first (old tail), then `tail`.\nTuple assignment follows the same rule and is where many reversals break:\n\n```python\n# right side evaluated first, then targets left to right\ncur.next, prev, cur = prev, cur, cur.next  # correct\nprev, cur, cur.next = cur, cur.next, prev  # WRONG: sets .next\n                                           # on the NEW cur\n```\n\nOther things worth knowing:\n\n- Compare nodes with `is`, not `==`. Two different nodes can hold the same value; cycle and intersection questions are\n  about identity.\n- `collections.deque` is a doubly linked list of blocks, useful when you need O(1) at both ends, but it is not something\n  you can rewire node by node.\n- Recursive list algorithms use one stack frame per node. Python's default recursion limit is about 1000, so a recursive\n  reversal of a 5000-node list crashes. Prefer the loop.\n- `id(node)` or the node itself can go in a `set` or `dict` as a key; nodes hash by identity by default."}, {"title": "Mistakes people make", "md": "1. **Overwriting `cur.next` before saving it.** Fix: `nxt = cur.next` is always the first line of the loop body.\n2. **Special-casing the head and getting it wrong.** Fix: put a dummy node in front and return `dummy.next`.\n3. **Returning the old `head` after a reversal.** Fix: the old head is now the tail; return `prev`.\n4. **Dereferencing `None`.** `fast.next.next` crashes when `fast.next` is `None`. Fix: loop on `while fast and fast.next`.\n5. **Forgetting the leftover tail when merging.** Fix: after the loop, `tail.next = l1 or l2`.\n6. **Checking `slow is fast` before the first move.** They start on the same node. Fix: move first, then compare.\n7. **Comparing values instead of nodes.** Fix: use `is`; equal values do not mean the same node.\n8. **Off-by-one in the gap.** To stop on the node before the target, the gap must be n+1 links, not n. Fix: draw it with\n   n = 1 and check.\n9. **Leaving a stray arrow that creates a cycle.** After splitting or reordering, the new last node may still point into\n   the other half. Fix: explicitly set the new tail's `next` to `None`.\n10. **Tuple assignment in the wrong order.** Fix: write the save, flip, advance as three separate lines until it is\n    second nature."}], "items": [{"id": "fund-linked_lists-01_build_print_insert_delete", "name": "01_build_print_insert_delete", "area": "linked_lists", "title": "Build, Print, Insert, Delete", "key_ops": "walk index steps from a dummy, splice a node in, unlink the first node with val", "statement": "Build a singly linked list from a Python list, print it back, insert a value at a position\n(0 <= index <= length) and delete the first node holding a value (no-op if absent). A dummy node in\nfront of the head makes \"insert at 0\" and \"delete the head\" ordinary cases.\nExample: insert 1 at 0, 3 at 1, 2 at 1; delete 3; delete 9 ->\n[1], [1, 3], [1, 2, 3], [1, 2], [1, 2]", "text": "The basic linked list operations: build from a Python list with a moving tail, print by walking, insert at an index, delete the first node with a value. A dummy node in front of the head is the whole trick: inserting at index 0 and deleting the head become ordinary cases, and you return dummy.next. People lose the head by skipping the dummy, or walk one step too far so prev is not the node before the slot. Build and delete are O(n), insert is O(index), O(1) extra space.", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Append each value after a moving tail; the dummy's next is the head. O(n).\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next                    # the tail always points at the last node\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Walk node to node until None, collecting the values. O(n).\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef insert_at(head, index, val):\n    \"\"\"Walk index steps from a dummy so prev is the node before the slot, then splice in. O(i).\"\"\"\n    dummy = ListNode(0, head)               # the dummy makes index 0 an ordinary case\n    prev = dummy\n    for _ in range(index):\n        prev = prev.next\n    prev.next = ListNode(val, prev.next)    # the new node takes over prev's old next\n    return dummy.next\n\n\ndef delete_value(head, val):\n    \"\"\"Walk prev until prev.next holds val, then skip over that node. O(n); no-op if absent.\"\"\"\n    dummy = ListNode(0, head)               # the dummy makes deleting the head an ordinary case\n    prev = dummy\n    while prev.next is not None and prev.next.val != val:\n        prev = prev.next\n    if prev.next is not None:\n        prev.next = prev.next.next          # unlink by skipping over the node\n    return dummy.next\n\n\n# --- try it: change the inputs and run ---\nhead = insert_at(None, 0, 1)\nprint(list_to_array(head))                                 # -> [1]\nhead = insert_at(head, 1, 3)\nprint(list_to_array(head))                                 # -> [1, 3]\nhead = insert_at(head, 1, 2)\nprint(list_to_array(head))                                 # -> [1, 2, 3]\nhead = delete_value(head, 3)\nprint(list_to_array(head))                                 # -> [1, 2]\nhead = delete_value(head, 9)\nprint(list_to_array(head))                                 # -> [1, 2]\nprint(list_to_array(build_list([4, 5, 6])))                # -> [4, 5, 6]\nprint(list_to_array(delete_value(build_list([7, 8]), 7)))  # -> [8]\nprint(list_to_array(insert_at(build_list([7, 8]), 2, 9)))  # -> [7, 8, 9]\n", "pseudo": "build_list(values):\n    dummy = new node, tail = dummy\n    for each value: tail.next = new node(value), tail = tail.next\n    return dummy.next\nlist_to_array(head):\n    out = empty, node = head\n    while node exists: add node.val to out, node = node.next\n    return out\ninsert_at(head, index, val):\n    dummy = new node pointing at head, prev = dummy   (index 0 becomes an ordinary case)\n    repeat index times: prev = prev.next\n    prev.next = new node(val) pointing at prev.next\n    return dummy.next\ndelete_value(head, val):\n    dummy = new node pointing at head, prev = dummy\n    while prev.next exists and prev.next.val != val: prev = prev.next\n    if prev.next exists: prev.next = prev.next.next   (unlink by skipping over the node)\n    return dummy.next"}, {"id": "fund-linked_lists-02_reverse_iterative_and_recursive", "name": "02_reverse_iterative_and_recursive", "area": "linked_lists", "title": "Reverse a Linked List, Iterative and Recursive", "key_ops": "save next before you cut, point cur back to prev, advance both, hang head behind", "statement": "Reverse a singly linked list in place and return the new head. The iterative version walks three\npointers (prev, cur, nxt) in O(1) space; the recursive version reverses the rest first, then hooks\nthe current node behind its old next node.\nExample: 1 -> 2 -> 3 -> 4 -> 5 becomes 5 -> 4 -> 3 -> 2 -> 1", "text": "Reversing a linked list flips every next pointer. The iterative version walks three pointers: save cur's next before you cut, point cur back at prev, then advance both; when cur falls off the end, prev is the new head. The recursive version reverses the rest first, then hangs the current node behind its old next node and clears its own next. Cutting before saving the rest is the classic bug that loses the tail. O(n) time; O(1) space iterative, O(n) stack recursive.", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Turn a linked list back into a Python list.\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef reverse_iterative(head):\n    \"\"\"Three pointers: save next, point cur back at prev, advance both. O(n) time, O(1) space.\"\"\"\n    prev = None\n    cur = head\n    while cur is not None:\n        nxt = cur.next                      # save the rest BEFORE cutting the link\n        cur.next = prev                     # the cut: cur now points backwards\n        prev = cur\n        cur = nxt\n    return prev                             # cur fell off the end: prev is the new head\n\n\ndef reverse_recursive(head):\n    \"\"\"Reverse everything after head, then hang head behind its old next node. O(n), O(n) stack.\"\"\"\n    if head is None or head.next is None:\n        return head                         # an empty or single node is its own reverse\n    new_head = reverse_recursive(head.next)\n    head.next.next = head                   # the old next node is the tail of the reversed rest\n    head.next = None                        # head becomes the new tail\n    return new_head\n\n\n# --- try it: change the inputs and run ---\nprint(list_to_array(reverse_iterative(build_list([1, 2, 3, 4, 5]))))   # -> [5, 4, 3, 2, 1]\nprint(list_to_array(reverse_recursive(build_list([1, 2, 3, 4, 5]))))   # -> [5, 4, 3, 2, 1]\nprint(list_to_array(reverse_iterative(build_list([1, 2]))))            # -> [2, 1]\nprint(list_to_array(reverse_recursive(build_list([1]))))               # -> [1]\nprint(list_to_array(reverse_iterative(build_list([]))))                # -> []\n", "pseudo": "reverse_iterative(head):\n    prev = empty, cur = head\n    while cur exists:\n        nxt = cur.next   (save the rest BEFORE cutting the link)\n        cur.next = prev\n        prev = cur, cur = nxt\n    return prev\nreverse_recursive(head):\n    if head is empty or head.next is empty: return head\n    new_head = reverse_recursive(head.next)\n    head.next.next = head   (the old next node is the tail of the reversed rest)\n    head.next = empty\n    return new_head"}, {"id": "fund-linked_lists-03_middle_with_fast_and_slow", "name": "03_middle_with_fast_and_slow", "area": "linked_lists", "title": "Middle of the Linked List with Fast and Slow Pointers", "key_ops": "slow moves one, fast moves two, stop when fast or fast.next is None", "statement": "Return the middle node of a singly linked list in one pass without counting. For an even length\nthere are two middles; `while fast and fast.next` stops slow on the second one (the right middle).\nExample: 1 -> 2 -> 3 -> 4 -> 5 -> 3;  1 -> 2 -> 3 -> 4 -> 5 -> 6 -> 4", "text": "The fast and slow pointer pair finds the middle of a linked list in one pass without counting: slow steps one node, fast steps two, and when fast can no longer take two more steps slow is in the middle. For an even length there are two middles, and the condition while fast and fast.next leaves slow on the second one; checking fast.next and fast.next.next instead picks the first. The common slip is testing only fast, which crashes on fast.next.next at the end. O(n) time, O(1) space.", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Turn a linked list back into a Python list.\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef middle_node(head):\n    \"\"\"Slow steps 1, fast steps 2; when fast cannot take two more steps, slow is the middle.\"\"\"\n    slow = head\n    fast = head\n    while fast is not None and fast.next is not None:   # fast needs two more nodes to keep going\n        slow = slow.next\n        fast = fast.next.next\n    return slow\n\n\n# --- try it: change the inputs and run ---\nprint(middle_node(build_list([1, 2, 3, 4, 5])).val)             # -> 3\nprint(middle_node(build_list([1, 2, 3, 4, 5, 6])).val)          # -> 4\nprint(list_to_array(middle_node(build_list([1, 2, 3, 4]))))     # -> [3, 4]\nprint(middle_node(build_list([7])).val)                         # -> 7\nprint(middle_node(build_list([])))                              # -> None\n", "pseudo": "slow = head, fast = head\nwhile fast exists and fast.next exists:   (fast needs two more nodes to keep going)\n    slow = slow.next\n    fast = fast.next.next\nreturn slow   (even length: the second of the two middles)"}, {"id": "fund-linked_lists-04_detect_cycle_floyd", "name": "04_detect_cycle_floyd", "area": "linked_lists", "title": "Detect a Cycle with Floyd's Tortoise and Hare", "key_ops": "slow and fast meet inside the cycle, reset one pointer to head, step both by one", "statement": "Given a list whose tail may point back to an earlier node, tell whether there is a cycle and return\nthe index of the node where it begins (-1 if none), in O(1) space. build_list(values, pos) links\nthe last node to the node at index pos (pos = -1 means no cycle).\nExample: values [3, 2, 0, -4], pos 1 -> 1   (the tail -4 points back to 2)", "text": "Floyd's tortoise and hare detects a cycle in a linked list in constant space: slow steps one, fast steps two, and inside a cycle fast must eventually land on slow, while without a cycle fast runs off the end. To find where the cycle starts, keep one pointer at the meeting node, restart the other at the head, and step both by one; they meet exactly at the entry. People compare node values instead of node identity with is, or restart both pointers instead of one. O(n) time, O(1) space.", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values, pos=-1):\n    \"\"\"Linked list from a Python list; the last node links back to index pos (-1: no cycle).\"\"\"\n    nodes = []\n    for value in values:\n        nodes.append(ListNode(value))\n    for i in range(len(nodes) - 1):\n        nodes[i].next = nodes[i + 1]\n    if len(nodes) > 0 and pos >= 0:\n        nodes[-1].next = nodes[pos]          # close the cycle\n    if len(nodes) == 0:\n        return None\n    return nodes[0]\n\n\ndef list_to_array(head):\n    \"\"\"Values in order, stopping at the first node seen twice so a cycle is printed once.\"\"\"\n    out = []\n    seen = set()\n    node = head\n    while node is not None and node not in seen:\n        seen.add(node)\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef meeting_point(head):\n    \"\"\"Slow steps 1, fast steps 2: they meet inside a cycle, or fast runs off the end. O(n).\"\"\"\n    slow = head\n    fast = head\n    while fast is not None and fast.next is not None:\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:                    # compare the nodes with 'is': values may repeat\n            return slow\n    return None                             # fast reached the end: no cycle\n\n\ndef has_cycle(head):\n    \"\"\"A cycle exists exactly when the two pointers meet.\"\"\"\n    return meeting_point(head) is not None\n\n\ndef cycle_start_index(head):\n    \"\"\"From head and from the meeting point, step both by one; they meet at the cycle entry.\"\"\"\n    meet = meeting_point(head)\n    if meet is None:\n        return -1\n    pointer = head                          # restart one pointer at the head, keep the other\n    index = 0\n    while pointer is not meet:\n        pointer = pointer.next\n        meet = meet.next\n        index += 1\n    return index\n\n\n# --- try it: change the inputs and run ---\nprint(list_to_array(build_list([3, 2, 0, -4], 1)))     # -> [3, 2, 0, -4]\nprint(has_cycle(build_list([3, 2, 0, -4], 1)))         # -> True\nprint(cycle_start_index(build_list([3, 2, 0, -4], 1))) # -> 1\nprint(cycle_start_index(build_list([1, 2], 0)))        # -> 0\nprint(has_cycle(build_list([1, 2, 3])))                # -> False\nprint(cycle_start_index(build_list([1, 2, 3])))        # -> -1\nprint(cycle_start_index(build_list([])))               # -> -1\n", "pseudo": "meeting_point(head):\n    slow = head, fast = head\n    while fast exists and fast.next exists:\n        slow = slow.next, fast = fast.next.next\n        if slow is the same node as fast: return slow   (compare nodes, values may repeat)\n    return empty\nhas_cycle(head) = meeting_point(head) is not empty\ncycle_start_index(head):\n    meet = meeting_point(head)\n    if meet is empty: return -1\n    pointer = head, index = 0   (restart one pointer at the head, keep the other)\n    while pointer is not meet: pointer = pointer.next, meet = meet.next, index += 1\n    return index"}, {"id": "fund-linked_lists-07_reverse_nodes_in_k_group", "name": "07_reverse_nodes_in_k_group", "area": "linked_lists", "title": "Reverse Nodes in k-Group", "key_ops": "probe k ahead, reverse one group with the next group as prev, re-hook, advance", "statement": "Reverse every k consecutive nodes of a singly linked list; a final group shorter than k is left as\nis. Only node links may change, not values. Per group: find its k-th node (stop if missing),\nreverse it with prev seeded to the node after it, then hook the node before it to the new head.\nExample: 1 -> 2 -> 3 -> 4 -> 5, k = 2 -> 2 -> 1 -> 4 -> 3 -> 5", "text": "Reverse nodes in k-group reverses each run of k nodes, leaving a short final run alone, by relinking rather than copying values. Per group, probe k ahead from the node before it and stop if the list ends; then run the usual three-pointer reverse over just that group with prev seeded to the node after the group; finally hook the node before the group to the k-th node and advance to the old head, now the tail. Forgetting that seed leaves the group dangling. O(n) time, O(1) space.", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Turn a linked list back into a Python list.\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef kth_node(node, k):\n    \"\"\"The node k steps after node, or None if the list ends first.\"\"\"\n    for _ in range(k):\n        node = node.next\n        if node is None:\n            return None\n    return node\n\n\ndef reverse_k_group(head, k):\n    \"\"\"Probe k ahead; reverse the group with prev seeded to the next group; re-hook. O(n), O(1).\"\"\"\n    dummy = ListNode(0, head)\n    group_prev = dummy                      # the node just before the current group\n    while True:\n        kth = kth_node(group_prev, k)\n        if kth is None:                     # fewer than k nodes left: leave them as they are\n            return dummy.next\n        group_next = kth.next\n        prev = group_next              # seed prev with the next group: the old head links to it\n        cur = group_prev.next\n        while cur is not group_next:        # the usual three-pointer reverse, stopped early\n            nxt = cur.next\n            cur.next = prev\n            prev = cur\n            cur = nxt\n        old_head = group_prev.next\n        group_prev.next = kth               # kth is the reversed group's new head\n        group_prev = old_head               # the old head is now the group's tail\n\n\n# --- try it: change the inputs and run ---\nprint(list_to_array(reverse_k_group(build_list([1, 2, 3, 4, 5]), 2)))   # -> [2, 1, 4, 3, 5]\nprint(list_to_array(reverse_k_group(build_list([1, 2, 3, 4, 5]), 3)))   # -> [3, 2, 1, 4, 5]\nprint(list_to_array(reverse_k_group(build_list([1, 2, 3, 4]), 1)))      # -> [1, 2, 3, 4]\nprint(list_to_array(reverse_k_group(build_list([1, 2, 3, 4]), 4)))      # -> [4, 3, 2, 1]\nprint(list_to_array(reverse_k_group(build_list([1, 2]), 3)))            # -> [1, 2]\n", "pseudo": "dummy = new node pointing at head, group_prev = dummy\nloop:\n    kth = the node k steps after group_prev\n    if kth is empty: return dummy.next   (fewer than k nodes left: leave them)\n    group_next = kth.next\n    prev = group_next, cur = group_prev.next   (seed prev with the next group)\n    while cur is not group_next:\n        nxt = cur.next, cur.next = prev, prev = cur, cur = nxt\n    old_head = group_prev.next\n    group_prev.next = kth   (kth is the reversed group's new head)\n    group_prev = old_head   (the old head is now the group's tail)"}]}, {"id": "fund-trees", "topic": "trees", "title": "Trees", "intro": "A tree is a node with children, and the moment a node has two, loops give way to recursion. This chapter teaches how\nto write a function for a node by trusting it on the children: returning one value up, carrying state down, walking\ntwo trees in lockstep, sweeping by level with a queue, and exploiting the sorted order of a binary search tree.", "background": [{"title": "What it is", "md": "A binary tree is either **empty**, or a **node** holding a value and two binary trees, called left and right. Read that\ndefinition twice: it mentions itself. A tree is a node plus two smaller trees. Everything in this chapter is that sentence\nturned into code.\n\n```text\n        3            the shape:  node 3, plus\n       / \\           left tree  = {9}\n      9   20         right tree = {20, 15, 7}\n         /  \\        and 20 is itself a node plus\n        15   7       two smaller trees {15} and {7}\n```\n\nIn memory there is no \"tree\" object. There are node objects, each holding a value and two pointers. A missing child is\n`None`. The tree is whatever you can reach from the root pointer.\n\n```text\n root\n  |\n  v\n +-----+------+-------+\n | 3   | left | right |\n +-----+--|---+---|---+\n          |       +---------------+\n          v                       v\n +-----+------+-------+   +------+------+-------+\n | 9   | None | None  |   | 20   | left | right |\n +-----+------+-------+   +------+--|---+---|---+\n                                    v       v\n                                 [15 . .] [7 . .]\n```\n\nLeetCode writes trees as a level-order list with `null` for missing children: `[3,9,20,null,null,15,7]`. Read it row by\nrow: 3; then its children 9, 20; then 9's children null, null; then 20's children 15, 7. Trailing nulls are dropped.\n\n```text\nindex:  0  1  2   3     4     5   6\nlist:  [3, 9, 20, null, null, 15, 7]\n        |  \\__/   \\_________/ \\___/\n       root kids  kids of 9   kids of 20\n                  (both gone)\n```\n\n**Trust the call on the child.** To compute something for a node, pretend the function already returns the right\nanswer for the left tree and for the right tree. Your only job is to combine those two answers with the node itself,\nand to handle the empty tree. You never trace the whole recursion in your head. The recursion mirrors the shape: one\ncall per node, the call tree of the program is the tree itself.\n\n```text\n   f(3) = combine(3, f(left), f(right))\n           |          |          |\n           |       trust it   trust it\n           +-- your only job: this line, plus f(None)\n```\n\n**Three orders of visiting.** A recursive walk reaches each node three times: before its left subtree, between the two\nsubtrees, and after both. Doing your work at one of those moments gives pre-order, in-order or post-order.\n\n```text\n          1          pre-order  (node, L, R):  1 2 4 5 3\n         / \\         in-order   (L, node, R):  4 2 5 1 3\n        2   3        post-order (L, R, node):  4 5 2 3 1\n       / \\\n      4   5          level order (by rows):    1 | 2 3 | 4 5\n\n   the walk touches node 2 three times:\n     pre  : arrive at 2 from 1, going down\n     in   : come back up from 4, about to go to 5\n     post : come back up from 5, about to leave for 1\n```\n\nPre-order is for passing information **down** (a running sum, the path so far). Post-order is for passing information\n**up** (heights, counts, \"found it\"). In-order matters for binary search trees, where it visits values in sorted order.\n\n**The post-order template.** Most problems in the first half of this chapter have the same skeleton: a helper returns a\nvalue to the parent, and while it holds both children's values it records a candidate answer in a variable outside the\nrecursion.\n\n```text\n            parent  <-- receives ONE value (e.g. height)\n              ^\n              | return up: what the parent can extend\n           [ node ]\n           /      \\\n        L-value  R-value\n              |\n              v\n       record on the side: best = max(best, L + R)\n       (answer that BENDS here; parent cannot extend it)\n```\n\nWhat goes up and what gets recorded are usually different things, and confusing them is the classic bug. Diameter and\nmaximum path sum are the cleanest examples.\n\n**Breadth-first by level.** Some questions are about rows: \"the rightmost node of each level\", \"the average of each\nlevel\". A queue processes the tree row by row. Snapshot the queue's length at the start of a row; pop exactly that many,\npushing their children to the back.\n\n```text\ntree:   1         queue before row     row popped    pushed\n       / \\        [1]                  1             2 3\n      2   3       [2, 3]               2 3           4 5\n     / \\          [4, 5]               4 5           -\n    4   5         []                   done\n```\n\n**Binary search trees.** A BST adds one ordering rule: every value in the left subtree is smaller than the node, every\nvalue in the right subtree is larger. That makes in-order traversal emit sorted values, and lets a search discard half\nthe tree at every step.\n\n```text\n        8           in-order: 1 3 6 8 10 14  (sorted)\n       / \\\n      3   10        search 6: 6<8 go left, 6>3 go right, found\n     / \\    \\\n    1   6    14\n```"}, {"title": "Operations and what they cost", "md": "| Operation | Time | Why |\n|---|---|---|\n| Visit every node (any order) | O(n) | each node is entered once |\n| Recursion stack of a DFS | O(h) | one frame per level on the current path |\n| BFS queue | O(w) | at most one full level, width w |\n| Height of a tree | O(n) | post-order, one visit per node |\n| Search / insert in a BST | O(h) | one comparison per level, then go one way |\n| In-order of a BST | O(n) | sorted output with no sort |\n| Build from level-order list | O(n) | queue hands out child slots in order |\n| Compare two trees | O(min(n, m)) | stops at the first mismatch |\n\n**Height versus size.** n is the number of nodes, h the number of levels. The same n can give very different h.\n\n```text\n balanced, n = 7, h = 3        skewed, n = 4, h = 4\n         4                     1\n       /   \\                    \\\n      2     6                    2\n     / \\   / \\                    \\\n    1   3 5   7                    3\n                                    \\\n  h ~ log2(n + 1)                    4      h = n\n```\n\nEvery \"O(h)\" in this chapter means O(log n) on a balanced tree and O(n) on a stick. Interviewers ask about the stick.\n\n**Recursion depth is the call stack.** When the recursion is at a node, every ancestor of that node has a paused frame\nwaiting for it. The stack is the path from the root to where you are.\n\n```text\n tree           while visiting 15, the stack is:\n    3            +----------------------+\n   / \\           | f(15)   <- running   |\n  9   20         | f(20)   waiting on R |\n     /  \\        | f(3)    waiting on R |\n    15   7       +----------------------+\n                 depth 3 = path 3 -> 20 -> 15\n```\n\nPython allows about 1000 frames by default. A skewed tree of 10^4 nodes crashes a naive recursion; either raise the limit\nor rewrite with an explicit stack that holds exactly these frames."}, {"title": "The invariant", "md": "**Every recursive call returns the correct answer for the subtree rooted at its node, and uses nothing but that subtree\nplus whatever was handed down from the parent.** If that holds for the two children, combining correctly makes it hold\nfor the node; the empty tree is the base. That is induction on the shape, and it is how you prove every solution here.\n\n```text\n legal: f uses only its subtree       illegal: f peeks sideways\n                                         or relies on a global\n     [ f(node) ]                         that a cousin changed\n      /       \\\n  f(L) ok    f(R) ok                    [ f(2) ] ----> reads 7?\n                                         /   \\\n  combine(node, f(L), f(R))             4     5        7 is not\n                                                       below 2\n```\n\nFor BSTs the invariant is the ordering, and it is **global**, not parent-to-child:\n\n```text\n legal BST             illegal: every parent-child pair looks\n                       fine, but 9 sits in 8's LEFT subtree\n     8                        8\n    / \\                      / \\\n   3   10                   3   10\n  / \\                      / \\\n 1   6                    1   9   <- 9 > 3 ok locally,\n                                     9 > 8 breaks the rule\n```"}, {"title": "Python toolbox", "md": "```python\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val, self.left, self.right = val, left, right\n\nfrom collections import deque\nq = deque([root])                    # BFS; popleft() is O(1)\nfor _ in range(len(q)): node = q.popleft()   # one level\n\nimport sys; sys.setrecursionlimit(10**5)     # deep skewed trees\n\nstack, node = [], root               # iterative in-order\nwhile stack or node:\n    while node: stack.append(node); node = node.left\n    node = stack.pop(); visit(node); node = node.right\n\nbest = float('-inf')                 # side-channel answer\ndef go(n):                            # inside a method use\n    nonlocal best                     # nonlocal or self.best\n```\n\n`list.pop(0)` is O(n), never use it as a queue. Default arguments like `path=[]` are shared across calls; pass the list\nexplicitly. `a is b` on two possibly-`None` nodes is the cleanest \"both empty\" test."}, {"title": "Mistakes people make", "md": "- Returning 1 for an empty tree in a height function. Fix: `None` is height 0, a leaf is 1.\n- Counting nodes when the question counts edges (diameter). Fix: write the unit next to the return statement.\n- Returning the recorded answer upward instead of the extendable value. Fix: return `1 + max(L, R)`, record `L + R`.\n- Swapping children with two plain assignments, losing one. Fix: tuple-assign both at once.\n- Checking BST validity only against the parent. Fix: pass down (low, high) bounds.\n- Treating \"leaf\" as \"has no left child\". Fix: a leaf has neither child.\n- Comparing node values before checking for `None`. Fix: handle `None` first.\n- Using `list.pop(0)` for BFS. Fix: `collections.deque.popleft()`.\n- Mutating a shared path list and appending it to results without copying. Fix: append `path[:]`, pop after recursing.\n- Recursing 10^4 deep in Python. Fix: raise the recursion limit or use an explicit stack."}], "items": [{"id": "fund-trees-01_traversals_recursive_and_iterative", "name": "01_traversals_recursive_and_iterative", "area": "trees", "title": "Tree Traversals, Recursive and Iterative", "key_ops": "visit before/between/after the children, push right then left, push-left-then-pop", "statement": "Return the preorder, inorder and postorder of a binary tree. One recursive walk records all three;\nan explicit stack reproduces preorder (push the right child before the left) and inorder (walk left\npushing, pop, visit, go right).\nExample: [1, 2, 3, 4, 5, None, 6] -> preorder [1, 2, 4, 5, 3, 6], inorder [4, 2, 5, 1, 3, 6],\npostorder [4, 5, 2, 6, 3, 1]", "text": "Preorder, inorder and postorder differ only in where the visit sits relative to the two recursive child calls: before, between or after. Inorder on a binary search tree gives sorted values. Iterative preorder uses a stack and pushes the right child before the left so the left pops first; iterative inorder walks left pushing every node, pops and visits, then moves right. Pushing children in the wrong order is the usual slip. O(n) time, O(h) stack space.", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef traverse(node, preorder, inorder, postorder):\n    \"\"\"One recursive walk; where the visit sits relative to the child calls picks the order.\"\"\"\n    if node is None:\n        return\n    preorder.append(node.val)                 # before both children\n    traverse(node.left, preorder, inorder, postorder)\n    inorder.append(node.val)                  # between the children\n    traverse(node.right, preorder, inorder, postorder)\n    postorder.append(node.val)                # after both children\n\n\ndef all_orders(root):\n    \"\"\"Run the walk once and return (preorder, inorder, postorder).\"\"\"\n    preorder = []\n    inorder = []\n    postorder = []\n    traverse(root, preorder, inorder, postorder)\n    return preorder, inorder, postorder\n\n\ndef preorder_iterative(root):\n    \"\"\"Explicit stack: pop a node, visit it, push its children right then left. O(n).\"\"\"\n    order = []\n    stack = []\n    if root is not None:\n        stack.append(root)\n    while len(stack) > 0:\n        node = stack.pop()\n        order.append(node.val)\n        if node.right is not None:            # push the RIGHT child first ...\n            stack.append(node.right)\n        if node.left is not None:             # ... so the left child is on top and pops next\n            stack.append(node.left)\n    return order\n\n\ndef inorder_iterative(root):\n    \"\"\"Walk left pushing every node, pop and visit the top, then move to its right child. O(n).\"\"\"\n    order = []\n    stack = []\n    node = root\n    while len(stack) > 0 or node is not None:  # a node to walk down from OR a node still pending\n        while node is not None:\n            stack.append(node)\n            node = node.left\n        node = stack.pop()\n        order.append(node.val)\n        node = node.right\n    return order\n\n\n# --- try it: change the inputs and run ---\nroot = build_tree([1, 2, 3, 4, 5, None, 6])\nprint(all_orders(root))   # -> ([1, 2, 4, 5, 3, 6], [4, 2, 5, 1, 3, 6], [4, 5, 2, 6, 3, 1])\nprint(preorder_iterative(root))     # -> [1, 2, 4, 5, 3, 6]\nprint(inorder_iterative(root))      # -> [4, 2, 5, 1, 3, 6]\nprint(all_orders(build_tree([1, None, 2, 3])))      # -> ([1, 2, 3], [1, 3, 2], [3, 2, 1])\nprint(inorder_iterative(build_tree([1, None, 2, 3])))   # -> [1, 3, 2]\nprint(preorder_iterative(build_tree([])))           # -> []\n", "pseudo": "traverse(node, preorder, inorder, postorder):\n    if node is empty: return\n    add node.val to preorder   (before both children)\n    traverse(node.left, ...)\n    add node.val to inorder   (between the children)\n    traverse(node.right, ...)\n    add node.val to postorder   (after both children)\npreorder_iterative(root):\n    order = empty, stack = [root] if root exists\n    while stack is not empty:\n        node = pop, add node.val to order\n        push node.right if it exists, then node.left   (right first so left pops next)\n    return order\ninorder_iterative(root):\n    order = empty, stack = empty, node = root\n    while stack is not empty or node exists:   (a node to walk down from OR one still pending)\n        while node exists: push node, node = node.left\n        node = pop, add node.val to order\n        node = node.right\n    return order"}, {"id": "fund-trees-02_bfs_level_order_and_height", "name": "02_bfs_level_order_and_height", "area": "trees", "title": "Level Order and Height", "key_ops": "range(len(queue)) drains one level, popleft, push children, levels count as height", "statement": "Return the values of a binary tree level by level, and its height counted in levels (number of\nnodes on the longest root-to-leaf path; an empty tree has height 0). The queue holds exactly one\nlevel at a time: drain the nodes in it when the level starts, their children form the next level.\nExample: [3, 9, 20, None, None, 15, 7] -> levels [[3], [9, 20], [15, 7]], height 3", "text": "Level order traversal lists a binary tree's values level by level using a queue. The trick is to drain exactly the nodes in the queue when the level starts, a loop of range(len(queue)); their children go in for the next round. Height in levels then falls out as the number of rounds, with an empty tree at 0 and a single node at 1. People re-read the queue length inside the loop instead of fixing it once, which mixes levels. O(n) time, O(w) space for the widest level.", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef level_order(root):\n    \"\"\"BFS where the queue holds exactly one level; drain len(queue) nodes per round. O(n).\"\"\"\n    levels = []\n    queue = deque()                     # deque: popleft is O(1)\n    if root is not None:\n        queue.append(root)\n    while len(queue) > 0:\n        level = []\n        for _ in range(len(queue)):     # only the nodes present when the level starts\n            node = queue.popleft()\n            level.append(node.val)\n            if node.left is not None:   # the children join the queue for the next round\n                queue.append(node.left)\n            if node.right is not None:\n                queue.append(node.right)\n        levels.append(level)\n    return levels\n\n\ndef height(root):\n    \"\"\"Height in levels = number of BFS rounds; an empty tree has height 0, a single node 1.\"\"\"\n    return len(level_order(root))\n\n\n# --- try it: change the inputs and run ---\nprint(level_order(build_tree([3, 9, 20, None, None, 15, 7])))   # -> [[3], [9, 20], [15, 7]]\nprint(height(build_tree([3, 9, 20, None, None, 15, 7])))        # -> 3\nprint(level_order(build_tree([1, None, 2, None, 3])))           # -> [[1], [2], [3]]\nprint(height(build_tree([1])))                                  # -> 1\nprint(level_order(build_tree([])))                              # -> []\nprint(height(build_tree([])))                                   # -> 0\n", "pseudo": "levels = empty list, queue = [root] if root exists\nwhile queue is not empty:\n    level = empty list\n    repeat len(queue) times:   (only the nodes present when the level starts)\n        node = pop from the front\n        add node.val to level\n        append node.left and node.right if they exist   (they form the next level)\n    add level to levels\nreturn levels\nheight(root) = number of levels   (empty tree 0, single node 1)"}, {"id": "fund-trees-03_bst_insert_search_delete", "name": "03_bst_insert_search_delete", "area": "trees", "title": "BST Insert, Search, Delete", "key_ops": "descend by comparison, attach a leaf, splice out a 0/1-child node, successor swap", "statement": "Maintain a binary search tree (every value in the left subtree is smaller, in the right subtree\nbigger; duplicates are ignored). Each operation walks one root-to-leaf path, so it costs O(height),\nand the inorder traversal reads the values back in sorted order.\nExample: insert 5, 3, 8, 1, 4, 9; search 4; delete 3; delete 5; search 3\n-> searches [True, False], inorder [1, 4, 8, 9]", "text": "A binary search tree keeps smaller values left and larger values right, so search, insert and delete each walk one root-to-leaf path and inorder reads the values back sorted. Insert attaches a new leaf where the walk falls off. Delete splices out a node with at most one child; for two children it copies the inorder successor, the leftmost node of the right subtree, then deletes the successor from the right subtree. Deleting the original value instead of the successor's is the classic bug. O(h) per operation.", "py": "class TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef insert(root, val):\n    \"\"\"Descend by comparison; attach the new value as a leaf where the walk falls off. O(h).\"\"\"\n    if root is None:\n        return TreeNode(val)\n    if val < root.val:\n        root.left = insert(root.left, val)\n    elif val > root.val:\n        root.right = insert(root.right, val)\n    return root                             # equal: a duplicate, nothing changes\n\n\ndef search(root, val):\n    \"\"\"Walk down one path: left when smaller, right when bigger. O(height).\"\"\"\n    node = root\n    while node is not None:\n        if val == node.val:\n            return True\n        if val < node.val:\n            node = node.left\n        else:\n            node = node.right\n    return False\n\n\ndef smallest(node):\n    \"\"\"Leftmost node of a subtree: the inorder successor of the node above it.\"\"\"\n    while node.left is not None:\n        node = node.left\n    return node\n\n\ndef delete(root, val):\n    \"\"\"Find the node; 0 or 1 child: the child takes its place; 2 children: copy the successor.\"\"\"\n    if root is None:\n        return None\n    if val < root.val:\n        root.left = delete(root.left, val)\n    elif val > root.val:\n        root.right = delete(root.right, val)\n    elif root.left is None:                 # at most one child: splice the node out\n        return root.right\n    elif root.right is None:\n        return root.left\n    else:\n        successor = smallest(root.right)\n        root.val = successor.val\n        root.right = delete(root.right, successor.val)   # delete the SUCCESSOR's value, not val\n    return root\n\n\ndef inorder(root):\n    \"\"\"Left, node, right: sorted order for a BST. O(n).\"\"\"\n    if root is None:\n        return []\n    return inorder(root.left) + [root.val] + inorder(root.right)\n\n\ndef build_bst(values):\n    \"\"\"Insert the values one by one into an empty tree.\"\"\"\n    root = None\n    for val in values:\n        root = insert(root, val)\n    return root\n\n\n# --- try it: change the inputs and run ---\nroot = build_bst([5, 3, 8, 1, 4, 9])\nprint(inorder(root))                                   # -> [1, 3, 4, 5, 8, 9]\nprint(search(root, 4))                                 # -> True\nroot = delete(root, 3)\nprint(inorder(root))                                   # -> [1, 4, 5, 8, 9]\nroot = delete(root, 5)\nprint(inorder(root))                                   # -> [1, 4, 8, 9]\nprint(search(root, 3))                                 # -> False\nprint(inorder(build_bst([2, 2, 1])))                   # -> [1, 2]\nprint(inorder(delete(build_bst([1, 2, 3]), 2)))        # -> [1, 3]\nprint(inorder(delete(build_bst([2, 1, 3]), 2)))        # -> [1, 3]\n", "pseudo": "insert(root, val):\n    if root is empty: return a new node(val)\n    if val < root.val: root.left = insert(root.left, val)\n    else if val > root.val: root.right = insert(root.right, val)\n    return root   (equal: a duplicate, nothing changes)\nsearch(root, val):\n    node = root\n    while node exists and node.val != val: node = node.left if val < node.val else node.right\n    return node exists\ndelete(root, val):\n    if root is empty: return empty\n    if val < root.val: root.left = delete(root.left, val)\n    else if val > root.val: root.right = delete(root.right, val)\n    else if root.left is empty: return root.right   (0 or 1 child: the child takes its place)\n    else if root.right is empty: return root.left\n    else:\n        successor = leftmost node of root.right\n        root.val = successor.val\n        root.right = delete(root.right, successor.val)   (delete the SUCCESSOR's value, not val)\n    return root"}, {"id": "fund-trees-04_balanced_and_depth", "name": "04_balanced_and_depth", "area": "trees", "title": "Balanced Binary Tree", "key_ops": "post-order height, pass -1 upward as soon as a subtree fails, abs(left - right) > 1", "statement": "The depth (height) of a tree is 1 + the taller child's depth, computed bottom up. A tree is\nheight-balanced when at every node the two subtree heights differ by at most 1: the same bottom-up\nwalk returns the height, or -1 the moment any subtree fails, so the check costs one O(n) pass.\nExample: [3, 9, 20, None, None, 15, 7] -> True; [1, 2, 2, 3, 3, None, None, 4, 4] -> False", "text": "Depth is one more than the taller child's depth, computed bottom up, empty tree at 0. A tree is height-balanced when at every node the two subtree heights differ by at most 1. The one-pass check reuses the height walk: it returns the height for a balanced subtree and -1 the moment any subtree fails, passing that -1 straight up. The mistake is calling a separate height function at every node, or treating a difference of exactly 1 as unbalanced. O(n) time, O(h) space.", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef max_depth(node):\n    \"\"\"Post-order: a node is one level above its taller child; an empty tree has depth 0. O(n).\"\"\"\n    if node is None:\n        return 0\n    return 1 + max(max_depth(node.left), max_depth(node.right))\n\n\ndef checked_height(node):\n    \"\"\"The height of a balanced subtree, or -1 as soon as any subtree is unbalanced. O(n).\"\"\"\n    if node is None:\n        return 0\n    left = checked_height(node.left)\n    if left == -1:\n        return -1                           # pass the failure straight up, no more work\n    right = checked_height(node.right)\n    if right == -1:\n        return -1\n    if abs(left - right) > 1:               # a difference of exactly 1 is still balanced\n        return -1\n    return 1 + max(left, right)\n\n\ndef is_balanced(root):\n    \"\"\"Balanced unless the height walk reported -1.\"\"\"\n    return checked_height(root) != -1\n\n\n# --- try it: change the inputs and run ---\nprint(max_depth(build_tree([3, 9, 20, None, None, 15, 7])))      # -> 3\nprint(is_balanced(build_tree([3, 9, 20, None, None, 15, 7])))    # -> True\nprint(is_balanced(build_tree([1, 2, 2, 3, 3, None, None, 4, 4])))   # -> False\nprint(is_balanced(build_tree([1, 2])))                           # -> True\nprint(max_depth(build_tree([1, None, 2, None, 3])))              # -> 3\nprint(is_balanced(build_tree([1, None, 2, None, 3])))            # -> False\nprint(is_balanced(build_tree([])))                               # -> True\n", "pseudo": "max_depth(node):\n    if node is empty: return 0\n    return 1 + max(max_depth(node.left), max_depth(node.right))\nchecked_height(node):\n    if node is empty: return 0\n    left = checked_height(node.left)\n    if left == -1: return -1   (pass the failure straight up, no more work)\n    right = checked_height(node.right)\n    if right == -1: return -1\n    if |left - right| > 1: return -1   (a difference of exactly 1 is still balanced)\n    return 1 + max(left, right)\nis_balanced(root) = checked_height(root) != -1"}, {"id": "fund-trees-06_serialize_and_deserialize", "name": "06_serialize_and_deserialize", "area": "trees", "title": "Serialize and Deserialize Binary Tree", "key_ops": "preorder emit, '#' for None, consume tokens from one queue, build left then right", "statement": "Turn a binary tree into a string and the string back into the same tree. Preorder with an explicit\n'#' for every missing child is unambiguous, so decoding consumes the tokens in the same order: take\none token, build the node, then its left subtree, then its right subtree.\nExample: [1, 2, 3, None, None, 4, 5] -> \"1,2,#,#,3,4,#,#,5,#,#\" -> the same tree", "text": "Serialize turns a binary tree into a string and deserialize rebuilds it. Preorder with an explicit marker like # for every missing child is unambiguous, so encoding emits the value, then the left subtree, then the right, and decoding consumes tokens from one shared deque in the same order: take a token, build the node, then its left subtree, then its right. People forget the separator, which merges 12 and -3 into 1, 2, 3, or skip the None markers, which loses the shape. O(n) time and space.", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef tree_to_list(root):\n    \"\"\"Tree -> level-order list with None for missing children, trailing Nones removed.\"\"\"\n    out = []\n    queue = deque([root])\n    while len(queue) > 0:\n        node = queue.popleft()\n        if node is None:\n            out.append(None)\n        else:\n            out.append(node.val)\n            queue.append(node.left)\n            queue.append(node.right)\n    while len(out) > 0 and out[-1] is None:\n        out.pop()\n    return out\n\n\ndef emit(node, tokens):\n    \"\"\"Preorder: the value, then the left subtree, then the right; '#' marks a missing child.\"\"\"\n    if node is None:\n        tokens.append(\"#\")                  # the explicit None is what makes decoding unambiguous\n        return\n    tokens.append(str(node.val))\n    emit(node.left, tokens)\n    emit(node.right, tokens)\n\n\ndef serialize(root):\n    \"\"\"Tree -> comma-joined preorder tokens. O(n).\"\"\"\n    tokens = []\n    emit(root, tokens)\n    return \",\".join(tokens)                 # a separator keeps 12 and -3 apart from 1, 2, 3\n\n\ndef consume(tokens):\n    \"\"\"Take the next token from the shared queue; '#' closes a branch, anything else is a node.\"\"\"\n    token = tokens.popleft()                # every call eats from the same queue, in preorder\n    if token == \"#\":\n        return None\n    node = TreeNode(int(token))\n    node.left = consume(tokens)             # the left subtree uses up its tokens first ...\n    node.right = consume(tokens)            # ... then the right subtree starts where it stopped\n    return node\n\n\ndef deserialize(data):\n    \"\"\"Comma-joined tokens -> tree, consumed in the same preorder they were emitted. O(n).\"\"\"\n    tokens = deque(data.split(\",\"))         # deque: popleft is O(1)\n    return consume(tokens)\n\n\n# --- try it: change the inputs and run ---\nprint(serialize(build_tree([1, 2, 3, None, None, 4, 5])))              # -> 1,2,#,#,3,4,#,#,5,#,#\nprint(tree_to_list(deserialize(\"1,2,#,#,3,4,#,#,5,#,#\")))      # -> [1, 2, 3, None, None, 4, 5]\nprint(serialize(build_tree([12, -3])))                                 # -> 12,-3,#,#,#\nprint(tree_to_list(deserialize(serialize(build_tree([12, -3])))))      # -> [12, -3]\nprint(serialize(build_tree([])))                                       # -> #\nprint(tree_to_list(deserialize(\"#\")))                                  # -> []\n", "pseudo": "emit(node, tokens):\n    if node is empty: add \"#\" to tokens, return   (the explicit None makes decoding unambiguous)\n    add str(node.val) to tokens\n    emit(node.left, tokens)\n    emit(node.right, tokens)\nserialize(root): tokens = empty, emit(root, tokens), return tokens joined by \",\"\nconsume(tokens):\n    token = pop from the front   (every call eats from the same queue, in preorder)\n    if token == \"#\": return empty\n    node = new node(int(token))\n    node.left = consume(tokens)   (the left subtree uses up its tokens first)\n    node.right = consume(tokens)\n    return node\ndeserialize(data): tokens = queue of data split on \",\", return consume(tokens)"}]}, {"id": "fund-tries", "topic": "tries", "title": "Tries", "intro": "A trie stores a set of strings as a tree of characters, so every shared prefix is one shared path. This chapter\nteaches prefix lookups, wildcard matching down a forking walk, using a trie to prune a backtracking search, rewriting\nsuffix questions as prefix questions, and storing payloads in nodes so that reaching a node is the answer.", "background": [{"title": "What it is", "md": "Take three words: `app`, `apple`, `apt`. Write them on top of each other and you notice they share their first two letters, and two of them share three. A trie stores that sharing literally: one node per distinct prefix, one edge per character.\n\n```text\n            (root)          prefix \"\"\n              |\n              a             prefix \"a\"\n              |\n              p             prefix \"ap\"\n            /   \\\n           p*    t*         \"app\" is a word, \"apt\" is a word\n           |\n           l                \"appl\" (not a word)\n           |\n           e*               \"apple\" is a word\n\n   *  = end marker: \"a stored word ends at this node\"\n```\n\nTwo facts carry the whole chapter. First, a node does not store its letter in any useful sense; the letter lives on the edge from its parent, and the node *is* a prefix, namely the letters read on the path from the root. Second, a node existing means \"some stored word starts with this prefix\"; the star means \"this exact prefix is itself a stored word\". `ap` exists but has no star: it is a prefix of words but not a word.\n\nIn Python we do not build node classes. A node is a dict mapping a character to a child dict, and the end marker is a special key, `\"$\"`, that can never be a real letter. This is the memory layout of the drawing above, exactly as the solution files build it:\n\n```text\nroot = {\n  \"a\": {                         node for \"a\"\n    \"p\": {                       node for \"ap\"\n      \"p\": {                     node for \"app\"\n        \"$\": True,               <- end marker: \"app\"\n        \"l\": {                   node for \"appl\"\n          \"e\": {\"$\": True}       node for \"apple\"\n        }\n      },\n      \"t\": {\"$\": True}           node for \"apt\"\n    }\n  }\n}\n```\n\nEvery `{` is a node; every key that is a letter is an edge; `\"$\"` is the star. Walking the string `\"app\"` is the chain of lookups `root[\"a\"][\"p\"][\"p\"]`. That one line is the most important thing to be able to picture: **a walk is a chain of dict lookups, one per character.**\n\nWhy bother? Count the work. Store `app`, `apple`, `apt` in a list and check whether anything starts with `ap`: you compare `ap` against all three words, re-reading the letters `a`, `p` three times. In the trie, `a` and `p` are stored once and read once. With a thousand words starting with `ap`, the list re-reads `ap` a thousand times; the trie still reads it once. Shared prefixes are stored once and therefore *checked* once. That is the whole saving.\n\nHow big does it get? The number of nodes is at most the total number of characters inserted, plus one for the root. It is usually far fewer, because every shared prefix collapses into one path:\n\n```text\n words            total chars    trie nodes (excl. root)\n app,apple,apt    3+5+3 = 11     a,ap,app,appl,apple,apt = 6\n cat,car,cart     3+3+4 = 10     c,ca,cat,car,cart       = 5\n dog,cat          3+3   =  6     d,do,dog,c,ca,cat       = 6\n                                 (no sharing: worst case)\n```\n\nSo space is O(total characters) in the worst case, and the dict overhead per node is the real constant you pay."}, {"title": "Operations and what they cost", "md": "Let L be the length of the string in the operation.\n\n| Operation | Time | Why |\n|---|---|---|\n| insert(word) | O(L) | one dict lookup or creation per character, then set `\"$\"` |\n| search(word) | O(L) | walk L edges, then check `\"$\"` at the last node |\n| startsWith(prefix) | O(L) | walk L edges; existing at all is the answer |\n| walk-until-first-marker | O(L) | stop at the first `\"$\"` met on the path (shortest stored prefix) |\n| wildcard search | O(nodes visited) | each `.` tries every child; bounded by the trie size |\n| list all words under a prefix | O(L + subtree size) | walk to the node, then DFS its subtree |\n| read payload at a prefix | O(L) | walk, then read what the node stores (index, list, map) |\n\n**Insert** `apt` into a trie holding only `app`. The walk reuses what exists and creates what is missing:\n\n```text\n step  char  at node   action               trie after\n 1     a     root      \"a\" exists, follow   root-a-p-p*\n 2     p     \"a\"       \"p\" exists, follow   root-a-p-p*\n 3     t     \"ap\"      \"t\" missing, CREATE  root-a-p-p*\n                                                 \\-t\n 4     end   \"apt\"     set \"$\" = True            \\-t*\n```\n\nIn code that is `node = node.setdefault(ch, {})` per character, then `node[\"$\"] = True`.\n\n**Search** and **startsWith** share the same walk and differ only at the last node:\n\n```text\n query           walk                 last node   answer\n search(\"app\")   root>a>p>p           has \"$\"     True\n search(\"ap\")    root>a>p             no \"$\"      False\n startsWith(\"ap\")root>a>p             exists      True\n search(\"apz\")   root>a>p> z missing  (fell off)  False\n startsWith(\"b\") root> b missing      (fell off)  False\n```\n\nFalling off the tree \u2014 a missing edge \u2014 answers False for both. Reaching a node answers True for startsWith; search also needs the star.\n\n**Wildcard search** (`.` = any letter) turns the walk into a depth-first search. A literal letter follows one edge; a `.` sends a scout down every edge:\n\n```text\n pattern \".pt\" on the trie above\n root --.--> a        only child is \"a\": one scout\n a    --p--> ap       literal: one edge\n ap   --t--> apt*     literal: one edge, \"$\" present -> True\n```\n\n**List everything under a prefix** is walk-then-DFS: reach the node for `ap`, then visit its whole subtree, collecting every node with a star: `app`, `apple`, `apt`. This costs the size of the subtree, which is why later problems cache the answer at each node instead."}, {"title": "The invariant", "md": "**The node reached by walking a string s from the root exists if and only if some inserted word has s as a prefix; and it carries the end marker if and only if s itself was inserted.**\n\nEvery operation preserves this. Insert only creates nodes along the path of the word it inserts (each such node is a prefix of that word, so it is allowed to exist) and only marks the last one. Nothing else adds nodes. The two halves of the invariant are what search and startsWith read.\n\n```text\n LEGAL (words app, apt)        ILLEGAL\n     root                          root\n      |                             |\n      a                             a\n      |                             |\n      p                             p\n     / \\                           / \\\n    p*  t*                        p   t*     <- \"app\" inserted\n                                              but no \"$\": search\n                                              (\"app\") says False\n     root\n      |\n      a*    <- star on \"a\", but \"a\" was never inserted:\n              search(\"a\") lies and says True\n```\n\nIn later problems the invariant grows a third clause about payloads: \"the payload at the node for s summarises exactly the words that pass through s\" (their indices, their best index, their counts). The trickiest bugs in the hard problems are payloads that were not updated on every node along the path."}, {"title": "Python toolbox", "md": "Nested dicts are the idiomatic trie. `setdefault` inserts and walks in one call:\n\n```python\ntrie = {}\nfor w in words:\n    node = trie\n    for ch in w:\n        node = node.setdefault(ch, {})   # follow or create\n    node[\"$\"] = True                     # or = w, or an index\n```\n\nA walk that returns None when it falls off:\n\n```python\ndef walk(s):\n    node = trie\n    for ch in s:\n        node = node.get(ch)\n        if node is None:\n            return None\n    return node\n```\n\nUseful pieces: `defaultdict` gives a self-creating trie in one line (`T = lambda: defaultdict(T)`), but then a mere lookup creates nodes, which silently breaks the invariant \u2014 prefer `get` and `setdefault`. `heapq.nsmallest(k, items, key=...)` picks the top k from a node's payload without sorting it all. `collections.deque` with a bounded length holds the last L characters of a stream. Python's default recursion limit (1000) is never a problem for word-length recursion, but deep grid DFS on huge boards can approach it."}, {"title": "Mistakes people make", "md": "1. **No end marker.** After inserting only `apple`, `search(\"app\")` returns True. Fix: set `node[\"$\"]` at the last node and check it in search.\n2. **Marker collides with a letter.** Using `\"*\"` when the input may contain `*`. Fix: pick a key outside the alphabet, or use a node class with an `is_end` field.\n3. **Iterating over the marker as a child.** A wildcard loop recurses into `node[\"$\"]` (which is `True`, not a dict). Fix: skip the key `\"$\"` when looping over children.\n4. **Lookups that create nodes.** Using `setdefault` or a `defaultdict` in search adds empty branches. Fix: search with `get` / `in`; only insert creates.\n5. **Payload only at the terminal node.** A query that stops mid-path finds nothing. Fix: when a query can end anywhere, write the payload at every node along the inserted path.\n6. **Not stopping at the first marker** when the question wants the shortest prefix match (Replace Words, Stream). Fix: return as soon as a `\"$\"` is seen on the walk.\n7. **Building the trie forward when the question is about suffixes.** Fix: insert reversed words and walk the input backwards.\n8. **Emitting the same word twice** in a grid search when two paths spell it. Fix: remove the word from its node when found (`node.pop(\"$\")`).\n9. **Unbounded history** in a stream problem. Fix: keep only the last max-word-length characters.\n10. **Forgetting to reset per-query state** (an autocomplete cursor, a typed buffer) when the input says the query is over. Fix: reset both on the terminator."}], "items": [{"id": "fund-tries-02_trie_delete", "name": "02_trie_delete", "area": "tries", "title": "Trie: Delete a Word with Pruning", "key_ops": "path down, clear end flag, prune empty non-end nodes upward, stop at a shared node", "statement": "Insert words into a trie, then delete some of them. Deleting a word clears its end flag and\nremoves every node below the last shared point that no other word needs; a node is kept if it\nstill has children or ends another word. The trie is shown as a nested dict (\"$\" marks a word end).\nExample: words [apple, app, ape], delete [apple, app, cat] -> {'a': {'p': {'e': {'$': True}}}}", "text": "Deleting a word from a trie is more than clearing a flag: nodes no other word needs should be pruned. Walk down recording the path, clear the end flag at the last node, then unwind toward the root, deleting a child only while it has no children and does not end another word. At the first shared node, stop. People prune on the way down, or delete nodes that still end a shorter word like app inside apple. The cost is O(length of the word) in time and path space.", "py": "class TrieNode:\n    def __init__(self):\n        self.children = {}   # char -> TrieNode\n        self.end = False     # a word ends here\n\n\ndef trie_to_dict(node):\n    \"\"\"Nested dict view of the trie; \"$\" marks a word end.\"\"\"\n    view = {}\n    if node.end:\n        view[\"$\"] = True\n    for ch in node.children:\n        view[ch] = trie_to_dict(node.children[ch])\n    return view\n\n\ndef insert(root, word):\n    \"\"\"Walk down creating missing links, then flag the last node as a word end. O(len).\"\"\"\n    node = root\n    for ch in word:\n        if ch not in node.children:\n            node.children[ch] = TrieNode()\n        node = node.children[ch]\n    node.end = True\n\n\ndef build_trie(words):\n    \"\"\"Insert every word under a fresh root. O(total length).\"\"\"\n    root = TrieNode()\n    for word in words:\n        insert(root, word)\n    return root\n\n\ndef delete(root, word):\n    \"\"\"Record the path down, clear the end flag, prune empty non-end nodes upward. O(len).\"\"\"\n    path = [root]\n    node = root\n    for ch in word:\n        if ch not in node.children:\n            return False   # the word is not in the trie\n        node = node.children[ch]\n        path.append(node)\n    if not node.end:\n        return False   # the prefix exists but no word ends here\n    node.end = False\n    for i in range(len(word) - 1, -1, -1):   # unwind from the deepest node toward the root\n        parent = path[i]\n        child = path[i + 1]\n        if child.children or child.end:   # another word still needs this node: stop pruning\n            break\n        del parent.children[word[i]]\n    return True\n\n\n# --- try it: change the inputs and run ---\nroot = build_trie([\"app\", \"ape\"])\nprint(trie_to_dict(root))     # -> {'a': {'p': {'p': {'$': True}, 'e': {'$': True}}}}\ninsert(root, \"apple\")\nprint(delete(root, \"apple\"))  # -> True   (prunes 'l' and 'e'; 'app' still ends a word)\nprint(delete(root, \"app\"))    # -> True   (only the flag goes; 'ape' still needs 'a' and 'p')\nprint(delete(root, \"cat\"))    # -> False  (not in the trie)\nprint(delete(root, \"ap\"))     # -> False  (a prefix, not a stored word)\nprint(trie_to_dict(root))     # -> {'a': {'p': {'e': {'$': True}}}}\n", "pseudo": "insert(root, word):\n    node = root\n    for each ch in word:\n        if ch not a child of node: add a new child for ch\n        node = that child\n    mark node as a word end\nbuild_trie(words):\n    root = new node, insert every word, return root\ndelete(root, word):\n    path = [root], node = root\n    for each ch in word:\n        if ch not a child of node: return false   (the word is not in the trie)\n        node = that child, append node to path\n    if node is not a word end: return false\n    clear the end flag of node\n    for i from last index of word down to 0:\n        parent = path[i], child = path[i + 1]\n        if child has children or ends a word: stop   (another word still needs it)\n        remove word[i] from parent's children\n    return true"}, {"id": "fund-tries-03_autocomplete_collect_words_with_prefix", "name": "03_autocomplete_collect_words_with_prefix", "area": "tries", "title": "Autocomplete: Collect Words with a Prefix", "key_ops": "walk to the prefix node, DFS below in sorted child order, emit at each end flag", "statement": "Given a word list and a prefix, return every stored word that starts with the prefix, in sorted\norder (duplicates in the input count once). Walk the trie down to the prefix node, then DFS its\nsubtree visiting children in alphabetical order so the words come out sorted for free.\nExample: words [car, card, care, cat, dog], prefix \"car\" -> [car, card, care]", "text": "Autocomplete asks for every stored word that starts with a prefix, and a trie answers in two steps. First walk the prefix character by character; if the path breaks, return an empty list. Then depth-first search below that node, visiting children in alphabetical order so the words come out sorted for free, emitting a word at every end flag. The usual mistake is starting the DFS with an empty string instead of the prefix already spelled. The walk is O(prefix length); the DFS costs the size of the matching subtree.", "py": "class TrieNode:\n    def __init__(self):\n        self.children = {}   # char -> TrieNode\n        self.end = False     # a word ends here\n\n\ndef insert(root, word):\n    \"\"\"Walk down creating missing links, then flag the last node as a word end. O(len).\"\"\"\n    node = root\n    for ch in word:\n        if ch not in node.children:\n            node.children[ch] = TrieNode()\n        node = node.children[ch]\n    node.end = True\n\n\ndef build_trie(words):\n    \"\"\"Insert every word under a fresh root. O(total length).\"\"\"\n    root = TrieNode()\n    for word in words:\n        insert(root, word)\n    return root\n\n\ndef collect(node, word_so_far, out):\n    \"\"\"DFS below node in alphabetical child order; every end flag emits one word.\"\"\"\n    if node.end:\n        out.append(word_so_far)\n    for ch in sorted(node.children):   # sorted children -> sorted output for free\n        collect(node.children[ch], word_so_far + ch, out)\n\n\ndef words_with_prefix(root, prefix):\n    \"\"\"Walk the prefix (O(len)), then DFS only the matching subtree (O(output size)).\"\"\"\n    node = root\n    for ch in prefix:\n        if ch not in node.children:\n            return []   # the path breaks: nothing starts with this prefix\n        node = node.children[ch]\n    out = []\n    collect(node, prefix, out)   # start the DFS with the prefix already spelled\n    return out\n\n\n# --- try it: change the inputs and run ---\nroot = build_trie([\"car\", \"card\", \"care\", \"cat\", \"dog\"])\nprint(words_with_prefix(root, \"car\"))   # -> ['car', 'card', 'care']\nprint(words_with_prefix(root, \"ca\"))    # -> ['car', 'card', 'care', 'cat']\nprint(words_with_prefix(root, \"d\"))     # -> ['dog']\nprint(words_with_prefix(root, \"x\"))     # -> []\nprint(words_with_prefix(root, \"\"))      # -> ['car', 'card', 'care', 'cat', 'dog']\n", "pseudo": "insert(root, word):\n    node = root\n    for each ch in word:\n        if ch not a child of node: add a new child for ch\n        node = that child\n    mark node as a word end\nbuild_trie(words):\n    root = new node, insert every word, return root\ncollect(node, word_so_far, out):\n    if node ends a word: append word_so_far to out\n    for each ch in node's children in sorted order:   (sorted children give sorted output)\n        collect(child for ch, word_so_far + ch, out)\nwords_with_prefix(root, prefix):\n    node = root\n    for each ch in prefix:\n        if ch not a child of node: return empty list\n        node = that child\n    out = empty list\n    collect(node, prefix, out)\n    return out"}]}, {"id": "fund-heap", "topic": "heap", "title": "Heaps and Priority Queues", "intro": "A heap keeps a collection where the smallest (or largest) item is always available in O(log n) p
