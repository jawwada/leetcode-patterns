n false"}}, "find_min_rotated_sorted_array": {"slug": "find_min_rotated_sorted_array", "topic": "binary_search", "title": "Find Minimum in Rotated Sorted Array", "leetcode": 153, "difficulty": "Medium", "pattern": "Binary search on a rotated sorted array", "statement": "A sorted array of distinct integers was rotated between 1 and n times, so [0, 1, 2, 4, 5, 6, 7]\nmay have become [4, 5, 6, 7, 0, 1, 2]. Return the minimum element in O(log n) time.\nExample: nums = [3, 4, 5, 1, 2] -> 1", "why_here": "Sortedness breaks into two runs; the predicate compares mid with the right end, not with a target.", "lc_slug": "find-minimum-in-rotated-sorted-array", "brute": {"text": "Scan the whole array keeping the smallest value seen. The array is two sorted runs glued together and the minimum is exactly the seam, but comparing every element ignores that a single comparison against the right end reveals which run you are standing in.", "time": "O(n)", "space": "O(1)", "py": "def brute_force(nums):\n    \"\"\"Keep the smallest value seen while scanning. O(n) time, O(1) space.\"\"\"\n    best = nums[0]\n    for value in nums:\n        if value < best:\n            best = value\n    return best\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force([3, 4, 5, 1, 2]))          # -> 1\nprint(brute_force([4, 5, 6, 7, 0, 1, 2]))    # -> 0\nprint(brute_force([11, 13, 15, 17]))         # -> 11\nprint(brute_force([2, 1]))                   # -> 1\n", "pseudo": "best = nums[0]\nfor each value in nums:\n    if value < best: best = value\nreturn best"}, "opt": {"text": "The redundancy is testing every element when one comparison can discard half. For any mid, if nums[mid] > nums[hi] then mid is in the left (high) run and the seam is strictly to the right; otherwise mid is in the right (low) run and the minimum is at mid or to its left. That rule is a monotone predicate, so binary search with lo < hi, moving lo = mid + 1 or hi = mid, converges on the seam.", "time": "O(log n)", "space": "O(1)", "py": "def find_min_rotated_sorted_array(nums):\n    \"\"\"Compare mid with the right end to tell which run mid is on. O(log n) time, O(1) space.\"\"\"\n    left = 0\n    right = len(nums) - 1\n    while left < right:\n        mid = (left + right) // 2\n        if nums[mid] > nums[right]:\n            left = mid + 1         # mid is on the high run: the drop is to the right of mid\n        else:\n            right = mid            # mid is on the low run: the minimum is mid or earlier\n    return nums[left]\n\n\n# --- try it: change the inputs and run ---\nprint(find_min_rotated_sorted_array([3, 4, 5, 1, 2]))          # -> 1\nprint(find_min_rotated_sorted_array([4, 5, 6, 7, 0, 1, 2]))    # -> 0\nprint(find_min_rotated_sorted_array([11, 13, 15, 17]))         # -> 11\nprint(find_min_rotated_sorted_array([2, 1]))                   # -> 1\n", "pseudo": "left = 0, right = n - 1\nwhile left < right:\n    mid = (left + right) / 2\n    if nums[mid] > nums[right]: left = mid + 1   (mid is on the high run: the drop is to the right)\n    else: right = mid\nreturn nums[left]"}}, "search_rotated_sorted_array": {"slug": "search_rotated_sorted_array", "topic": "binary_search", "title": "Search in Rotated Sorted Array", "leetcode": 33, "difficulty": "Medium", "pattern": "Binary search on a rotated sorted array", "statement": "A sorted array of distinct integers was rotated at an unknown pivot. Return the index of\ntarget, or -1 if it is absent, in O(log n) time.\nExample: nums = [4, 5, 6, 7, 0, 1, 2], target = 0 -> 4; target = 3 -> -1", "why_here": "Searches a target in the same rotated array by testing whichever half is a clean sorted ramp.", "lc_slug": "search-in-rotated-sorted-array", "brute": {"text": "Linear scan for target. At every element we could tell which of the two sorted runs we are in and discard the entire other side, but a scan discards only one element per comparison.", "time": "O(n)", "space": "O(1)", "py": "def brute_force(nums, target):\n    \"\"\"Check every index. O(n) time, O(1) space.\"\"\"\n    for i in range(len(nums)):\n        if nums[i] == target:\n            return i\n    return -1\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force([4, 5, 6, 7, 0, 1, 2], 0))   # -> 4\nprint(brute_force([4, 5, 6, 7, 0, 1, 2], 3))   # -> -1\nprint(brute_force([3, 1], 1))                  # -> 1\nprint(brute_force([5, 1, 3], 5))               # -> 0\n", "pseudo": "for each index i in nums:\n    if nums[i] == target: return i\nreturn -1"}, "opt": {"text": "The redundancy is not using the fact that for any mid, at least one of [lo, mid] and [mid, hi] is a properly sorted range. If nums[lo] <= nums[mid] the left half is sorted: go left when nums[lo] <= target < nums[mid], otherwise right. Symmetrically when the right half is sorted. Membership in a sorted half is decided in O(1) from its two endpoints, so every probe still halves the range and we never need to locate the pivot first.", "time": "O(log n)", "space": "O(1)", "py": "def search_rotated_sorted_array(nums, target):\n    \"\"\"One half of [left, right] is always sorted; test target against it. O(log n), O(1).\"\"\"\n    left = 0\n    right = len(nums) - 1\n    while left <= right:\n        mid = (left + right) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[left] <= nums[mid]:                          # left half [left, mid] is sorted\n            if nums[left] <= target and target < nums[mid]:\n                right = mid - 1                              # target fits in the sorted half\n            else:\n                left = mid + 1                               # so it must be in the other half\n        else:                                                # right half [mid, right] is sorted\n            if nums[mid] < target and target <= nums[right]:\n                left = mid + 1\n            else:\n                right = mid - 1\n    return -1\n\n\n# --- try it: change the inputs and run ---\nprint(search_rotated_sorted_array([4, 5, 6, 7, 0, 1, 2], 0))   # -> 4\nprint(search_rotated_sorted_array([4, 5, 6, 7, 0, 1, 2], 3))   # -> -1\nprint(search_rotated_sorted_array([3, 1], 1))                  # -> 1\nprint(search_rotated_sorted_array([5, 1, 3], 5))               # -> 0\n", "pseudo": "left = 0, right = n - 1\nwhile left <= right:\n    mid = (left + right) / 2\n    if nums[mid] == target: return mid\n    if nums[left] <= nums[mid]:   (left half [left, mid] is sorted)\n        if nums[left] <= target and target < nums[mid]: right = mid - 1\n        else: left = mid + 1\n    else:   (right half [mid, right] is sorted)\n        if nums[mid] < target and target <= nums[right]: left = mid + 1\n        else: right = mid - 1\nreturn -1"}}, "koko_eating_bananas": {"slug": "koko_eating_bananas", "topic": "binary_search", "title": "Koko Eating Bananas", "leetcode": 875, "difficulty": "Medium", "pattern": "Binary search on the answer", "statement": "piles[i] bananas sit in pile i. Each hour Koko picks one pile and eats up to k bananas from it;\na pile with fewer than k is finished in that hour. Return the minimum integer speed k that lets\nher finish every pile within h hours.\nExample: piles = [3, 6, 7, 11], h = 8 -> 4 (hours at k = 4: 1 + 2 + 2 + 3 = 8)", "why_here": "First binary search on the answer: candidates are speeds and P is a greedy hours count.", "lc_slug": "koko-eating-bananas", "brute": {"text": "Try k = 1, 2, 3, ... and for each compute the total hours sum(ceil(p / k)); return the first k whose hours <= h. We evaluate feasibility for every speed in order, even though once a speed works every larger speed also works, so most checks confirm something already implied.", "time": "O(n * max(piles))", "space": "O(1)", "py": "def brute_force(piles, h):\n    \"\"\"Try speed 1, 2, 3, ... and return the first that finishes in time. O(n * max(piles)).\"\"\"\n    speed = 1\n    while True:\n        hours = 0\n        for pile in piles:\n            hours += (pile + speed - 1) // speed   # pile / speed rounded up\n        if hours <= h:\n            return speed\n        speed += 1\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force([3, 6, 7, 11], 8))          # -> 4\nprint(brute_force([30, 11, 23, 4, 20], 5))    # -> 30\nprint(brute_force([30, 11, 23, 4, 20], 6))    # -> 23\nprint(brute_force([5, 5, 5], 3))              # -> 5\n", "pseudo": "speed = 1\nloop:\n    hours = 0\n    for each pile in piles:\n        hours += pile / speed rounded up\n    if hours <= h: return speed\n    speed += 1"}, "opt": {"text": "The redundancy is linearly scanning a monotone predicate: feasible(k) is False for small k and flips to True exactly once, staying True forever because eating faster never takes more hours. A sequence FFF...FTTT...T is 'sorted', so binary search finds the first T. The search space is the answer itself, k in [1, max(piles)], and the comparison becomes an O(n) feasibility check. Total cost O(n log max(piles)).", "time": "O(n log M)", "space": "O(1)", "py": "def hours_needed(piles, speed):\n    \"\"\"Hours to finish every pile at this speed. O(n).\"\"\"\n    hours = 0\n    for pile in piles:\n        hours += (pile + speed - 1) // speed   # pile / speed rounded up\n    return hours\n\n\ndef koko_eating_bananas(piles, h):\n    \"\"\"Binary search the speed: 'finishes in time' reads False...True. O(n log max(piles)).\"\"\"\n    left = 1\n    right = max(piles)                  # one pile per hour always works\n    while left < right:\n        mid = (left + right) // 2\n        if hours_needed(piles, mid) <= h:\n            right = mid                 # fast enough: mid may be the answer, try slower\n        else:\n            left = mid + 1              # too slow: every speed up to mid fails\n    return left\n\n\n# --- try it: change the inputs and run ---\nprint(koko_eating_bananas([3, 6, 7, 11], 8))          # -> 4\nprint(koko_eating_bananas([30, 11, 23, 4, 20], 5))    # -> 30\nprint(koko_eating_bananas([30, 11, 23, 4, 20], 6))    # -> 23\nprint(koko_eating_bananas([5, 5, 5], 3))              # -> 5\n", "pseudo": "hours_needed(piles, speed):\n    hours = 0\n    for each pile in piles: hours += pile / speed rounded up\n    return hours\nleft = 1, right = max pile\nwhile left < right:\n    mid = (left + right) / 2\n    if hours_needed(piles, mid) <= h: right = mid   (fast enough: try slower)\n    else: left = mid + 1\nreturn left"}}, "reverse_linked_list": {"slug": "reverse_linked_list", "topic": "linked_list", "title": "Reverse Linked List", "leetcode": 206, "difficulty": "Easy", "pattern": "In-place pointer reversal", "statement": "Given the head of a singly linked list, reverse it and return the new head.\nExample: 1 -> 2 -> 3 -> 4 -> 5 -> [5, 4, 3, 2, 1]", "why_here": "The first primitive: flip arrows one at a time with prev/cur/nxt, saving next before each rewire.", "lc_slug": "reverse-linked-list", "brute": {"text": "Walk the list copying the values into a Python list, reverse that list, and build a brand-new linked list from it. We allocate n new nodes (or an n-element array) just to express an order that can be encoded by re-aiming the existing next pointers.", "time": "O(n)", "space": "O(n)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Turn a linked list back into a Python list.\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef brute_force(head):\n    \"\"\"Copy the values out, reverse them, build a brand-new list. O(n) time, O(n) space.\"\"\"\n    values = []\n    node = head\n    while node is not None:\n        values.append(node.val)\n        node = node.next\n    values = values[::-1]          # reversed copy of the list\n    return build_list(values)      # allocates n new nodes\n\n\n# --- try it: change the inputs and run ---\nprint(list_to_array(brute_force(build_list([1, 2, 3, 4, 5]))))   # -> [5, 4, 3, 2, 1]\nprint(list_to_array(brute_force(build_list([1, 2]))))            # -> [2, 1]\nprint(list_to_array(brute_force(build_list([7]))))               # -> [7]\nprint(list_to_array(brute_force(build_list([]))))                # -> []\n", "pseudo": "values = empty list\nnode = head\nwhile node is not null:\n    append node.val to values\n    node = node.next\nvalues = values reversed\nbuild and return a new list from values"}, "opt": {"text": "The redundancy is the extra copy. Reversing means every node's next should point to its predecessor instead of its successor, and that can be done in one pass if at each node we remember the predecessor (prev) and save the successor (nxt) before overwriting next. Three pointers maintain the invariant 'prev heads a fully reversed prefix, cur heads the untouched suffix'; when cur runs off the end, prev is the new head.", "time": "O(n)", "space": "O(1)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Turn a linked list back into a Python list.\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef reverse_linked_list(head):\n    \"\"\"Flip one next pointer at a time with three pointers. O(n) time, O(1) space.\"\"\"\n    prev = None\n    cur = head\n    while cur is not None:\n        nxt = cur.next             # save the rest of the list before breaking the link\n        cur.next = prev            # flip the arrow to point backwards\n        prev = cur\n        cur = nxt\n    return prev                    # cur ran off the end, so prev is the new head\n\n\n# --- try it: change the inputs and run ---\nprint(list_to_array(reverse_linked_list(build_list([1, 2, 3, 4, 5]))))   # -> [5, 4, 3, 2, 1]\nprint(list_to_array(reverse_linked_list(build_list([1, 2]))))            # -> [2, 1]\nprint(list_to_array(reverse_linked_list(build_list([7]))))               # -> [7]\nprint(list_to_array(reverse_linked_list(build_list([]))))                # -> []\n", "pseudo": "prev = null, cur = head\nwhile cur is not null:\n    nxt = cur.next   (save the rest before breaking the link)\n    cur.next = prev\n    prev = cur\n    cur = nxt\nreturn prev"}}, "merge_two_sorted_lists": {"slug": "merge_two_sorted_lists", "topic": "linked_list", "title": "Merge Two Sorted Lists", "leetcode": 21, "difficulty": "Easy", "pattern": "Dummy head + two-pointer merge", "statement": "Merge two sorted linked lists into one sorted list by splicing their nodes together, and\nreturn the head of the merged list.\nExample: 1 -> 2 -> 4 and 1 -> 3 -> 4 -> [1, 1, 2, 3, 4, 4]", "why_here": "The second primitive: a dummy head and a tail pointer that splices existing nodes into an output chain.", "lc_slug": "merge-two-sorted-lists", "brute": {"text": "Collect all values from both lists into an array, sort it, and build a new linked list from the result. Sorting ignores that each input is already sorted (the only unknown is how they interleave), and allocating new nodes is unnecessary when the originals can be re-linked.", "time": "O((m + n) log(m + n))", "space": "O(m + n)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Turn a linked list back into a Python list.\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef brute_force(list1, list2):\n    \"\"\"Collect every value, sort, build a new list. O((m+n) log(m+n)) time, O(m+n) space.\"\"\"\n    values = []\n    node = list1\n    while node is not None:\n        values.append(node.val)\n        node = node.next\n    node = list2\n    while node is not None:\n        values.append(node.val)\n        node = node.next\n    values.sort()                  # re-sorts data that was already sorted\n    return build_list(values)\n\n\n# --- try it: change the inputs and run ---\na = build_list([1, 2, 4])\nb = build_list([1, 3, 4])\nprint(list_to_array(brute_force(a, b)))                       # -> [1, 1, 2, 3, 4, 4]\na = build_list([5])\nb = build_list([1, 2, 3])\nprint(list_to_array(brute_force(a, b)))                       # -> [1, 2, 3, 5]\nprint(list_to_array(brute_force(build_list([]), build_list([0]))))   # -> [0]\nprint(list_to_array(brute_force(build_list([]), build_list([]))))    # -> []\n", "pseudo": "values = empty list\nnode = list1\nwhile node is not null: append node.val to values, node = node.next\nnode = list2\nwhile node is not null: append node.val to values, node = node.next\nsort values\nbuild and return a new list from values"}, "opt": {"text": "The redundancy is re-sorting sorted data. The smallest remaining element overall is always one of the two current heads, so a single comparison decides the next output node. Keep a tail pointer at the end of the merged list, append the smaller head and advance that list. A dummy node in front of the result removes the 'is this the first node?' special case, and when one list runs out the other can be attached whole because it is already sorted.", "time": "O(m + n)", "space": "O(1)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Turn a linked list back into a Python list.\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef merge_two_sorted_lists(list1, list2):\n    \"\"\"Repeatedly take the smaller front node and splice it on. O(m+n) time, O(1) extra.\"\"\"\n    dummy = ListNode()             # placeholder in front of the result\n    tail = dummy\n    while list1 is not None and list2 is not None:\n        if list1.val <= list2.val:\n            tail.next = list1      # hook the smaller front node onto the result\n            list1 = list1.next\n        else:\n            tail.next = list2\n            list2 = list2.next\n        tail = tail.next\n    if list1 is not None:          # one list ran out: attach the rest of the other whole\n        tail.next = list1\n    else:\n        tail.next = list2\n    return dummy.next\n\n\n# --- try it: change the inputs and run ---\na = build_list([1, 2, 4])\nb = build_list([1, 3, 4])\nprint(list_to_array(merge_two_sorted_lists(a, b)))                       # -> [1, 1, 2, 3, 4, 4]\na = build_list([5])\nb = build_list([1, 2, 3])\nprint(list_to_array(merge_two_sorted_lists(a, b)))                       # -> [1, 2, 3, 5]\nprint(list_to_array(merge_two_sorted_lists(build_list([]), build_list([0]))))   # -> [0]\nprint(list_to_array(merge_two_sorted_lists(build_list([]), build_list([]))))    # -> []\n", "pseudo": "dummy = new node, tail = dummy\nwhile list1 and list2 are both not null:\n    if list1.val <= list2.val:\n        tail.next = list1   (hook the smaller front node onto the result)\n        list1 = list1.next\n    else:\n        tail.next = list2\n        list2 = list2.next\n    tail = tail.next\nif list1 is not null: tail.next = list1\nelse: tail.next = list2\nreturn dummy.next"}}, "add_two_numbers": {"slug": "add_two_numbers", "topic": "linked_list", "title": "Add Two Numbers", "leetcode": 2, "difficulty": "Medium", "pattern": "Dummy head + carry", "statement": "Two non-empty linked lists store non-negative integers with their digits in reverse order\n(342 is stored as 2 -> 4 -> 3). Return the sum as a linked list in the same format.\nExample: (2 -> 4 -> 3) + (5 -> 6 -> 4) -> [7, 0, 8], since 342 + 465 = 807", "why_here": "Same dummy-and-tail splice, but the output nodes are new and a carry rides along the lockstep walk.", "lc_slug": "add-two-numbers", "brute": {"text": "Walk each list to rebuild it as an integer, add the two integers, then split the sum back into digits and build a new list. It is linear, but it materialises whole numbers only to tear them apart again, and in a language with fixed-width integers it overflows as soon as the lists are long.", "time": "O(m + n)", "space": "O(m + n)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Turn a linked list back into a Python list.\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef list_to_int(head):\n    \"\"\"Read the whole number out of a list that stores the ones digit first.\"\"\"\n    number = 0\n    place = 1                      # 1, 10, 100, ...\n    node = head\n    while node is not None:\n        number += node.val * place\n        place *= 10\n        node = node.next\n    return number\n\n\ndef brute_force(l1, l2):\n    \"\"\"Turn both lists into integers, add, split the sum back into digits. O(m+n) time.\"\"\"\n    total = list_to_int(l1) + list_to_int(l2)\n    digits = []\n    while total >= 10:\n        digits.append(total % 10)  # peel off the ones digit\n        total = total // 10\n    digits.append(total)\n    return build_list(digits)\n\n\n# --- try it: change the inputs and run ---\na = build_list([2, 4, 3])\nb = build_list([5, 6, 4])\nprint(list_to_array(brute_force(a, b)))                                 # -> [7, 0, 8]\nprint(list_to_array(brute_force(build_list([0]), build_list([0]))))     # -> [0]\nprint(list_to_array(brute_force(build_list([9, 9, 9]), build_list([1]))))   # -> [0, 0, 0, 1]\n", "pseudo": "list_to_int(head):   (the number read with the ones digit first)\n    number = 0, place = 1, node = head\n    while node is not null:\n        number += node.val * place\n        place *= 10, node = node.next\n    return number\ntotal = list_to_int(l1) + list_to_int(l2)\ndigits = empty list\nwhile total >= 10:\n    append total mod 10 to digits\n    total = total / 10\nappend total to digits\nbuild and return a new list from digits"}, "opt": {"text": "Addition is positional: digit i of the sum depends only on digit i of each input plus the carry from digit i-1. Because the lists already store the least-significant digit first, we can add while walking, emitting one output node per step and carrying at most 1. The two conversions disappear and the extra state shrinks to a single carry bit.", "time": "O(max(m, n))", "space": "O(1)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Turn a linked list back into a Python list.\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef add_two_numbers(l1, l2):\n    \"\"\"Schoolbook addition while walking both lists with a carry. O(max(m, n)) time, O(1).\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    carry = 0\n    while l1 is not None or l2 is not None or carry != 0:   # a final carry adds a digit\n        total = carry\n        if l1 is not None:\n            total += l1.val\n            l1 = l1.next\n        if l2 is not None:\n            total += l2.val\n            l2 = l2.next\n        carry = total // 10        # 0 or 1\n        digit = total % 10\n        tail.next = ListNode(digit)\n        tail = tail.next\n    return dummy.next\n\n\n# --- try it: change the inputs and run ---\na = build_list([2, 4, 3])\nb = build_list([5, 6, 4])\nprint(list_to_array(add_two_numbers(a, b)))                                 # -> [7, 0, 8]\nprint(list_to_array(add_two_numbers(build_list([0]), build_list([0]))))     # -> [0]\nprint(list_to_array(add_two_numbers(build_list([9, 9, 9]), build_list([1]))))   # -> [0, 0, 0, 1]\n", "pseudo": "dummy = new node, tail = dummy, carry = 0\nwhile l1 or l2 is not null, or carry != 0:   (a final carry adds a digit)\n    total = carry\n    if l1 is not null: total += l1.val, l1 = l1.next\n    if l2 is not null: total += l2.val, l2 = l2.next\n    carry = total / 10\n    digit = total mod 10\n    tail.next = new node(digit)\n    tail = tail.next\nreturn dummy.next"}}, "remove_nth_from_end": {"slug": "remove_nth_from_end", "topic": "linked_list", "title": "Remove Nth Node From End of List", "leetcode": 19, "difficulty": "Medium", "pattern": "Two pointers with fixed gap", "statement": "Remove the n-th node from the end of a singly linked list and return the head; n is always\nvalid (1 <= n <= length).\nExample: 1 -> 2 -> 3 -> 4 -> 5 with n = 2 -> [1, 2, 3, 5]", "why_here": "Two runners with a fixed gap measure distance from the end in one pass; the dummy makes deleting the head ordinary.", "lc_slug": "remove-nth-node-from-end-of-list", "brute": {"text": "First pass: count the length L. Second pass: walk to node L - n - 1 and unlink its successor. The counting pass exists only to translate 'n from the end' into 'L - n from the start', so every node is traversed twice to learn one number.", "time": "O(n)", "space": "O(1)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Turn a linked list back into a Python list.\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef brute_force(head, n):\n    \"\"\"Count the length, then walk to the node before the victim. O(L) time, two passes.\"\"\"\n    length = 0\n    node = head\n    while node is not None:\n        length += 1\n        node = node.next\n    dummy = ListNode(0, head)      # lets us remove the first node like any other\n    prev = dummy\n    for _ in range(length - n):    # prev stops just before the node to remove\n        prev = prev.next\n    prev.next = prev.next.next     # skip over the victim\n    return dummy.next\n\n\n# --- try it: change the inputs and run ---\nprint(list_to_array(brute_force(build_list([1, 2, 3, 4, 5]), 2)))   # -> [1, 2, 3, 5]\nprint(list_to_array(brute_force(build_list([1]), 1)))               # -> []\nprint(list_to_array(brute_force(build_list([1, 2]), 1)))            # -> [1]\nprint(list_to_array(brute_force(build_list([1, 2]), 2)))            # -> [2]\n", "pseudo": "length = 0, node = head\nwhile node is not null:\n    length += 1, node = node.next\ndummy = new node pointing at head\nprev = dummy\nadvance prev (length - n) times   (prev stops just before the node to remove)\nprev.next = prev.next.next\nreturn dummy.next"}, "opt": {"text": "The redundancy is the counting pass. We do not need L, only a pointer that stops exactly n nodes before the tail. If fast starts n + 1 steps ahead of slow and both move at the same speed, then when fast reaches None slow is n + 1 from the end, i.e. the predecessor of the node to delete. The gap acts as a ruler carried along the list, and a dummy head lets the same code remove the first node.", "time": "O(n)", "space": "O(1)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef list_to_array(head):\n    \"\"\"Turn a linked list back into a Python list.\"\"\"\n    out = []\n    node = head\n    while node is not None:\n        out.append(node.val)\n        node = node.next\n    return out\n\n\ndef remove_nth_from_end(head, n):\n    \"\"\"Two pointers n + 1 apart: when the front falls off, the back is before the victim. O(L).\"\"\"\n    dummy = ListNode(0, head)\n    slow = dummy\n    fast = dummy\n    for _ in range(n + 1):         # open a gap of n + 1 links\n        fast = fast.next\n    while fast is not None:        # slide both until fast falls off the end\n        slow = slow.next\n        fast = fast.next\n    slow.next = slow.next.next     # slow is just before the n-th node from the end\n    return dummy.next\n\n\n# --- try it: change the inputs and run ---\nprint(list_to_array(remove_nth_from_end(build_list([1, 2, 3, 4, 5]), 2)))   # -> [1, 2, 3, 5]\nprint(list_to_array(remove_nth_from_end(build_list([1]), 1)))               # -> []\nprint(list_to_array(remove_nth_from_end(build_list([1, 2]), 1)))            # -> [1]\nprint(list_to_array(remove_nth_from_end(build_list([1, 2]), 2)))            # -> [2]\n", "pseudo": "dummy = new node pointing at head\nslow = dummy, fast = dummy\nadvance fast n + 1 times   (open a gap of n + 1 links)\nwhile fast is not null:\n    slow = slow.next\n    fast = fast.next\nslow.next = slow.next.next\nreturn dummy.next"}}, "linked_list_cycle_ii": {"slug": "linked_list_cycle_ii", "topic": "linked_list", "title": "Linked List Cycle II", "leetcode": 142, "difficulty": "Medium", "pattern": "Floyd's tortoise and hare (fast/slow pointers)", "statement": "Given the head of a linked list, return the node where the cycle begins, or None if there is\nno cycle, without modifying the list and ideally in O(1) extra space.\nExample: 3 -> 2 -> 0 -> -4 -> (back to 2) -> the node holding 2", "why_here": "Turns the meeting point into a ruler: walking from head and from the meeting point at equal speed lands on the loop entrance.", "lc_slug": "linked-list-cycle-ii", "brute": {"text": "Walk the list storing every visited node in a set; the first node already present is the cycle start, and reaching None means no cycle. The set remembers every node merely to answer 'have I been here?', which the rho shape of the structure lets us answer with two pointers and arithmetic instead.", "time": "O(n)", "space": "O(n)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list_with_cycle(values, pos):\n    \"\"\"Build a list whose last node points back to index pos (pos = -1 means no cycle).\"\"\"\n    nodes = []\n    for value in values:\n        nodes.append(ListNode(value))\n    for i in range(len(nodes) - 1):\n        nodes[i].next = nodes[i + 1]\n    if len(nodes) > 0 and pos >= 0:\n        nodes[-1].next = nodes[pos]\n    if len(nodes) == 0:\n        return None\n    return nodes[0]\n\n\ndef node_value(node):\n    \"\"\"The node's value, or None when there is no node (so a result can be printed).\"\"\"\n    if node is None:\n        return None\n    return node.val\n\n\ndef brute_force(head):\n    \"\"\"Remember every node visited; the first repeat starts the cycle. O(n) time, O(n) space.\"\"\"\n    seen = set()\n    node = head\n    while node is not None:\n        if node in seen:\n            return node            # the first node reached twice is where the cycle starts\n        seen.add(node)\n        node = node.next\n    return None                    # fell off the end: no cycle\n\n\n# --- try it: change the inputs and run ---\nprint(node_value(brute_force(build_list_with_cycle([3, 2, 0, -4], 1))))    # -> 2\nprint(node_value(brute_force(build_list_with_cycle([1, 2], 0))))           # -> 1\nprint(node_value(brute_force(build_list_with_cycle([1, 2, 3, 4, 5], 4))))  # -> 5\nprint(node_value(brute_force(build_list_with_cycle([1, 2, 3], -1))))       # -> None\n", "pseudo": "seen = empty set of nodes\nnode = head\nwhile node is not null:\n    if node is in seen: return node   (the first node reached twice starts the cycle)\n    add node to seen\n    node = node.next\nreturn null"}, "opt": {"text": "The redundancy is O(n) memory. First, a slow (1 step) and fast (2 step) pointer must meet inside the loop if one exists, because once both are in the loop fast gains one position per move on a finite circle. Second, with tail length a and the meeting point b steps into a loop of length c: slow walked a + b, fast walked 2(a + b), so a + b = k*c and therefore a = k*c - b, meaning a steps from the meeting point lands exactly on the entrance. Reset one pointer to head, advance both one step at a time, and they collide on the cycle start.", "time": "O(n)", "space": "O(1)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list_with_cycle(values, pos):\n    \"\"\"Build a list whose last node points back to index pos (pos = -1 means no cycle).\"\"\"\n    nodes = []\n    for value in values:\n        nodes.append(ListNode(value))\n    for i in range(len(nodes) - 1):\n        nodes[i].next = nodes[i + 1]\n    if len(nodes) > 0 and pos >= 0:\n        nodes[-1].next = nodes[pos]\n    if len(nodes) == 0:\n        return None\n    return nodes[0]\n\n\ndef node_value(node):\n    \"\"\"The node's value, or None when there is no node (so a result can be printed).\"\"\"\n    if node is None:\n        return None\n    return node.val\n\n\ndef linked_list_cycle_ii(head):\n    \"\"\"Race slow/fast to meet in the loop, then walk from head and meeting point. O(n), O(1).\"\"\"\n    slow = head\n    fast = head\n    while fast is not None and fast.next is not None:\n        slow = slow.next\n        fast = fast.next.next\n        if slow is fast:           # they met: there is a cycle\n            break\n    if fast is None or fast.next is None:\n        return None                # fast fell off the end: no cycle\n    pointer = head\n    while pointer is not slow:     # head and meeting point are equally far from the entrance\n        pointer = pointer.next\n        slow = slow.next\n    return pointer\n\n\n# --- try it: change the inputs and run ---\nprint(node_value(linked_list_cycle_ii(build_list_with_cycle([3, 2, 0, -4], 1))))    # -> 2\nprint(node_value(linked_list_cycle_ii(build_list_with_cycle([1, 2], 0))))           # -> 1\nprint(node_value(linked_list_cycle_ii(build_list_with_cycle([1, 2, 3, 4, 5], 4))))  # -> 5\nprint(node_value(linked_list_cycle_ii(build_list_with_cycle([1, 2, 3], -1))))       # -> None\n", "pseudo": "slow = head, fast = head\nwhile fast and fast.next are not null:\n    slow = slow.next\n    fast = fast.next.next\n    if slow is fast: stop   (they met: there is a cycle)\nif fast or fast.next is null: return null\npointer = head\nwhile pointer is not slow:   (head and meeting point are equally far from the entrance)\n    pointer = pointer.next\n    slow = slow.next\nreturn pointer"}}, "intersection_of_two_linked_lists": {"slug": "intersection_of_two_linked_lists", "topic": "linked_list", "title": "Intersection of Two Linked Lists", "leetcode": 160, "difficulty": "Easy", "pattern": "Length alignment, then lockstep walk", "statement": "Given the heads of two singly linked lists that may merge into a shared tail, return the first\nnode they have in common (the same node object, not just an equal value), or None. The lists\nhave no cycles and must not be modified.\nExample: A = 4 -> 1 -> 8 -> 4 -> 5 and B = 5 -> 6 -> 1 -> 8 -> 4 -> 5 sharing 8 -> 4 -> 5 -> node 8", "why_here": "Equalise the remaining lengths, then walk in lockstep; the gap idea used to align two lists instead of one.", "lc_slug": "intersection-of-two-linked-lists", "brute": {"text": "For every node of A, walk all of B and check whether that exact node appears. B is re-scanned from its head for every node of A, although once the shared tail starts the two lists move in perfect step.", "time": "O(m*n)", "space": "O(1)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef join(head, tail):\n    \"\"\"Attach tail after the last node of head (head may be empty).\"\"\"\n    if head is None:\n        return tail\n    node = head\n    while node.next is not None:\n        node = node.next\n    node.next = tail\n    return head\n\n\ndef build_two_lists(prefix_a, prefix_b, tail):\n    \"\"\"Two lists that end in the very same tail nodes: prefix_a + tail and prefix_b + tail.\"\"\"\n    shared = build_list(tail)\n    head_a = join(build_list(prefix_a), shared)\n    head_b = join(build_list(prefix_b), shared)\n    return head_a, head_b\n\n\ndef node_value(node):\n    \"\"\"The node's value, or None when there is no node (so a result can be printed).\"\"\"\n    if node is None:\n        return None\n    return node.val\n\n\ndef brute_force(head_a, head_b):\n    \"\"\"For every node of A, scan all of B for that same node. O(m * n) time, O(1) space.\"\"\"\n    a = head_a\n    while a is not None:\n        b = head_b\n        while b is not None:\n            if a is b:             # the same node object, not just the same value\n                return a\n            b = b.next\n        a = a.next\n    return None\n\n\n# --- try it: change the inputs and run ---\nhead_a, head_b = build_two_lists([4, 1], [5, 6, 1], [8, 4, 5])\nprint(node_value(brute_force(head_a, head_b)))   # -> 8\nhead_a, head_b = build_two_lists([1, 9, 1], [3], [2, 4])\nprint(node_value(brute_force(head_a, head_b)))   # -> 2\nhead_a, head_b = build_two_lists([2, 6, 4], [1, 5], [])\nprint(node_value(brute_force(head_a, head_b)))   # -> None\nhead_a, head_b = build_two_lists([], [7, 7], [3])\nprint(node_value(brute_force(head_a, head_b)))   # -> 3\n", "pseudo": "a = head_a\nwhile a is not null:\n    b = head_b\n    while b is not null:\n        if a is b: return a   (the same node object, not just the same value)\n        b = b.next\n    a = a.next\nreturn null"}, "opt": {"text": "The redundancy is searching B from scratch for each node of A. Observation: after the merge point both lists share the exact same tail, so they differ only in the lengths of their private prefixes, |m - n|. Advancing the longer list's pointer by that difference puts both pointers the same distance from the end; walking them in lockstep then lands them on the merge node at the same moment, or on None together. Two length counts and one lockstep walk replace the nested scan, with no hash set.", "time": "O(m + n)", "space": "O(1)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef join(head, tail):\n    \"\"\"Attach tail after the last node of head (head may be empty).\"\"\"\n    if head is None:\n        return tail\n    node = head\n    while node.next is not None:\n        node = node.next\n    node.next = tail\n    return head\n\n\ndef build_two_lists(prefix_a, prefix_b, tail):\n    \"\"\"Two lists that end in the very same tail nodes: prefix_a + tail and prefix_b + tail.\"\"\"\n    shared = build_list(tail)\n    head_a = join(build_list(prefix_a), shared)\n    head_b = join(build_list(prefix_b), shared)\n    return head_a, head_b\n\n\ndef node_value(node):\n    \"\"\"The node's value, or None when there is no node (so a result can be printed).\"\"\"\n    if node is None:\n        return None\n    return node.val\n\n\ndef list_length(head):\n    \"\"\"Number of nodes in the list.\"\"\"\n    count = 0\n    node = head\n    while node is not None:\n        count += 1\n        node = node.next\n    return count\n\n\ndef intersection_of_two_linked_lists(head_a, head_b):\n    \"\"\"Skip the longer list's extra prefix, then walk both in lockstep. O(m + n) time, O(1).\"\"\"\n    len_a = list_length(head_a)\n    len_b = list_length(head_b)\n    a = head_a\n    b = head_b\n    for _ in range(len_a - len_b):     # only runs when A is longer\n        a = a.next\n    for _ in range(len_b - len_a):     # only runs when B is longer\n        b = b.next\n    while a is not b:                  # both are now the same distance from the end\n        a = a.next\n        b = b.next\n    return a                           # the shared node, or None if they never meet\n\n\n# --- try it: change the inputs and run ---\nhead_a, head_b = build_two_lists([4, 1], [5, 6, 1], [8, 4, 5])\nprint(node_value(intersection_of_two_linked_lists(head_a, head_b)))   # -> 8\nhead_a, head_b = build_two_lists([1, 9, 1], [3], [2, 4])\nprint(node_value(intersection_of_two_linked_lists(head_a, head_b)))   # -> 2\nhead_a, head_b = build_two_lists([2, 6, 4], [1, 5], [])\nprint(node_value(intersection_of_two_linked_lists(head_a, head_b)))   # -> None\nhead_a, head_b = build_two_lists([], [7, 7], [3])\nprint(node_value(intersection_of_two_linked_lists(head_a, head_b)))   # -> 3\n", "pseudo": "list_length(head) = number of nodes in the list\nlen_a = list_length(head_a), len_b = list_length(head_b)\na = head_a, b = head_b\nadvance a (len_a - len_b) times   (only when A is longer)\nadvance b (len_b - len_a) times   (only when B is longer)\nwhile a is not b:   (both are now the same distance from the end)\n    a = a.next\n    b = b.next\nreturn a"}}, "palindrome_linked_list": {"slug": "palindrome_linked_list", "topic": "linked_list", "title": "Palindrome Linked List", "leetcode": 234, "difficulty": "Easy", "pattern": "Find middle + reverse second half + interleave", "statement": "Return True if a singly linked list reads the same forwards and backwards.\nExample: 1 -> 2 -> 2 -> 1 -> True; 1 -> 2 -> False", "why_here": "First combination of primitives: find the middle, reverse the back half, compare the halves.", "lc_slug": "palindrome-linked-list", "brute": {"text": "Copy the values into an array and check whether it equals its reverse. We materialise the whole sequence only because a singly linked list cannot be walked backwards, but only the second half needs backward access and that can be arranged by reversing it in place.", "time": "O(n)", "space": "O(n)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef brute_force(head):\n    \"\"\"Copy the values into a Python list and compare with its reverse. O(n) time, O(n) space.\"\"\"\n    values = []\n    node = head\n    while node is not None:\n        values.append(node.val)\n        node = node.next\n    return values == values[::-1]  # values[::-1] is the reversed copy\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(build_list([1, 2, 2, 1])))      # -> True\nprint(brute_force(build_list([1, 2])))            # -> False\nprint(brute_force(build_list([1, 2, 3, 2, 1])))   # -> True\nprint(brute_force(build_list([1, 2, 3, 3, 1])))   # -> False\n", "pseudo": "values = empty list\nnode = head\nwhile node is not null:\n    append node.val to values\n    node = node.next\nreturn values == values reversed"}, "opt": {"text": "The redundancy is O(n) memory for backward access. A palindrome check compares position i with position n - 1 - i, i.e. the first half forward against the second half backward. Reversing the second half in place turns 'second half backward' into an ordinary forward walk. Find the middle with slow/fast pointers, reverse from the middle, and walk both halves in lockstep comparing values; the loop is bounded by the shorter (reversed) half so an odd middle element is harmlessly ignored.", "time": "O(n)", "space": "O(1)", "py": "class ListNode:\n    def __init__(self, val=0, next=None):\n        self.val = val\n        self.next = next\n\n\ndef build_list(values):\n    \"\"\"Turn a Python list into a linked list and return its head.\"\"\"\n    dummy = ListNode()\n    tail = dummy\n    for value in values:\n        tail.next = ListNode(value)\n        tail = tail.next\n    return dummy.next\n\n\ndef palindrome_linked_list(head):\n    \"\"\"Find the middle, reverse the second half in place, compare halves. O(n) time, O(1) space.\"\"\"\n    slow = head\n    fast = head\n    while fast is not None and fast.next is not None:   # 1) slow lands on the middle\n        slow = slow.next\n        fast = fast.next.next\n    prev = None\n    cur = slow\n    while cur is not None:                              # 2) reverse from the middle onwards\n        nxt = cur.next\n        cur.next = prev\n        prev = cur\n        cur = nxt\n    first = head\n    second = prev\n    while second is not None:                           # 3) the reversed half is the shorter one\n        if first.val != second.val:\n            return False\n        first = first.next\n        second = second.next\n    return True\n\n\n# --- try it: change the inputs and run ---\nprint(palindrome_linked_list(build_list([1, 2, 2, 1])))      # -> True\nprint(palindrome_linked_list(build_list([1, 2])))            # -> False\nprint(palindrome_linked_list(build_list([1, 2, 3, 2, 1])))   # -> True\nprint(palindrome_linked_list(build_list([1, 2, 3, 3, 1])))   # -> False\n", "pseudo": "slow = head, fast = head\nwhile fast and fast.next are not null:   (slow lands on the middle)\n    slow = slow.next\n    fast = fast.next.next\nprev = null, cur = slow\nwhile cur is not null:   (reverse from the middle onwards)\n    nxt = cur.next, cur.next = prev\n    prev = cur, cur = nxt\nfirst = head, second = prev\nwhile second is not null:   (the reversed half is the shorter one)\n    if first.val != second.val: return false\n    first = first.next, second = second.next\nreturn true"}}, "copy_list_with_random_pointer": {"slug": "copy_list_with_random_pointer", "topic": "linked_list", "title": "Copy List with Random Pointer", "leetcode": 138, "difficulty": "Medium", "pattern": "Interleaved clone (hash map original -> copy, embedded in the list)", "statement": "Each node has val, next and random, where random points to any node in the list or None.\nReturn a deep copy: new nodes whose next and random pointers point to new nodes with the same\nstructure, leaving the original intact. Lists are written as [value, index of random] pairs.\nExample: [[7, None], [13, 0], [11, 4], [10, 2], [1, 0]] -> an identical but independent list", "why_here": "Adds an old-to-new node mapping, then removes the hash map by weaving each clone right after its original.", "lc_slug": "copy-list-with-random-pointer", "brute": {"text": "Copy the list by next only. Then for every node, find the position of its random target by walking the original from the head and counting, and walk the copy the same number of steps to set the clone's random. The 'which clone corresponds to this original' lookup is recomputed by linear search for every node.", "time": "O(n^2)", "space": "O(1)", "py": "class Node:\n    def __init__(self, val=0, next=None, random=None):\n        self.val = val\n        self.next = next\n        self.random = random\n\n\ndef build_random_list(pairs):\n    \"\"\"pairs[i] = [value, index of the random target or None]. Returns the head.\"\"\"\n    nodes = []\n    for pair in pairs:\n        nodes.append(Node(pair[0]))\n    for i in range(len(nodes)):\n        if i + 1 < len(nodes):\n            nodes[i].next = nodes[i + 1]\n        if pairs[i][1] is not None:\n            nodes[i].random = nodes[pairs[i][1]]\n    if len(nodes) == 0:\n        return None\n    return nodes[0]\n\n\ndef random_list_to_array(head):\n    \"\"\"Back to [[value, index of random or None], ...] so a list can be printed.\"\"\"\n    position = {}                  # node -> its index in this list\n    node = head\n    i = 0\n    while node is not None:\n        position[node] = i\n        node = node.next\n        i += 1\n    out = []\n    node = head\n    while node is not None:\n        if node.random is None:\n            out.append([node.val, None])\n        else:\n            out.append([node.val, position[node.random]])\n        node = node.next\n    return out\n\n\ndef position_of(head, target):\n    \"\"\"How many steps it takes to walk from head to target.\"\"\"\n    steps = 0\n    node = head\n    while node is not target:\n        node = node.next\n        steps += 1\n    return steps\n\n\ndef node_at(head, steps):\n    \"\"\"The node that many steps after head.\"\"\"\n    node = head\n    for _ in range(steps):\n        node = node.next\n    return node\n\n\ndef brute_force(head):\n    \"\"\"Copy by next, then locate every random target by counting steps. O(n^2) time.\"\"\"\n    dummy = Node()\n    tail = dummy\n    node = head\n    while node is not None:                 # pass 1: copy values and next pointers only\n        tail.next = Node(node.val)\n        tail = tail.next\n        node = node.next\n    node = head\n    clone = dummy.next\n    while node is not None:                 # pass 2: random = the clone at the same position\n        if node.random is not None:\n            steps = position_of(head, node.random)\n            clone.random = node_at(dummy.next, steps)\n        node = node.next\n        clone = clone.next\n    return dummy.next\n\n\n# --- try it: change the inputs and run ---\noriginal = build_random_list([[7, None], [13, 0], [11, 4], [10, 2], [1, 0]])\ncopied = brute_force(original)\nprint(random_list_to_array(copied))      # -> [[7, None], [13, 0], [11, 4], [10, 2], [1, 0]]\nprint(random_list_to_array(original))    # -> [[7, None], [13, 0], [11, 4], [10, 2], [1, 0]]\ncopied = brute_force(build_random_list([[1, 1], [2, 1]]))\nprint(random_list_to_array(copied))      # -> [[1, 1], [2, 1]]\ncopied = brute_force(build_random_list([]))\nprint(random_list_to_array(copied))      # -> []\n", "pseudo": "position_of(head, target) = steps from head to target\nnode_at(head, steps) = the node that many steps after head\ndummy = new node, tail = dummy, node = head\nwhile node is not null:   (pass 1: copy values and next pointers only)\n    tail.next = new node(node.val)\n    tail = tail.next, node = node.next\nnode = head, clone = dummy.next\nwhile node is not null:   (pass 2: random = the clone at the same position)\n    if node.random is not null:\n        steps = position_of(head, node.random)\n        clone.random = node_at(dummy.next, steps)\n    node = node.next, clone = clone.next\nreturn dummy.next"}, "opt": {"text": "The redundancy is repeatedly rediscovering the original -> clone correspondence. That correspondence is a function from node to node, so store it once: pass 1 creates a clone per node in a dict {orig: clone}, pass 2 sets clone.next = d[orig.next] and clone.random = d[orig.random], giving O(n) time and O(n) space. The map can then be eliminated by interleaving: insert each clone directly after its original (A -> A' -> B -> B'), so d[X] is literally X.next; set randoms with X.next.random = X.random.next; then unweave the two lists for O(1) extra space.", "time": "O(n)", "space": "O(1)", "py": "class Node:\n    def __init__(self, val=0, next=None, random=None):\n        self.val = val\n        self.next = next\n        self.random = random\n\n\ndef build_random_list(pairs):\n    \"\"\"pairs[i] = [value, index of the random target or None]. Returns the head.\"\"\"\n    nodes = []\n    for pair in pairs:\n        nodes.append(Node(pair[0]))\n    for i in range(len(nodes)):\n        if i + 1 < len(nodes):\n            nodes[i].next = nodes[i + 1]\n        if pairs[i][1] is not None:\n            nodes[i].random = nodes[pairs[i][1]]\n    if len(nodes) == 0:\n        return None\n    return nodes[0]\n\n\ndef random_list_to_array(head):\n    \"\"\"Back to [[value, index of random or None], ...] so a list can be printed.\"\"\"\n    position = {}                  # node -> its index in this list\n    node = head\n    i = 0\n    while node is not None:\n        position[node] = i\n        node = node.next\n        i += 1\n    out = []\n    node = head\n    while node is not None:\n        if node.random is None:\n            out.append([node.val, None])\n        else:\n            out.append([node.val, position[node.random]])\n        node = node.next\n    return out\n\n\ndef copy_list_with_random_pointer(head):\n    \"\"\"Weave each clone right after its original, so clone(X) is X.next. O(n) time, O(1) extra.\"\"\"\n    if head is None:\n        return None\n    node = head\n    while node is not None:                 # pass 1: A -> A' -> B -> B' -> ...\n        clone = Node(node.val, node.next)\n        node.next = clone\n        node = clone.next\n    node = head\n    while node is not None:                 # pass 2: the clone of X.random is X.random.next\n        if node.random is not None:\n            node.next.random = node.random.next\n        node = node.next.next               # step over the clone\n    node = head\n    new_head = head.next\n    while node is not None:                 # pass 3: unweave the two lists again\n        clone = node.next\n        node.next = clone.next\n        if clone.next is not None:\n            clone.next = clone.next.next\n        node = node.next\n    return new_head\n\n\n# --- try it: change the inputs and run ---\noriginal = build_random_list([[7, None], [13, 0], [11, 4], [10, 2], [1, 0]])\ncopied = copy_list_with_random_pointer(original)\nprint(random_list_to_array(copied))      # -> [[7, None], [13, 0], [11, 4], [10, 2], [1, 0]]\nprint(random_list_to_array(original))    # -> [[7, None], [13, 0], [11, 4], [10, 2], [1, 0]]\ncopied = copy_list_with_random_pointer(build_random_list([[1, 1], [2, 1]]))\nprint(random_list_to_array(copied))      # -> [[1, 1], [2, 1]]\ncopied = copy_list_with_random_pointer(build_random_list([]))\nprint(random_list_to_array(copied))      # -> []\n", "pseudo": "if head is null: return null\nnode = head\nwhile node is not null:   (pass 1: A -> A' -> B -> B' -> ...)\n    clone = new node(node.val) with next = node.next, node.next = clone, node = clone.next\nnode = head\nwhile node is not null:   (pass 2: the clone of X.random is X.random.next)\n    if node.random is not null: node.next.random = node.random.next\n    node = node.next.next\nnode = head, new_head = head.next\nwhile node is not null:   (pass 3: unweave the two lists again)\n    clone = node.next, node.next = clone.next\n    if clone.next is not null: clone.next = clone.next.next\n    node = node.next\nreturn new_head"}}, "maximum_depth_of_binary_tree": {"slug": "maximum_depth_of_binary_tree", "topic": "trees", "title": "Maximum Depth of Binary Tree", "leetcode": 104, "difficulty": "Easy", "pattern": "Tree recursion (post-order)", "statement": "Return the number of nodes on the longest root-to-leaf path of a binary tree.\nAn empty tree has depth 0.\nExample: [3, 9, 20, None, None, 15, 7] -> 3  (the path 3 -> 20 -> 15)", "why_here": "The first trust-the-child recursion: each node returns one number, 1 + max of its children.", "lc_slug": "maximum-depth-of-binary-tree", "brute": {"text": "Enumerate every root-to-leaf path as an explicit list of values, then take the longest. Each of up to n/2 leaves copies a path of length up to h. The wasted work is materialising the paths at all: only their length is ever used, and every path through a node re-copies the same prefix.", "time": "O(n*h)", "space": "O(n*h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef collect_paths(node, path, paths):\n    \"\"\"Record every root-to-leaf path as its own list of values.\"\"\"\n    if node is None:\n        return\n    path = path + [node.val]           # a fresh copy of the prefix at every node\n    if node.left is None and node.right is None:\n        paths.append(path)\n    collect_paths(node.left, path, paths)\n    collect_paths(node.right, path, paths)\n\n\ndef brute_force(root):\n    \"\"\"List every root-to-leaf path, then take the longest. O(n*h) time and space.\"\"\"\n    paths = []\n    collect_paths(root, [], paths)\n    longest = 0\n    for path in paths:\n        if len(path) > longest:\n            longest = len(path)\n    return longest\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(build_tree([3, 9, 20, None, None, 15, 7])))   # -> 3\nprint(brute_force(build_tree([1, None, 2])))                    # -> 2\nprint(brute_force(build_tree([])))                              # -> 0\nprint(brute_force(build_tree([1, 2, None, 3, None, 4])))        # -> 4\n", "pseudo": "paths = empty list\ncollect_paths(node, path, paths):\n    if the node is empty: return\n    path = path + [node.val]   (a fresh copy of the prefix at every node)\n    if the node is a leaf: add path to paths\n    collect_paths(node.left, path, paths)\n    collect_paths(node.right, path, paths)\ncollect_paths(root, empty path, paths)\nlongest = 0\nfor each path in paths:\n    if length of path > longest: longest = length of path\nreturn longest"}, "opt": {"text": "The redundancy is the repeated prefix: every leaf under a node re-counts the same ancestors. The observation is that a subtree's depth depends only on its two children's depths: depth(node) = 1 + max(depth(left), depth(right)). That gives a post-order recursion where each node is visited once and returns a single integer, so no path storage is needed. Invariant: the value returned for a node is the height of its subtree.", "time": "O(n)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef max_depth(root):\n    \"\"\"depth(node) = 1 + max(depth(left), depth(right)). O(n) time, O(h) stack.\"\"\"\n    if root is None:\n        return 0\n    left_depth = max_depth(root.left)\n    right_depth = max_depth(root.right)\n    return 1 + max(left_depth, right_depth)    # the taller child decides\n\n\n# --- try it: change the inputs and run ---\nprint(max_depth(build_tree([3, 9, 20, None, None, 15, 7])))   # -> 3\nprint(max_depth(build_tree([1, None, 2])))                    # -> 2\nprint(max_depth(build_tree([])))                              # -> 0\nprint(max_depth(build_tree([1, 2, None, 3, None, 4])))        # -> 4\n", "pseudo": "if the root is empty: return 0\nleft depth = max_depth(root.left)\nright depth = max_depth(root.right)\nreturn 1 + max(left depth, right depth)   (the taller child decides)"}}, "invert_binary_tree": {"slug": "invert_binary_tree", "topic": "trees", "title": "Invert Binary Tree", "leetcode": 226, "difficulty": "Easy", "pattern": "Tree recursion (post-order)", "statement": "Mirror a binary tree: swap every node's left and right children, all the way down,\nand return the root.\nExample: [4, 2, 7, 1, 3, 6, 9] -> [4, 7, 2, 9, 6, 3, 1]", "why_here": "Same one-visit-per-node walk, but the work is rewiring pointers instead of computing a value.", "lc_slug": "invert-binary-tree", "brute": {"text": "Build a brand-new mirrored tree: allocate a copy of each node whose left child is the mirror of the original right subtree and vice versa. The wasted work is the allocation itself: every node is copied although nothing about it changes except which pointer is called left and which right.", "time": "O(n)", "space": "O(n)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef tree_to_list(root):\n    \"\"\"Tree -> level-order list with None for missing children, trailing Nones removed.\"\"\"\n    out = []\n    queue = deque([root])\n    while len(queue) > 0:\n        node = queue.popleft()\n        if node is None:\n            out.append(None)\n        else:\n            out.append(node.val)\n            queue.append(node.left)\n            queue.append(node.right)\n    while len(out) > 0 and out[-1] is None:\n        out.pop()\n    return out\n\n\ndef brute_force(root):\n    \"\"\"Build a brand-new mirrored copy of every node. O(n) time, O(n) extra space.\"\"\"\n    if root is None:\n        return None\n    copy = TreeNode(root.val)\n    copy.left = brute_force(root.right)    # the copy's left is the mirror of the old right\n    copy.right = brute_force(root.left)\n    return copy\n\n\n# --- try it: change the inputs and run ---\nprint(tree_to_list(brute_force(build_tree([4, 2, 7, 1, 3, 6, 9]))))   # -> [4, 7, 2, 9, 6, 3, 1]\nprint(tree_to_list(brute_force(build_tree([2, 1, 3]))))               # -> [2, 3, 1]\nprint(tree_to_list(brute_force(build_tree([]))))                      # -> []\nprint(tree_to_list(brute_force(build_tree([1, None, 2]))))            # -> [1, 2]\n", "pseudo": "if the root is empty: return empty\ncopy = new node with root.val   (a brand-new mirrored tree is built)\ncopy.left = brute_force(root.right)\ncopy.right = brute_force(root.left)\nreturn copy"}, "opt": {"text": "The copy is redundant because node values never change; only the two child pointers of each node need to trade places, and that is a local O(1) operation. So one traversal that visits each node once and swaps its children in place is sufficient. Recursion (or an explicit stack) is only the vehicle for reaching every node; the invariant is that when the call on a node returns, its whole subtree is already mirrored.", "time": "O(n)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef tree_to_list(root):\n    \"\"\"Tree -> level-order list with None for missing children, trailing Nones removed.\"\"\"\n    out = []\n    queue = deque([root])\n    while len(queue) > 0:\n        node = queue.popleft()\n        if node is None:\n            out.append(None)\n        else:\n            out.append(node.val)\n            queue.append(node.left)\n            queue.append(node.right)\n    while len(out) > 0 and out[-1] is None:\n        out.pop()\n    return out\n\n\ndef invert_tree(root):\n    \"\"\"Swap the two children of every node in place. O(n) time, O(h) stack.\"\"\"\n    if root is None:\n        return None\n    inverted_right = invert_tree(root.right)\n    inverted_left = invert_tree(root.left)\n    root.left = inverted_right     # swap in place: nothing is copied\n    root.right = inverted_left\n    return root\n\n\n# --- try it: change the inputs and run ---\nprint(tree_to_list(invert_tree(build_tree([4, 2, 7, 1, 3, 6, 9]))))   # -> [4, 7, 2, 9, 6, 3, 1]\nprint(tree_to_list(invert_tree(build_tree([2, 1, 3]))))               # -> [2, 3, 1]\nprint(tree_to_list(invert_tree(build_tree([]))))                      # -> []\nprint(tree_to_list(invert_tree(build_tree([1, None, 2]))))            # -> [1, 2]\n", "pseudo": "if the root is empty: return empty\ninverted right = invert_tree(root.right)\ninverted left = invert_tree(root.left)\nroot.left = inverted right   (swap in place: nothing is copied)\nroot.right = inverted left\nreturn root"}}, "symmetric_tree": {"slug": "symmetric_tree", "topic": "trees", "title": "Symmetric Tree", "leetcode": 101, "difficulty": "Easy", "pattern": "Simultaneous tree recursion", "statement": "Return True if a binary tree is a mirror image of itself around its centre line.\nExample: [1, 2, 2, 3, 4, 4, 3] -> True; [1, 2, 2, None, 3, None, 3] -> False", "why_here": "Lockstep again, but the two fingers move in mirror image: outer with outer, inner with inner.", "lc_slug": "symmetric-tree", "brute": {"text": "Do a level-order walk that lists every child slot of each level (None for a missing child) and check that each level's list reads the same forwards and backwards. Whole levels are materialised and copied before any comparison, so a mismatch deep in one corner is only found after every level above it is fully built.", "time": "O(n)", "space": "O(w)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef brute_force(root):\n    \"\"\"Each level, with None for missing slots, must be a palindrome. O(n) time and space.\"\"\"\n    level = [root]\n    while len(level) > 0:\n        vals = []\n        for node in level:\n            if node is None:\n                vals.append(None)\n            else:\n                vals.append(node.val)\n        if vals != vals[::-1]:          # the level must be a palindrome, empty slots included\n            return False\n        next_level = []\n        for node in level:\n            if node is not None:\n                next_level.append(node.left)\n                next_level.append(node.right)\n        level = next_level\n    return True\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(build_tree([1, 2, 2, 3, 4, 4, 3])))          # -> True\nprint(brute_force(build_tree([1, 2, 2, None, 3, None, 3])))    # -> False\nprint(brute_force(build_tree([])))                             # -> True\nprint(brute_force(build_tree([1, 2, 3])))                      # -> False\n", "pseudo": "level = [root]\nwhile level is not empty:\n    vals = empty list\n    for each node in level: append node.val, or the empty marker for an empty slot\n    if vals != vals reversed: return false   (each level must be a palindrome, empty slots included)\n    next level = empty list\n    for each non-empty node in level: append node.left and node.right to next level\n    level = next level\nreturn true"}, "opt": {"text": "A level palindrome is just slot k from the left paired with slot k from the right. Observation: those pairs are generated recursively, since mirror(a, b) holds exactly when a.val == b.val, mirror(a.left, b.right) and mirror(a.right, b.left). Walking the two halves in lockstep compares each mirror pair directly, needs no padding lists, and the 'and' short-circuits at the first mismatch. Space drops to O(h). This is the original solution.", "time": "O(n)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef is_mirror(a, b):\n    \"\"\"True if subtree a is the mirror image of subtree b.\"\"\"\n    if a is None or b is None:\n        return a is None and b is None     # both missing -> mirror; one missing -> not\n    if a.val != b.val:\n        return False\n    return is_mirror(a.left, b.right) and is_mirror(a.right, b.left)   # outer pair, inner pair\n\n\ndef is_symmetric(root):\n    \"\"\"Walk the two halves in lockstep, comparing mirror pairs. O(n) time, O(h) stack.\"\"\"\n    if root is None:\n        return True\n    return is_mirror(root.left, root.right)\n\n\n# --- try it: change the inputs and run ---\nprint(is_symmetric(build_tree([1, 2, 2, 3, 4, 4, 3])))          # -> True\nprint(is_symmetric(build_tree([1, 2, 2, None, 3, None, 3])))    # -> False\nprint(is_symmetric(build_tree([])))                             # -> True\nprint(is_symmetric(build_tree([1, 2, 3])))                      # -> False\n", "pseudo": "is_mirror(a, b):\n    if a is empty or b is empty: return true only if both are empty\n    if a.val != b.val: return false\n    return is_mirror(a.left, b.right) and is_mirror(a.right, b.left)   (outer pair, inner pair)\nif the root is empty: return true\nreturn is_mirror(root.left, root.right)"}}, "balanced_binary_tree": {"slug": "balanced_binary_tree", "topic": "trees", "title": "Balanced Binary Tree", "leetcode": 110, "difficulty": "Easy", "pattern": "Post-order height with side-channel answer", "statement": "A binary tree is height-balanced if at every node the heights of the left and right\nsubtrees differ by at most 1. Return whether the tree is balanced.\nExample: [3, 9, 20, None, None, 15, 7] -> True; [1, 2, 2, 3, 3, None, None, 4, 4] -> False", "why_here": "Return a height up and fold a check into it, with a -1 sentinel that short-circuits.", "lc_slug": "balanced-binary-tree", "brute": {"text": "At each node compute height(left) and height(right) with a standalone height() function, check that they differ by at most 1, then recurse into both children. The repeated work is height(): a subtree's height is recomputed once for each of its ancestors, O(n^2) on a skewed tree.", "time": "O(n^2)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef height(node):\n    \"\"\"Number of nodes on the longest path down from node.\"\"\"\n    if node is None:\n        return 0\n    return 1 + max(height(node.left), height(node.right))\n\n\ndef brute_force(root):\n    \"\"\"Compare the two subtree heights at every node, recomputing them each time. O(n^2) worst.\"\"\"\n    if root is None:\n        return True\n    if abs(height(root.left) - height(root.right)) > 1:   # heights recomputed at every level\n        return False\n    return brute_force(root.left) and brute_force(root.right)\n\n\n# --- try it: change the inputs and run ---\nprint(brute_force(build_tree([3, 9, 20, None, None, 15, 7])))         # -> True\nprint(brute_force(build_tree([1, 2, 2, 3, 3, None, None, 4, 4])))     # -> False\nprint(brute_force(build_tree([])))                                    # -> True\nprint(brute_force(build_tree([1, 2, None, 3])))                       # -> False\n", "pseudo": "height(node): 0 if empty, else 1 + max(height(node.left), height(node.right))\nif the root is empty: return true\nif |height(root.left) - height(root.right)| > 1: return false   (heights recomputed at every level)\nreturn brute_force(root.left) and brute_force(root.right)"}, "opt": {"text": "height() already visits children before the parent, so the two numbers the balance check needs are produced inside the recursion anyway. Fold the check into height() and return a sentinel (-1) the moment any subtree is unbalanced; every ancestor passes the -1 upward without further work. Each node is visited once. Invariant: height(node) returns the true height if node's subtree is balanced, otherwise -1.", "time": "O(n)", "space": "O(h)", "py": "from collections import deque\n\n\nclass TreeNode:\n    def __init__(self, val=0, left=None, right=None):\n        self.val = val\n        self.left = left\n        self.right = right\n\n\ndef build_tree(vals):\n    \"\"\"Level-order list (None = missing child) -> tree, the LeetCode input format.\"\"\"\n    if len(vals) == 0 or vals[0] is None:\n        return None\n    root = TreeNode(vals[0])\n    queue = deque([root])          # deque: popleft is O(1)\n    i = 1\n    while len(queue) > 0 and i < len(vals):\n        node = queue.popleft()\n        if i < len(vals) and vals[i] is not None:\n            node.left = TreeNode(vals[i])\n            queue.append(node.left)\n        i += 1\n        if i < len(vals) and vals[i] is not None:\n            node.right = TreeNode(vals[i])\n            queue.append(node.right)\n        i += 1\n    return root\n\n\ndef checked_height(node):\n    \"\"\"Height of node's subtree if it is balanced, otherwise -1.\"\"\"\n    if node is None:\n        return 0\n    left = checked_height(node.left)\n    if left < 0:\n        return -1                       # something below is already unbalanced\n    right = checked_height(node.right)\n    if right < 0 or abs(left - right) > 1:\n        return -1\n    return 1 + max(left, right)\n\n\ndef is_balanced(root):\n    \"\"\"Fold the balance check into one height pass. O(n) time, O(h) stack.\"\"\"\n    return checked_height(root) >= 0\n\n\n# --- try it: change the inputs and run ---\nprint(is_balanced(build_tree([3, 9, 20, None, None, 15, 7])))         # -> True\nprint(is_balanced(build_tree([1, 2, 2, 3, 3, None, None, 4, 4])))     # -> False\nprint(is_balanced(build_tree([])))                                    # -> True\nprint(is_balanced(build_tree([1, 2, None, 3])))                       # -> False\n", "pseudo": "checked_height(node):   (height of the subtree if it is balanced, otherwise -1)\n    if the node is empty: return 0\n    left = checked_height(node.left)\n    if left < 0: return -1\n    right = checked_height(node.right)\n    if right < 0 or |left - right| > 1: return -1\n    return 1 + max(left, right)\nreturn checked_height(root) >= 0"}}, "diameter_of_binary_tree": {"slug": "diameter_of_binary_tree", "topic": "trees", "title": "Diameter of Binary Tree", "leetcode": 543, "difficulty": "Easy", "pattern": "Post-order height with side-channel answer", "statement": "The diameter of a binary tree is the number of edges on the longest path between any\ntwo nodes; the path need not pass through the root.\nExample: [1, 2, 3, 4, 5] -> 3  (the path 4 -> 2 -> 1 -> 3)", "why_here": "The full post-order template: return the height up, record left + right on the side.", "lc_slug": "diameter-of-binary-tree", "brute": {"text": "For every node, the longest path bending at that node is height(left) + height(right). Compute height() from scratch at each node and take the maximum. The repeated work is height(): a subtree's height is rec
